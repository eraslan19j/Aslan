name: Fetch Real Fatih (Sultanahmet-Eminönü) Offline Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-fatih:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11 + rasterio for Copernicus DEM GLO-30
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rasterio
        run: pip install --quiet rasterio

      - name: Sample Copernicus DEM GLO-30 (N41 E028) for Fatih
        run: |
          mkdir -p public/derived-data/fatih-sultanahmet-eminonu
          python3 scripts/sample-copernicus-dem.py public/derived-data/fatih-sultanahmet-eminonu/terrain.json

      - name: Fetch OpenStreetMap Overpass & build 300m offline tiles
        run: node scripts/build-fatih-region.mjs

      - name: Show bundle size & quality report
        run: |
          du -sh public/derived-data/fatih-sultanahmet-eminonu
          cat public/derived-data/fatih-sultanahmet-eminonu/quality-report.json

      - name: Commit offline Fatih data pack to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/derived-data/fatih-sultanahmet-eminonu
          if git diff --cached --quiet; then
            echo "No changes to Fatih data pack."
          else
            git commit -m "data(fatih): refresh offline Fatih region pack under derived-data [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
