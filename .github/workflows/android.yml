name: Android APK / AAB (API 36)

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 16 (API 36) platform & build-tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Inspect and verify Debug APK (API 36 + sensorLandscape)
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" istanbul-streets-debug.apk
          APK_SIZE_BYTES=$(stat -c%s istanbul-streets-debug.apk)
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${APK_SIZE_BYTES}/1048576}")
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging istanbul-streets-debug.apk > apk-badging.txt
          grep -q "name='com.istanbulstreets.game'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          ORIENTATION=$("$AAPT2" dump xmltree istanbul-streets-debug.apk --file AndroidManifest.xml | grep -i "screenOrientation" | head -n 1 || true)
          echo "Detected orientation line: ${ORIENTATION}"
          echo "$ORIENTATION" | grep -qE "0x0*6|sensorLandscape|=6([^0-9]|$)"
          {
            echo "## Istanbul Streets — v0.2.0 Debug APK (Esenler Namık Kemal + Fatih · M2 Sürüş & Trafik · API 36)"
            echo ""
            echo "- **Package:** \`com.istanbulstreets.game\`"
            echo "- **Target SDK:** \`36\` (Android 16) · **Min SDK:** \`24\` (Android 7.0+)"
            echo "- **Orientation:** \`sensorLandscape\` (\`${ORIENTATION}\`)"
            echo "- **Debug APK Size:** \`${APK_SIZE_MB} MB\` (${APK_SIZE_BYTES} bytes)"
            echo "- **Default Region:** Esenler / Namık Kemal Mahallesi (SHA-256 verified \`osm_data.zip\` + Copernicus DEM + Overpass, 100% offline 300m tiles)"
            echo "- **Second Region:** Fatih (Sultanahmet–Eminönü) — Duraklat menüsünden geçiş"
            echo "- **M2 Features:** Sürülebilir Sarı Taksi (BİN/İN + 20:9 dokunmatik sürüş kontrolleri), gerçek yol grafı AI trafiği, tüm ibadethanelerde otomatik Güvenli Alan, Ayarlar içi Tanılama Paneli (RAPORU KOPYALA)"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "### Kurulum (Yalnızca Android Telefon)"
            echo "1. Aşağıdaki \`istanbul-streets-debug.apk\` dosyasını telefonuna indir ve dokunarak kur."
            echo "2. Açtıktan sonra sağ üst **Ayarlar → RAPORU KOPYALA** ile gerçek telefon raporunu paylaşabilirsin."
            echo "3. Adım adım rehber: \`docs/USER_TASKS.md\`"
          } > release-notes.md
          cat release-notes.md

      - name: Build Signed Release AAB (when keystore secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No release keystore secret configured yet; skipping signed AAB build."
            exit 0
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
          cd android
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../istanbul-streets-release.aab
          ls -lh ../istanbul-streets-release.aab

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-streets-debug-apk
          path: |
            istanbul-streets-debug.apk
            apk-badging.txt
            release-notes.md

      - name: Upload Signed Release AAB artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-streets-release-aab
          path: istanbul-streets-release.aab
          if-no-files-found: ignore

      - name: Publish Pre-release APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.0 (Esenler Namik Kemal + Fatih · M2 Driving APK - API 36)' }}
          body_path: release-notes.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            istanbul-streets-debug.apk
            istanbul-streets-release.aab
            apk-badging.txt
          fail_on_unmatched_files: false
