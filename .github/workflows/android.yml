name: Android APK / AAB (API 36)

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 16 (API 36) platform & build-tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Inspect and verify Debug APK (API 36 + sensorLandscape)
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" istanbul-streets-debug.apk
          APK_SIZE_BYTES=$(stat -c%s istanbul-streets-debug.apk)
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${APK_SIZE_BYTES}/1048576}")
          AAPT2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging istanbul-streets-debug.apk > apk-badging.txt
          grep -q "name='com.istanbulstreets.game'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          ORIENTATION=$("$AAPT2" dump xmltree istanbul-streets-debug.apk --file AndroidManifest.xml | grep -i "screenOrientation" | head -n 1 || true)
          echo "Detected orientation line: ${ORIENTATION}"
          echo "$ORIENTATION" | grep -qE "0x0*6|sensorLandscape|=6([^0-9]|$)"
          {
            echo "## Istanbul Streets — v0.9.0 Debug APK (GTA-Tarzı Hasar, Katmanlı Motor/Lastik Sesi, OBB Çarpışma, Sade HUD — API 36)"
            echo ""
            echo "- **Package:** \`com.istanbulstreets.game\`"
            echo "- **Target SDK:** \`36\` (Android 16) · **Min SDK:** \`24\` (Android 7.0+)"
            echo "- **Orientation:** \`sensorLandscape\` (\`${ORIENTATION}\`)"
            echo "- **Debug APK Size:** \`${APK_SIZE_MB} MB\` (${APK_SIZE_BYTES} bytes)"
            echo "- **Bölgeler:** Tepe Mahallesi (varsayılan) + Tarihî Yarımada (Duraklat menüsünden geçiş) — %100 çevrimdışı 300m karolar"
            echo "- **v0.9.0 Yenilikler ve Düzeltmeler:**"
            echo "  - **GTA-Tarzı Araç Hasarı:** 10 ayrı gövde paneli (kaput, ön/arka tampon, kapılar, çamurluklar, tavan, ön cam). Çarpma anında panel ezilir, yeterince sertse **kopup fırlar** (yerçekimi + sekme fiziği), ön cam kırılır, hasarlı motor duman çıkarır. Ağır hasarda motor gücü düşer, araç sürünerek gider."
            echo "  - **Araçlar Artık Birbirine Girmiyor:** Daire yaklaşımı yerine gerçek **OBB (yönlü kutu) SAT/MTV** çarpışma çözücü. Temas yaması normal + teğet üzerinde hesaplandığı için PIT manevrası ve kütle paylaşımlı savrulma gerçekçi."
            echo "  - **Yepyeni Motor Sesi:** AudioWorklet DSP tamamen yeniden yazıldı — silindir ateşleme darbe dizisi, egzoz banka gecikmesi, susturucu haznesi, kuyruk borusu dalga kılavuzu, emme Helmholtz rezonansı, supap tıkırtısı, turbo spool/flutter/BOV/wastegate ve overrun patlamaları. Her araç sınıfının kendi ses kimliği var."
            echo "  - **Gerçek Lastik Sesi:** Sabit bant-geçiren yerine kayma hızına bağlı 3 katman — cıyaklama (320–2150 Hz arası kayma ile yükselen temel ton + harmonikler + FM vibrato), kilitli teker kazıması ve yol gürültüsü. Islak/gece zeminde daha yüksek."
            echo "  - **Sade Oyun HUD'u:** Ekrandaki FPS / Çizim / Karo / Bina satırları kaldırıldı (yalnızca Ayarlar → Tanılama'da). Yerine yalnızca hasar aldığında görünen ince bir hasar çubuğu ve araç künyesi geldi."
            echo "  - **Kapı Açma Animasyonu:** Araca binerken sürücü kapısı 0.42 sn'de açılır, 0.30 sn bekler, 0.36 sn'de kapanır."
            echo "  - **NPC Araçlar da Hasar Görüyor:** Çarpılan araç gövdesi ezilir, boyası kir rengine kayar."
            echo "  - **Tam Araç Künyeleri:** 7 aracın motor kodu, hacim, silindir düzeni, sıkıştırma, supap düzeni, güç/tork eğrileri, şanzıman oranları, lastik/fren ölçüleri ve ses kimliği — hepsi fizik modeliyle testle senkron (`docs/plans/VEHICLE_SPECS_V090.md`)."
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "### Kurulum (Yalnızca Android Telefon)"
            echo "1. Aşağıdaki \`istanbul-streets-debug.apk\` dosyasını telefonuna indir ve dokunarak kur."
            echo "2. Açtıktan sonra sağ üst **Ayarlar → RAPORU KOPYALA** ile gerçek telefon raporunu paylaşabilirsin."
            echo "3. Adım adım rehber: \`docs/USER_TASKS.md\`"
          } > release-notes.md
          cat release-notes.md

      - name: Build Signed Release AAB (when keystore secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No release keystore secret configured yet; skipping signed AAB build."
            exit 0
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
          cd android
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../istanbul-streets-release.aab
          ls -lh ../istanbul-streets-release.aab

      - name: Commit the working APK into the repository (releases/)
        # The user requirement is that the playable APK lives in the main repository,
        # not only on a release page. We overwrite a single "latest" file so the repo
        # grows by one APK's worth of history per release instead of many files.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p releases
          cp istanbul-streets-debug.apk releases/istanbul-streets-latest-debug.apk
          {
            echo "# Releases — APK arşivi"
            echo ""
            echo "Bu klasördeki \`istanbul-streets-latest-debug.apk\` **her etiketli sürümde otomatik güncellenir**."
            echo "Git geçmişinden eski sürümlerin APK'larına ulaşabilirsin (\`git log -- releases/\`),"
            echo "ayrıca her sürümün APK'sı GitHub Releases sayfasında da durur."
            echo ""
            echo "| Sürüm | Tarih | APK boyutu |"
            echo "|---|---|---|"
            echo "| ${GITHUB_REF_NAME} | $(date -u +%Y-%m-%d) | $(stat -c%s istanbul-streets-debug.apk) bayt |"
          } > releases/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/istanbul-streets-latest-debug.apk releases/README.md
          if git diff --staged --quiet; then
            echo "APK unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): ${GITHUB_REF_NAME} playable APK -> releases/ [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "APK committed to main."
              exit 0
            fi
            echo "push attempt ${attempt} failed; rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "::error::Could not push the APK to main after 3 attempts"
          exit 1

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-streets-debug-apk
          path: |
            istanbul-streets-debug.apk
            apk-badging.txt
            release-notes.md

      - name: Upload Signed Release AAB artifact (if built)
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-streets-release-aab
          path: istanbul-streets-release.aab
          if-no-files-found: ignore

      - name: Publish Pre-release APK to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.0' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.0 (Crash Damage, Layered Engine & Tyre Audio, OBB Collision - API 36)' }}
          body_path: release-notes.md
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            istanbul-streets-debug.apk
            istanbul-streets-release.aab
            apk-badging.txt
          fail_on_unmatched_files: false
