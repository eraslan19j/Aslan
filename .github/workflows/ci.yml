name: CI (Web + Unit + Headless Smoke)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (including core/Three.js boundary)
        run: npm run lint

      - name: Pure TS core unit tests (including Rapier3D WASM)
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Headless Chromium smoke test (0 console errors + raster check)
        env:
          SMOKE_DURATION_MS: '8000'
          OUT: 'smoke.png'
        run: npm run smoke

      - name: Record smoke metrics to job summary and commit comment
        if: always() && hashFiles('smoke-report.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Headless Chromium Smoke Report (SwiftShader)"
            echo '```json'
            cat smoke-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          BODY=$(printf "CI Smoke Report (\`%s\`):\n\`\`\`json\n%s\n\`\`\`" "${GITHUB_SHA::7}" "$(cat smoke-report.json)")
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$BODY" > /dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            smoke.png
            smoke-report.json
          if-no-files-found: ignore
