name: Fetch & Inspect Esenler (Namık Kemal) Data

# Downloads osm_data.zip, verifies SHA-256, inspects layers, and builds offline 300m tiles.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/**
      - main
    paths:
      - scripts/inspect-esenler-zip.py
      - scripts/build-esenler-region.mjs
      - scripts/sample-copernicus-dem.py
      - .github/workflows/fetch-esenler-data.yml

permissions:
  contents: write

jobs:
  esenler-data:
    name: Inspect / Build Esenler (Namık Kemal) Offline Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, verify SHA-256, and inspect osm_data.zip
        run: python3 scripts/inspect-esenler-zip.py public/derived-data/esenler-namik-kemal/source-inspection.json

      - name: Build Esenler 300m offline pack (when builder script is present)
        if: hashFiles('scripts/build-esenler-region.mjs') != ''
        run: |
          pip install --quiet rasterio
          node scripts/build-esenler-region.mjs

      - name: Commit inspection / derived data back to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/derived-data/esenler-namik-kemal
          if git diff --cached --quiet; then
            echo "No changes to Esenler derived data."
          else
            git commit -m "data(esenler): verify SHA-256 and update Esenler Namik Kemal derived pack [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
