name: Fetch & Build Esenler (Namık Kemal) Data

# Downloads osm_data.zip, verifies SHA-256, inspects GPKG layers,
# supplements missing OSM POIs/worship via Overpass + Copernicus DEM GLO-30,
# and builds offline 300m tiles under public/derived-data/esenler-namik-kemal/.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/**
      - main
    paths:
      - scripts/build-esenler-region.py
      - .github/workflows/fetch-esenler-data.yml

permissions:
  contents: write

jobs:
  esenler-data:
    name: Build Esenler (Namık Kemal) Offline Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python geospatial libraries (shapely, rasterio, pyproj)
        run: pip install --quiet shapely rasterio pyproj

      - name: Verify SHA-256, inspect GPKG, sample Copernicus DEM, and build 300m tiles
        run: python3 scripts/build-esenler-region.py

      - name: Show generated bundle size
        run: du -sh public/derived-data/esenler-namik-kemal

      - name: Commit Esenler offline derived data pack to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/derived-data/esenler-namik-kemal
          if git diff --cached --quiet; then
            echo "No changes to Esenler derived data."
          else
            git commit -m "data(esenler): harvest verified osm_data.zip + Copernicus DEM + Overpass offline pack [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
