name: Android Emulator QA (x86_64 KVM + Screencap + Logcat)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/**
    paths:
      - src/**
      - public/**
      - android/**
      - scripts/android-emulator-qa.sh
      - index.html
      - capacitor.config.ts
      - .github/workflows/android-qa.yml

permissions:
  contents: write

jobs:
  emulator-qa:
    name: Android x86_64 KVM Emulator Visual & Input QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android 16 (API 36) SDK Platform & Build Tools for APK build
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Web + Sync Capacitor + Assemble Debug APK
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM permissions on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -la /dev/kvm || true

      - name: Run Android x86_64 KVM Emulator QA (install, launch, screencap, touch input, back key, logcat)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-qa.sh

      - name: Record Emulator QA summary & commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f qa-out/android/emulator-report.json ]; then
            {
              echo "## Android x86_64 Emulator QA Report"
              echo '```json'
              cat qa-out/android/emulator-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              REPORT=$(cat qa-out/android/emulator-report.json)
              gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
                -f body="$(printf 'Android Emulator QA Report (`%s`):\n```json\n%s\n```' "${GITHUB_SHA::7}" "${REPORT}")" || true
            fi
          fi

      - name: Upload Android Emulator QA Artifacts (PNGs + logcat + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-qa-${{ github.run_id }}
          path: qa-out/android/
          if-no-files-found: warn

      - name: Publish Android Emulator PNGs & Logcat to qa-screens branch (clean old android/ outputs)
        if: always() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d qa-out/android ]; then
            exit 0
          fi
          rm -rf /tmp/qa-android-publish
          if git clone --depth 1 --branch qa-screens "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/qa-android-publish 2>/dev/null; then
            echo "Cloned existing qa-screens branch."
          else
            mkdir -p /tmp/qa-android-publish
            cd /tmp/qa-android-publish
            git init -b qa-screens
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cd /tmp/qa-android-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf android
          mkdir -p android
          cp "${GITHUB_WORKSPACE}/qa-out/android/"*.png android/ 2>/dev/null || true
          cp "${GITHUB_WORKSPACE}/qa-out/android/emulator-report.json" android/ 2>/dev/null || true
          cp "${GITHUB_WORKSPACE}/qa-out/android/display-info.txt" android/ 2>/dev/null || true
          # Keep last 2500 lines of logcat so qa-screens stays compact and easy to inspect
          tail -n 2500 "${GITHUB_WORKSPACE}/qa-out/android/logcat.txt" > android/logcat-tail.txt 2>/dev/null || true
          git add -A android
          if git diff --cached --quiet; then
            echo "No changes to qa-screens android/ outputs."
          else
            git commit -m "qa(android): update x86_64 emulator screencaps and logcat (${GITHUB_SHA::7})"
            for attempt in 1 2 3; do
              if git push origin HEAD:refs/heads/qa-screens; then
                break
              fi
              git fetch origin qa-screens || true
              git rebase origin/qa-screens || true
            done
          fi
