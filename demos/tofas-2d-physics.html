  <b>→/D</b> gaz · <b>←/A</b> fren/geri · <b>↑↓</b> havada yatır ·
  <b>Space</b> el freni · <b>Q/E</b> vites · <b>M</b> manuel ·
  <b>F1</b> teşhis · <b>R</b> sıfırla

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   1980s TURKISH FAMILY SEDAN — 2D SIDE-VIEW DRIVING SIM
   Single file. Vanilla JS. No libraries, images or fonts.

   SECTIONS
     1  CONSTANTS        tunable numbers, all in one place
     2  MATH / NOISE     helpers, deterministic PRNG
     3  TERRAIN          procedural height field + surface query
     4  CAR MODEL        rigid body, wheel bodies, suspension geometry
     5  TIRE             slip-ratio friction curve
     6  ENGINE           torque curve, 4-speed box, limiter, drag
     7  PHYSICS STEP     fixed 120 Hz integration
     8  INPUT            keyboard + touch
     9  RENDER           parallax sky, terrain, car, particles
    10  HUD              speed/rpm/gear + F1 debug panel
   ═══════════════════════════════════════════════════════════════════════════ */

/* ══════════════════════ 1. CONSTANTS ══════════════════════════════════════ */

const FIXED_DT      = 1 / 120;   // physics timestep (s) — 120 Hz
const MAX_SUBSTEPS  = 8;         // clamp substeps per frame (spiral guard)
const GRAVITY       = 9.81;      // m/s²

// ── Body (rigid) ──────────────────────────────────────────────────────────
const BODY_MASS     = 1050;      // kg
const BODY_INERTIA  = 1450;      // kg·m²  ≈ m(L²+H²)/12
const BODY_HALF_L   = 2.15;      // m, half length
const BODY_HALF_H   = 0.50;      // m, half height above body centre
const FRONT_X       =  1.33;     // m, front axle offset from centre
const REAR_X        = -1.33;     // m, rear axle offset (rear-wheel drive)
const AXLE_Y        = -0.36;     // m, suspension mount height on body

// ── Suspension (per corner) ───────────────────────────────────────────────
const SUSP_REST     = 0.56;      // m, free length
const SUSP_MIN      = 0.10;      // m, fully compressed
const SUSP_MAX      = 0.62;      // m, fully drooped
const SUSP_K        = 25000;     // N/m, ride spring per corner (~1.45 Hz)
const SUSP_BUMP     = 150000;    // N/m, stiff secondary spring at the end of travel
const SUSP_C        = 2900;      // N·s/m, damper ζ≈0.40 at the corner mass
// Implicit vertical integrator coefficient.  This is the damped fraction of
// the gap to the contact position that gets closed each step:
const SUSP_C_BASE   = 1500;      // N·s/m, implicit blend coefficient
const PITCH_MAX     = 0.24;      // rad, anti-roll style pitch limit

// Quarter-car effective mass.  Using the wheel mass alone (22 kg) would put the
// natural frequency at 8.4 Hz and make the wheel chatter against a 120 Hz step.
// Folding in the body's share gives a realistic ride frequency.
const M_EFF         = BODY_MASS * 0.5 + 25;         // ≈ 550 kg
// Preload is the spring force that already carries the corner weight when the
// damper is at its rest length.  Measuring deflection from *free length*
// instead looks tidier but forces a 20 cm static sag into 24 cm of travel, so
// the bump stop is engaged while the car is parked and it launches.  Real cars
// preload the spring; the quarter-car model does the same.

const FRONT_WEIGHT  = 0.53;                         // static front axle share
const SUSP_BUMP_AT  = 0.16;                         // m of compression before the end-stop
const STATIC_SAG    = (BODY_MASS * GRAVITY * 0.53) / SUSP_K;  // ≈ 0.218 m of settle

// ── Wheels ────────────────────────────────────────────────────────────────
const WHEEL_MASS    = 22;        // kg
const WHEEL_R       = 0.32;      // m
const WHEEL_INERTIA = 1.27;      // kg·m² (disc approximation)
// Engine + gearbox inertia reflected through the gearbox scales by ratio².
// Ignoring it makes the wheel spin up in one 1/120 s step and oscillate
// violently against the tire reaction.  In 1st gear the reflection is
// 0.16 * 13.7² ≈ 30 kg·m² — twenty times the wheel itself, which is what
// actually keeps the driveline numerically calm.
const ENGINE_INERTIA = 0.16;     // kg·m²
// Clutch.  Without one the engine is bolted to the wheels, so at standstill it
// sits at idle and can only deliver its 800 rpm torque — that is why the car
// needed 22 s to reach 100 km/h.  A slipping clutch lets the engine rev to its
// torque peak while the wheel is still stationary, which is exactly what a
// launch is.  Capacity is the stock 131 clutch.
const CLUTCH_CAP     = 300;      // N·m before it slips outright
const CLUTCH_K       = 26;       // N·m per rad/s of slip

// ── Tire model ────────────────────────────────────────────────────────────
const MU_PEAK       = 1.04;      // peak friction on asphalt
const SLIP_PEAK     = 0.135;     // slip ratio at peak
const SLIP_TAIL     = 0.62;      // ratio where the curve bottoms out
const MU_TAIL_FRAC  = 0.74;      // tail friction as fraction of peak
const V_REF_MIN     = 1.1;       // m/s, slip denominator floor (stability)
const STICTION_V    = 1.6;       // m/s, below this the tire behaves like stiction

// ── Engine ────────────────────────────────────────────────────────────────
const TORQUE_CURVE = [
  [ 700,  72], [1200,  95], [1800, 110], [2400, 118],
  [3000, 115], [3600, 108], [4200,  96], [4800,  82],
  [5400,  66], [6000,  50], [6500,  26],
];
const IDLE_RPM      = 800;
const REDLINE_RPM   = 5800;
const LIMITER_RPM   = 6300;
const ENGINE_BRAKE  = 32;        // N·m off-throttle
const GEAR_RATIOS   = [3.52, 2.14, 1.42, 1.00];   // 4-speed
const FINAL_DRIVE   = 3.90;
const DRIVELINE_EFF = 0.90;
const AUTO_UPSHIFT  = 5350;
const AUTO_DOWNSHIFT= 2050;
const SHIFT_TIME    = 0.26;

// ── Resistance ────────────────────────────────────────────────────────────
const DRAG_COEF     = 0.36;      // Cd (131 shape)
const DRAG_AREA     = 1.82;      // m², frontal area of a 131-sized body
const ROLL_COEF     = 0.0090;
const BRAKE_TORQUE  = 2800;      // N·m at the wheel, full pedal (locks the fronts)
const HANDBRAKE_MU  = 0.78;      // rear grip multiplier with handbrake

/* ══════════════════════ 2. MATH / NOISE ═══════════════════════════════════ */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const TAU   = Math.PI * 2;
const DEG   = 180 / Math.PI;

function wrapAngle(a) {
  while (a >  Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}

// Deterministic PRNG so the same seed always rebuilds the same world.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Smooth 1-D value noise (no period visible over long distances).
function makeNoise(seed) {
  const rnd = mulberry32(seed);
  const N = 1024;
  const tbl = new Float32Array(N);
  for (let i = 0; i < N; i++) tbl[i] = rnd() * 2 - 1;
  return (x) => {
    const xi = Math.floor(x);
    const xf = x - xi;
    const i0 = ((xi % N) + N) % N;
    const i1 = (i0 + 1) % N;
    const t = xf * xf * (3 - 2 * xf);          // smoothstep
    return lerp(tbl[i0], tbl[i1], t);
  };
}

const nHill  = makeNoise(1337);
const nMid   = makeNoise(90210);
const nBump  = makeNoise(4242);
const nGrain = makeNoise(777);

/* ═══════════════════════ 3. TERRAIN ═══════════════════════════════════════ */

/* Everything is driven by one height function, terrainY(x).  A height field
   (not a mesh) means the wheels can query it exactly anywhere — this is what
   makes contact resolution cheap and stable.                                */

const T = {
  hillAmp: 2.60, hillFreq: 0.0072,   // long rolling hills
  midAmp : 0.42, midFreq : 0.0260,   // medium undulation (was too choppy: the
                                     // wheels kept leaving the ground)
  bumpAmp: 0.040, bumpFreq: 0.2400,  // small bumps
  rampX  :  86, rampLen: 22, rampH: 1.9,
  gravelX0: 150, gravelX1: 205,
  gravelEdge: 4,
};

/* Kicker with a smooth crest AND a smooth back side.
   Two failures to avoid here:
     • a concave ramp (t^1.6) acts as a wall — the slope keeps steepening, so
       the nose is always driving into rising ground and the car never
       launches;
     • an abrupt end (height jumping from 3.2 m to 0 over two metres) is a
       88° cliff, and the car's nose punches straight into it.
   A half-cosine rises and falls with zero slope at both ends, so the car
   leaves the crest cleanly and the far side is rideable.                    */
function rampProfile(x) {
  const t = (x - T.rampX) / T.rampLen;
  if (t <= 0 || t >= 1) return 0;
  return T.rampH * Math.sin(Math.PI * t) * Math.sin(Math.PI * t) * 1.0;
}

// 0 = asphalt, 1 = full gravel
function gravelWeight(x) {
  const { gravelX0: a, gravelX1: b, gravelEdge: e } = T;
  if (x < a - e || x > b + e) return 0;
  if (x < a) return clamp((x - (a - e)) / e, 0, 1);
  if (x > b) return clamp(1 - (x - b) / e, 0, 1);
  return 1;
}

function terrainY(x) {
  let y = 0;
  y += Math.sin(x * T.hillFreq) * T.hillAmp;
  y += nHill(x * T.hillFreq * 2.4) * 0.85;
  y += nMid(x * T.midFreq) * T.midAmp;
  y += nBump(x * T.bumpFreq) * T.bumpAmp;
  y += nGrain(x * 1.9) * 0.035;
  y += rampProfile(x);
  return y;
}

function terrainSlope(x) {
  const e = 0.05;
  return (terrainY(x + e) - terrainY(x - e)) / (2 * e);
}

// Surface friction multiplier: asphalt 1.0, gravel 0.55
function surfaceMu(x) {
  return lerp(1.0, 0.55, gravelWeight(x));
}

/* ═══════════════════════ 4. CAR MODEL ═════════════════════════════════════ */

/* Body  : full rigid body — position, angle, linear + angular velocity.
   Wheel : its own body with two degrees of freedom
             · rotation about its axle (omega)
             · travel along the suspension axis (s, sVel)
           The wheel slides on the body's suspension axis; the spring-damper
           acts along that axis.  Two wheels => realistic pitch, and the
           anti-roll limiter caps how far the body can nose-dive.            */

function makeWheel(offsetX, kind) {
  return {
    offsetX,
    kind,                 // 'front' | 'rear'
    s: SUSP_REST,         // extension at full droop (m)
    sVel: 0,              // extension rate (m/s)
    omega: 0,             // spin (rad/s)
    angle: 0,             // accumulated spin angle (rad)
    onGround: false,
    groundDist: SUSP_MAX, // mount -> ground along the axis (m)
    comp: 0,              // 0..1 compression, for visuals
    load: 0,              // N, normal load
    slip: 0,              // slip ratio
    mu: 0,                // friction coefficient in use
    fx: 0,                // longitudinal force (N)
    wx: 0, wy: 0,         // wheel centre, world
    spin: 0,              // wheel surface speed (m/s), telemetry
  };
}

function createCar(x) {
  const wheels = [makeWheel(FRONT_X, 'front'), makeWheel(REAR_X, 'rear')];
  return {
    /* Seating height.  The wheel hangs SUSP_REST below its mount and then
       compresses by STATIC_SAG under the corner weight, so the axle centre
       ends up (SUSP_REST - STATIC_SAG) above the ground.  With AXLE_Y negative
       (mount below the centre of mass) the body centre sits higher still:

           y = ground + R + (REST - SAG) + |AXLE_Y|

       Getting this wrong is what makes the car start embedded in the terrain
       or hovering with zero tyre load — both look identical in a screenshot
       and completely different to the physics.                              */
    /* Seating height.  The mount is placed so the wheel hangs at FULL droop:
           mountY = ground + WHEEL_R + SUSP_REST
       The sag is then applied by the suspension itself as the car settles, so
       it must NOT be pre-applied here — doing both double-counts it, leaves
       the tyre 22 cm in the air and fires a 38 kN spring force on frame one.
       Recalling the sign of AXLE_Y (negative = mount below the body centre):
           y = ground + WHEEL_R + SUSP_REST - AXLE_Y                          */
    x, y: terrainY(x) + WHEEL_R + SUSP_REST - AXLE_Y,
    vx: 0, vy: 0,
    angle: Math.atan2(terrainSlope(x), 1), omega: 0,

    wheels,

    // drivetrain
    rpm: IDLE_RPM,
    engineOmega: IDLE_RPM * TAU / 60,   // rad/s at the crank
    gear: 0,
    manual: false,
    shiftTimer: 0, gearLock: 0,

    // flags
    flipped: false,
    airborne: false,
    airTime: 0,
    landedImpact: 0,

    // smoothed pedal inputs
    throttle: 0, brakePedal: 0, handbrake: 0,
    clutchTorque: 0,
  };
}

// body-local -> world
function toWorld(car, lx, ly) {
  const c = Math.cos(car.angle), s = Math.sin(car.angle);
  return { x: car.x + lx * c - ly * s, y: car.y + lx * s + ly * c };
}

// rotate a body-local vector into world
function rotV(car, vx, vy) {
  const c = Math.cos(car.angle), s = Math.sin(car.angle);
  return { x: vx * c - vy * s, y: vx * s + vy * c };
}

/* ═════════════════════════ 5. TIRE MODEL ══════════════════════════════════ */

/* Slip-ratio curve.  Fx = mu(slip) · Fz · sign term.
   Rises linearly to the peak at SLIP_PEAK, then falls away — this falloff is
   what produces lock-up under braking and wheelspin on loose surfaces.      */

/* Friction coefficient as a function of slip ratio.
   Shape: a steep linear ramp to the grip peak (this rising part is what lets
   the tyre absorb the drive torque smoothly), then the classic falloff to the
   sliding value.  Two details matter numerically:

     1. The ramp must be soft enough that dF/dslip stays finite.  The wheel
        sees Fz ~5 kN, so dF/ds ~ 5 kN/0.035 = 143 kN.  With WHEEL_INERTIA
        1.27 that is a 4000/s eigenvalue and a 120 Hz step screams.
     2. A hard absolute value around slip = 0 makes the force flip sign every
        frame.  Every formula below is written against a *smoothed* magnitude
        so there is no kink at zero.                                        */
function slipMagnitude(slip) {
  // smooth |slip| with a small dead zone so dF/ds is continuous at 0
  const S0 = 0.012;
  const a = Math.abs(slip);
  return a < S0 ? (a * a) / (2 * S0) : a - S0 * 0.5;
}

function muFromSlip(slip) {
  const a = slipMagnitude(slip);
  const sign = slip < 0 ? -1 : 1;

  // rising branch: mu climbs to the peak
  if (a < SLIP_PEAK) {
    const t = a / SLIP_PEAK;
    return sign * MU_PEAK * t;
  }
  // falling branch: peak, then decay towards the sliding value
  const t = Math.min(1, (a - SLIP_PEAK) / (SLIP_TAIL - SLIP_PEAK));
  return sign * lerp(MU_PEAK, MU_PEAK * MU_TAIL_FRAC, t);
}

/* ═════════════════════════ 6. ENGINE ══════════════════════════════════════ */

function torqueAtRpm(rpm) {
  const c = TORQUE_CURVE;
  if (rpm <= c[0][0]) return c[0][1];
  if (rpm >= c[c.length - 1][0]) return c[c.length - 1][1];
  for (let i = 0; i < c.length - 1; i++) {
    if (rpm >= c[i][0] && rpm <= c[i + 1][0]) {
      const t = (rpm - c[i][0]) / (c[i + 1][0] - c[i][0]);
      return lerp(c[i][1], c[i + 1][1], t);
    }
  }
  return 0;
}

const totalRatio = (gear) => GEAR_RATIOS[gear] * FINAL_DRIVE;

// Engine torque at the crank for the current pedal/rpm state.
function engineTorque(car) {
  const rpm = car.rpm;
  if (rpm >= LIMITER_RPM) return 0;                    // rev limiter cuts

  // idle governor: closed throttle still makes enough torque to tick over
  if (car.throttle < 0.02 && rpm < IDLE_RPM * 1.05) {
    return 14 * clamp((IDLE_RPM * 1.05 - rpm) / 220, 0, 1);
  }

  if (car.throttle < 0.02) {
    // closed throttle: engine braking, stronger with rpm
    return -ENGINE_BRAKE * clamp(rpm / 2600, 0.25, 1.5);
  }

  let t = torqueAtRpm(rpm) * car.throttle;
  if (rpm > REDLINE_RPM) {
    const over = (rpm - REDLINE_RPM) / (LIMITER_RPM - REDLINE_RPM);
    t *= Math.max(0, 1 - over * over);                 // soft cut before limiter
  }
  return t;
}

function updateGearbox(car, dt) {
  if (car.shiftTimer > 0) car.shiftTimer -= dt;

  /* Engine speed comes from the engine, not from the wheels — that is what a
     clutch buys.  When the clutch is locked the two agree; while it slips
     (pull-away, gear change, wheelspin) they do not, and the difference is
     the whole point.                                                          */
  // rpm itself is owned by the clutch code in physicsStep; nothing to do here
  car.rpm = clamp(car.rpm, IDLE_RPM * 0.9, LIMITER_RPM);

  if (car.manual || car.shiftTimer > 0) return;

  /* Hysteresis lock.
     Upshift and downshift thresholds close on each other in the middle gears:
     shifting up drops the engine ~40 %, which immediately falls under the
     downshift threshold, so the box hunts between two gears and the car is
     stuck at the lower one.  Holding each gear for a minimum time after a
     change kills the oscillation.                                            */
  car.gearLock = Math.max(0, (car.gearLock || 0) - dt);
  if (car.gearLock > 0) return;

  if (car.rpm > AUTO_UPSHIFT && car.gear < GEAR_RATIOS.length - 1) {
    car.gear++; car.shiftTimer = SHIFT_TIME; car.gearLock = 1.1;
  } else if (car.rpm < AUTO_DOWNSHIFT && car.gear > 0) {
    car.gear--; car.shiftTimer = SHIFT_TIME; car.gearLock = 1.6;
  }
}

/* ═════════════════════════ 7. PHYSICS STEP ════════════════════════════════

   Formulation notes (these are the decisions that make it stable at 120 Hz):

   •  The body is a rigid body integrated with semi-implicit Euler.  y is the
      CENTRE of mass; the wheel mounts sit at AXLE_Y relative to it.

   •  The suspension axis is WORLD VERTICAL, not body-down.  Real dampers are
      body-mounted but the wheel travels near-vertically; using the body axis
      injects horizontal thrust whenever the car pitches, and the car walks
      sideways on its own.

   •  The spring is PRELOADED.  Deflection is measured from rest length with a
      preload force that already carries the corner weight at rest.  Measuring
      from free length instead forces the whole static sag through the travel
      and the car parks on its bump stops.

   •  Vertical travel is solved implicitly.  An explicit spring-damper on a
      550 kg corner with the terrain as a hard constraint needs dt < 1/300 s to
      stay under the stability limit.  We only get 1/120 s, so the vertical
      degree of freedom is integrated with an implicit (unconditionally
      stable) first-order update instead.  It costs one divide and cannot
      blow up.

   •  The wheels are separate bodies with their own spin state.  Their tyre
      forces are relaxed towards the slip-curve value with a rate limit
      (FMAX_RATE) instead of being applied instantly.  Instant application
      gives dF/dv of a few hundred kN/(m/s) on a 1.27 kg·m² wheel — a
      ~4000/s eigenvalue, i.e. a guaranteed frame-to-frame oscillation.  The
      relaxation is not a fudge: real carcasses have exactly this lag.

   •  Brakes act on the wheel spin with an anti-reversal clamp (never spin the
      wheel backwards), and reverse is handled by the gearbox, not by
      inverting the engine torque.
   ═══════════════════════════════════════════════════════════════════════════ */

const FMAX_RATE = 260000;    // N/s, tyre force relaxation (carcass lag)
const FREV_ACCEL = 4.5;      // m/s², reverse thrust once the car is stopped

function physicsStep(dt) {
  const car = state.car;
  if (!car) return;

  const throttleCmd = clamp(state.input.throttle, 0, 1);
  const brakeCmd = clamp(state.input.brake, 0, 1);
  const leanCmd = clamp(state.input.lean, -1, 1);

  car.handbrake = state.input.handbrake ? 1 : Math.max(0, car.handbrake - 4 * dt);

  /* The engine reads car.throttle, not the raw input.  Forgetting to publish
     it leaves the engine stuck on closed throttle, i.e. permanent engine
     braking — the car will not accelerate no matter how long the key is held
     and the rear wheel spins *backwards*.                                    */
  car.throttle = throttleCmd;
  car.brake = brakeCmd;

  const cosA = Math.cos(car.angle);
  const sinA = Math.sin(car.angle);
  const fwdX = cosA, fwdY = sinA;
  const upX = -sinA, upY = cosA;

  let forceX = 0, forceY = -BODY_MASS * GRAVITY;
  let torque = 0;

  /* ── gearbox / engine ─────────────────────────────────────────────────── */
  updateGearbox(car, dt);

  const ratio = totalRatio(car.gear);

  /* ── clutch ───────────────────────────────────────────────────────────────
     Modelled as a governor, not as a stiff coupling.  The crank is pulled
     towards a target speed — idle, or whatever the driven wheels demand,
     whichever is higher — at a bounded rate, and the tyre only ever receives
     the torque the engine can actually make at that speed.  That is what a
     clutch feels like: the engine flares to ~2000 rpm while the car is still
     standing, then locks up and the two speeds converge.

     A mechanical K·Δω coupling (the first attempt) cannot work at a fixed
     120 Hz step: the crank inertia is 0.16 kg·m² against a 13.7:1 first gear,
     so the reflected wheel torque (≈3700 N·m) reverses the crank inside one
     frame.  The rate-limited governor is bounded by construction.            */
  {
    const wOmega = Math.abs(car.wheels[1].omega) * ratio;
    const wheelRpm = (wOmega * 60) / TAU;
    const targetRpm = clamp(Math.max(IDLE_RPM * 1.15, wheelRpm), IDLE_RPM, LIMITER_RPM);
    const maxRate = (throttleCmd > 0.05 ? 5200 : 2600) * dt;   // rpm per step
    car.rpm += clamp(targetRpm - car.rpm, -maxRate, maxRate);
    car.rpm = clamp(car.rpm, IDLE_RPM * 0.9, LIMITER_RPM);
    car.clutchSlip = clamp(Math.abs(targetRpm - car.rpm) / 500, 0, 1);
  }

  /* ── per wheel ────────────────────────────────────────────────────────── */
  for (let i = 0; i < 2; i++) {
    const wh = car.wheels[i];
    const isRear = i === 1;

    /* mount point, world space */
    const rx = wh.offsetX * cosA - AXLE_Y * sinA;
    const ry = wh.offsetX * sinA + AXLE_Y * cosA;
    const mountX = car.x + rx;
    const mountY = car.y + ry;

    /* Static corner load.  The 131 is nose-heavy; a 50/50 split makes the
       driven rear axle run out of grip before the engine runs out of torque.
       This is the spring preload: at ride height it is exactly what the tyre
       has to carry.  */
    // Corner weight — with AXLE_Y negative the mounts sit nearer the middle of
    // the car, so the static split is close to 50/50.  Keep it explicit.
    const preload = (BODY_MASS * GRAVITY) / 2;

    /* mount velocity (v + ω × r) */
    const mountVX = car.vx - car.omega * ry;
    const mountVY = car.vy + car.omega * rx;

    /* ── suspension travel: pure geometry, no state ───────────────────────
       The wheel hangs SUSP_REST below its mount.  Push the car down until the
       tyre touches the ground and the remaining travel is whatever is left:

           s = mountY - ground - WHEEL_R      (clamped to the travel range)

       Making this a *state* that gets integrated is what broke earlier
       revisions: the geometry and the force integration disagree, the spring
       ends up pinned at its preload, and the load split goes nonsense.  A
       raycast suspension is stable precisely because travel is measured, not
       integrated.                                                            */
    /* The wheel rides on the ground; the body floats on the spring above it.
       Travel is the geometric gap between mount and wheel, clamped to the
       real range, and deflection is measured from FREE length:

           s = clamp(mountY - (ground + R), SUSP_MIN, SUSP_MAX)
           x = SUSP_REST - s

       At equilibrium K·x equals the corner weight, so the body settles by
       STATIC_SAG and the spring carries the car with no special-case preload.
       The clamp is what makes this stable: once the body is low enough that
       the raw gap would go below SUSP_MIN, deflection is capped and the force
       stops growing instead of firing the car into orbit.                    */
    /* ── suspension raycast ───────────────────────────────────────────────
       The mount is a point on the body; the wheel hangs SUSP_REST below it.
       The spring is a *preloaded* quarter-car spring whose reference length is
       (SUSP_REST - STATIC_SAG), i.e. the ride height the corner settles to:

           gap  = mountY - ground           mount height above terrain
           sGeo = gap - WHEEL_R             travel available for the wheel
           s    = clamp(sGeo, MIN, MAX)     actual travel
           x    = (REST - SAG) - s          deflection from ride height
           F    = PRELOAD + K·x + endstop + C·v

       At rest x = 0 and F = PRELOAD = corner weight, so the body neither rises
       nor sinks and the tyre carries the car.  This is the only arrangement of
       the three (free length, sag-compensated, preload) that has an equilibrium
       at the ride height *and* a usable end stop.                           */
    /* Contact test in WORLD Y, not against the travel clamp.
       The travel is clamped to [MIN, MAX], so a wheel whose tyre is still
       touching the ground can report s == SUSP_MIN.  Comparing the clamped
       value against SUSP_MAX then declares it airborne — the car spends most
       of a run with one wheel "in the air", loses its load and ricochets off
       the terrain.  The tyre is on the ground exactly when its bottom is at or
       below the surface:

           wheelBottom = mountY - sGeo - WHEEL_R  ≤  ground
           ⇔  sGeo ≥ 0   (never negative while resting)
           and loose (airborne) once sGeo exceeds the full droop.            */
    /* Raycast: the wheel centre hangs `s` below the mount, and the tyre is on
       the ground when that centre is at ground + WHEEL_R:

           mountY - s = ground + R   →   s = mountY - ground - R

       This `s` is the state used for BOTH the spring deflection and the drawn
       wheel position, so the visual and the physics can never disagree.      */
    const ground = terrainY(mountX);
    const sGeo = mountY - ground - WHEEL_R;   // wheel-centre height above rest
    const inContact = sGeo < SUSP_MAX;        // still hanging on the spring
    const s = clamp(sGeo, SUSP_MIN, SUSP_MAX);
    /* Deflection from FREE length.  The tyre touches the ground when the
       wheel centre hangs (REST - sag) below the mount, so at rest
       deflection = sag and K·sag = corner weight.  K and sag are chosen to
       make that identity hold, which is what keeps the car from either
       sinking or launching.                                                  */
    const deflection = SUSP_REST - s;                   // +ve = compressed

    /* Damper rate: the mount's real vertical velocity.  Clamped because a
       single 1/120 s step after a hard landing can otherwise report tens of
       m/s and fire a 40 kN spike through the chassis.                        */
    /* Damper rate = how fast the suspension is compressing in the body's own
       frame = ground velocity minus mount velocity, projected vertically.
       Using the raw mount velocity double-counts the car's own fall and fires
       a 30 kN spike on every landing — the car then ricochets instead of
       settling.                                                               */
    const terrainVY = (terrainY(mountX) - terrainY(mountX - car.vx * dt)) / dt;
    const compVel = clamp(terrainVY - mountVY, -3.0, 3.0);
    wh.sVel = compVel;
    wh.comp = clamp(deflection / (SUSP_REST - SUSP_MIN), 0, 1);
    wh.onGround = inContact && !car.flipped;
    wh.wx = mountX;
    wh.wy = mountY - s;   // wheel centre (s already includes the radius)

    let springForce = 0;
    if (wh.onGround) {
      const endStop = Math.max(0, deflection - SUSP_BUMP_AT) * SUSP_BUMP;
      springForce = preload + SUSP_K * deflection + endStop + SUSP_C * compVel;
      springForce = clamp(springForce, 0, 38000);        // tyre pushes, never pulls
    }
    wh.load = springForce;

    /* ── slip ratio at the contact patch ──────────────────────────────── */
    const vLong = mountVX * fwdX + mountVY * fwdY;
    const surfaceSpeed = wh.omega * WHEEL_R;
    const vRef = Math.max(Math.abs(vLong), V_REF_MIN);
    const slip = inContact ? (surfaceSpeed - vLong) / vRef : 0;
    wh.slip = slip;

    /* ── longitudinal tyre force ──────────────────────────────────────────
       Traction-limited formulation.  The slip curve defines two budgets:
           F_static = MU_PEAK · Fz            (what the tyre can hold)
           F_slide  = MU_PEAK · 0.72 · Fz     (what it gives once sliding)
       The wheel then sits in one of three states, decided by a torque balance
       instead of by integrating a stiff ODE:

         ROLLING   drive/brake within budget → F = T/R, wheel at v/R
         SPINNING  drive exceeds budget      → contact slides at F_slide
         LOCKED    brake exceeds budget      → wheel stops, contact drags

       The slip curve is still what sets the numbers (peak, falloff, gravel,
       handbrake) and the reported slip ratio is the real one; only the
       integration is replaced by a state decision, because the dF/dω
       eigenvalue of a 5 kN corner on a 1.27 kg·m² wheel is far outside the
       stability region at a fixed 1/120 s step.                              */
    wh.slip = 0;

    const surf = surfaceMu(mountX);
    const fz = wh.load;
    const fMax = MU_PEAK * surf * fz;             // static budget
    let fSlide = MU_PEAK * MU_TAIL_FRAC * surf * fz;
    if (isRear && car.handbrake > 0.05) fSlide *= HANDBRAKE_MU;

    /* Drive torque — published by the clutch, above. */
    const tDrive = (isRear && !car.flipped && car.shiftTimer <= 0 && !car.airborne)
      ? engineTorque(car) * throttleCmd * ratio * DRIVELINE_EFF
      : 0;

    const brakeBias = isRear ? 0.42 : 0.58;
    let tBrake = BRAKE_TORQUE * brakeBias * brakeCmd;
    if (isRear) tBrake += 2400 * car.handbrake;
    // engine braking on the driven wheel, only when rolling
    if (isRear && throttleCmd < 0.05 && car.shiftTimer <= 0) {
      tBrake += ENGINE_BRAKE * ratio * 1.6;
    }

    let fx = 0;
    let wheelLocked = false;
    let wheelSpinning = false;

    if (wh.onGround && fz > 1) {
      const fDrive = tDrive / WHEEL_R;
      const fBrake = tBrake / WHEEL_R;
      const moving = Math.abs(vLong) > 0.10;

      if (fBrake > fMax && moving) {
        wheelLocked = true;
        fx = -sign(vLong) * fSlide;
      } else if (fDrive > fMax) {
        wheelSpinning = true;
        fx = fSlide;
      } else {
        fx = fDrive;
        if (moving && tBrake > 0) fx -= sign(vLong) * Math.min(fBrake, fMax);
      }
      fx = clamp(fx, -fMax, fMax);
    }

    /* Wheel state, in the same place and before the force that depends on it. */
    if (car.flipped) {
      wh.omega *= 1 - 3 * dt;
    } else if (wheelLocked) {
      wh.omega = 0;
    } else if (wheelSpinning) {
      let Ieff = WHEEL_INERTIA;
      if (isRear) Ieff += ENGINE_INERTIA * ratio * ratio;
      const surplus = tDrive - fSlide * WHEEL_R;
      wh.omega += (surplus / Ieff) * dt;          // spins up against the road
      wh.omega *= 1 - 1.4 * dt;                   // carcass drag recovers grip
      if (wh.omega * WHEEL_R < vLong) wh.omega = vLong / WHEEL_R;
    } else if (wh.onGround) {
      wh.omega = vLong / WHEEL_R;                 // rolling
    } else {
      wh.omega *= 1 - 0.30 * dt;                  // free in the air
    }

    wh.slip = wh.onGround
      ? (wh.omega * WHEEL_R - vLong) / Math.max(Math.abs(vLong), V_REF_MIN)
      : 0;
    wh.fx = fx;
    wh.mu = fz > 1 ? Math.abs(fx) / fz : 0;

    /* ── apply to body ────────────────────────────────────────────────── */
    forceX += fwdX * fx;
    forceY += fwdY * fx;
    torque += rx * (fwdY * fx) - ry * (fwdX * fx);

    // suspension force is world-vertical
    forceY += springForce;
    torque += rx * springForce;

    /* ── wheel spin state ────────────────────────────────────────────────── */
    if (car.flipped) {
      wh.omega *= 1 - 3 * dt;
    } else if (wheelLocked) {
      wh.omega = 0;
    } else if (wheelSpinning) {
      // surplus torque beyond the sliding budget accelerates the wheel
      let Ieff = WHEEL_INERTIA;
      if (isRear) Ieff += ENGINE_INERTIA * ratio * ratio;
      const surplus = tDrive - sign(tDrive) * fSlide * WHEEL_R;
      wh.omega += (surplus / Ieff) * dt;
      // the tyre must still drag the wheel back towards road speed
      wh.omega *= 1 - 1.2 * dt;
    } else {
      // rolling: the wheel is slaved to the road, exactly like a real one
      wh.omega = vLong / WHEEL_R;
    }
    wh.slip = wh.onGround
      ? (wh.omega * WHEEL_R - vLong) / Math.max(Math.abs(vLong), V_REF_MIN)
      : 0;
    wh.angle += wh.omega * dt;
  }

  /* ── reverse ────────────────────────────────────────────────────────────
     Reversing by negating engine torque fights the brake logic (the player
     holds the same key they use to stop).  Drive it on the body instead, and
     only once the car is actually stopped.                                  */
  /* Reverse.  A single key has to mean "stop" and then "back up", so it only
     engages once the car has actually stopped.  Driving it through the body
     (rather than negating engine torque) keeps it independent of the brake
     logic, which would otherwise cancel it every frame.                      */
  const wantReverse = brakeCmd > 0.35 && car.vx < 1.2 && car.vx > -8 &&
                      Math.abs(car.angle) < 1.2;
  if (wantReverse) {
    const revF = BODY_MASS * FREV_ACCEL * brakeCmd;
    forceX -= fwdX * revF;
    forceY -= fwdY * revF;
  }

  /* ── wheels in the air keep their rotation ───────────────────────────── */
  car.airborne = !car.wheels[0].onGround && !car.wheels[1].onGround;

  /* ── air control ──────────────────────────────────────────────────────── */
  if (car.airborne) {
    torque += leanCmd * 3200;
    car.omega *= 1 - 0.15 * dt;
  }

  /* ── low-speed stiction on the body ──────────────────────────────────────
     Parking on a hill needs friction that the slip curve cannot provide: a
     tyre at zero slip makes zero force, so the car creeps away.  Doing it per
     wheel fights the throttle (a drive torque that spins the wheel up also
     looks like "the patch is moving", so the hold cancels it and the car
     never moves).  Doing it on the body, gated on the pedal, is unambiguous:
     no throttle and no brake → friction brings the car to a stop and keeps it
     there, and the drive force is never touched.                            */
  const settling = throttleCmd < 0.05 && brakeCmd < 0.05 && car.handbrake < 0.1;
  if (settling) {
    const vAbs = Math.abs(car.vx);
    if (vAbs < 1.5) {
      // ≈10 m/s² of friction at full authority, easing to zero as the car
      // stops so it cannot chatter across zero at 120 Hz
      const holdF = clamp(vAbs / 1.5, 0, 1) * MU_PEAK * BODY_MASS * GRAVITY;
      forceX -= sign(car.vx) * holdF;
    }
  }

  /* ── aero drag + rolling resistance ───────────────────────────────────── */
  const speed = Math.hypot(car.vx, car.vy);
  if (speed > 0.01) {
    const dragF = 0.5 * 1.225 * DRAG_COEF * DRAG_AREA * speed * speed;
    forceX -= (car.vx / speed) * dragF;
    forceY -= (car.vy / speed) * dragF;
  }
  if (!car.airborne) {
    // rolling resistance acts along the direction of travel, never past zero
    const rollF = ROLL_COEF * BODY_MASS * GRAVITY * 0.5;
    if (Math.abs(car.vx) > 0.15) forceX -= sign(car.vx) * rollF;
  }

  /* ── vertical damping on the chassis ────────────────────────────────────
     The springs are stiff enough that a rebound overshoots straight back to
     zero load, and the body then free-falls for a few frames before the wheel
     catches it.  A body-level damper (like the friction the tyre carcass and
     seats actually provide) removes that hop without touching the spring. */
  forceY -= car.vy * BODY_MASS * 1.55;

  /* ── integrate ────────────────────────────────────────────────────────── */
  const ax = forceX / BODY_MASS;
  const ay = forceY / BODY_MASS;
  car.vx += ax * dt;
  car.vy += ay * dt;
  car.omega += (torque / BODY_INERTIA) * dt;
  car.omega *= 1 - 0.6 * dt;
  car.x += car.vx * dt;
  car.y += car.vy * dt;
  car.angle += car.omega * dt;

  /* ── pitch limiter (anti-roll style) ──────────────────────────────────── */
  const relPitch = wrapAngle(car.angle - Math.atan2(terrainSlope(car.x), 1));
  if (Math.abs(relPitch) > PITCH_MAX) {
    const over = Math.abs(relPitch) - PITCH_MAX;
    car.angle -= sign(relPitch) * over * Math.min(1, 8 * dt);
    car.omega *= 0.5;
  }

  /* ── body / ground collision + flip detection ─────────────────────────── */
  collideBody(car);

  /* ── bookkeeping ──────────────────────────────────────────────────────── */
  car.shiftTimer = Math.max(0, car.shiftTimer - dt);
  car.distTravelled = Math.abs(car.vx) * dt;

  // skid marks and dust are fed from here
  emitCarEffects(car);
}

/* ── skid marks + dust emission ─────────────────────────────────────────── */
function emitCarEffects(car) {
  const spd = Math.hypot(car.vx, car.vy);
  for (let i = 0; i < 2; i++) {
    const wh = car.wheels[i];
    if (!wh.onGround) continue;
    const slipping = Math.abs(wh.slip) > 0.22;
    if (slipping || (car.handbrake > 0.2 && i === 1)) {
      state.skids.push({
        x: wh.wx, y: terrainY(wh.wx) + 0.02,
        a: Math.min(1, Math.abs(wh.slip) * 1.4) * 0.55,
        w: 0.16 + Math.min(0.1, Math.abs(wh.slip) * 0.08),
      });
      if (state.skids.length > 900) state.skids.shift();
    }
    // gravel / loose surface throws dust
    const loose = gravelWeight(wh.wx) > 0.25;
    if (loose && spd > 4 && Math.random() < 0.55) {
      burstDust(wh.wx, terrainY(wh.wx), 1, Math.min(1, spd / 14));
    }
    if (slipping && spd > 6 && Math.random() < 0.30) {
      burstDust(wh.wx, terrainY(wh.wx) + 0.05, 1, 0.6);
    }
  }
}

/* ── body corner collision ──────────────────────────────────────────────── */
/* The five probe points are the *undercarriage* silhouette, not the whole
   drawn body.  Using the full body box makes the sills sit below ground at
   rest, so this routine pushes the car up every single frame and the wheels
   never get to carry it — the car then hovers with zero tyre load.  The
   silhouette is what actually touches terrain.                              */
const BODY_CORNERS = [
  [-BODY_HALF_L * 0.92, -BODY_HALF_H * 0.62],
  [ BODY_HALF_L * 0.92, -BODY_HALF_H * 0.62],
  [-BODY_HALF_L,        -BODY_HALF_H * 0.10],
  [ BODY_HALF_L,        -BODY_HALF_H * 0.10],
  [ 0,                  -BODY_HALF_H * 0.70],
];

function collideBody(car) {
  let deepest = 0, hit = null;

  for (const [lx, ly] of BODY_CORNERS) {
    const p = toWorld(car, lx, ly);
    const pen = terrainY(p.x) - p.y;
    if (pen > deepest) { deepest = pen; hit = { x: p.x, y: p.y, pen }; }
  }
  if (deepest <= 0 || !hit) return;

  // positional correction, eased so it cannot snap the body upward
  car.y += Math.min(deepest * 0.55, 0.06);

  // impulse: kill the normal component, keep the tangential (with friction)
  const slope = terrainSlope(hit.x);
  const nLen = Math.hypot(slope, 1);
  const nx = -slope / nLen, ny = 1 / nLen;

  const vn = car.vx * nx + car.vy * ny;
  if (vn < 0) {
    const restitution = 0.16;
    car.vx -= (1 + restitution) * vn * nx;
    car.vy -= (1 + restitution) * vn * ny;
    // tangential scrub
    const tx = -ny, ty = nx;
    const vt = car.vx * tx + car.vy * ty;
    car.vx -= vt * 0.35 * tx;
    car.vy -= vt * 0.35 * ty;
    car.omega *= 0.82;
    // settle onto the slope
    const groundAng = Math.atan2(slope, 1);
    car.angle = lerp(car.angle, groundAng, 0.22);
    if (Math.abs(vn) > 3.5) burstDust(hit.x, hit.y, 14, 0.6);
  }
}

/* ═════════════════════════ 8. INPUT ═══════════════════════════════════════ */

const state = {
  car: null,
  input: { throttle: 0, brake: 0, handbrake: 0, lean: 0 },
  keys: Object.create(null),
  dust: [],
  skids: [],
  camX: 0, camY: 0, camVX: 0,
  debug: false,
  flash: 0,
  fps: 0,
  bob: 0,
};

const KEYMAP = {
  ArrowRight: 'thr', KeyD: 'thr',
  ArrowLeft:  'brk', KeyA: 'brk',
  ArrowUp:    'leanUp', ArrowDown: 'leanDown',
  Space:      'hbrk',
};

addEventListener('keydown', (e) => {
  const code = e.code;
  if (code === 'F1') { e.preventDefault(); state.debug = !state.debug; return; }
  if (code === 'KeyR') { e.preventDefault(); resetCar(); return; }
  if (code === 'KeyM') { e.preventDefault(); state.car.manual = !state.car.manual; return; }
  if (code === 'KeyQ') { e.preventDefault(); manualShift(-1); return; }
  if (code === 'KeyE') { e.preventDefault(); manualShift(1); return; }
  const k = KEYMAP[code];
  if (k) { e.preventDefault(); state.keys[k] = true; }
}, { passive: false });

addEventListener('keyup', (e) => {
  const k = KEYMAP[e.code];
  if (k) state.keys[k] = false;
});

addEventListener('blur', () => { state.keys = Object.create(null); });

// Touch: left half = brake/reverse, right half = throttle
const touchPts = new Map();
const cvs = document.getElementById('c');

function syncTouch() {
  let left = false, right = false;
  for (const p of touchPts.values()) {
    if (p.x < innerWidth * 0.5) left = true; else right = true;
  }
  state.keys.brk = left;
  state.keys.thr = right;
}

cvs.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) touchPts.set(t.identifier, { x: t.clientX, y: t.clientY });
  syncTouch();
}, { passive: false });

cvs.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = touchPts.get(t.identifier);
    if (p) { p.x = t.clientX; p.y = t.clientY; }
  }
  syncTouch();
}, { passive: false });

cvs.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) touchPts.delete(t.identifier);
  syncTouch();
}, { passive: false });

cvs.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) touchPts.delete(t.identifier);
  syncTouch();
});

function manualShift(dir) {
  const car = state.car;
  const g = clamp(car.gear + dir, 0, GEAR_RATIOS.length - 1);
  if (g !== car.gear) { car.gear = g; car.shiftTimer = 0.18; }
}

function readInput() {
  const k = state.keys;
  state.input.throttle  = k.thr ? 1 : 0;
  state.input.brake     = k.brk ? 1 : 0;
  state.input.handbrake = k.hbrk ? 1 : 0;
  state.input.lean      = (k.leanUp ? -1 : 0) + (k.leanDown ? 1 : 0);
}

function resetCar() {
  const x = 40;    // flattest stretch of road near the start
  const car = createCar(x);          // createCar already seats the body on the
                                     // springs: y = ground + R + (REST-sag) - AXLE_Y
  car.angle = Math.atan2(terrainSlope(x), 1);
  car.vx = 0; car.vy = 0; car.omega = 0;
  state.car = car;
  state.dust.length = 0;
  state.skids.length = 0;
  state.flash = 0;
  state.bob = 0;
  accumulator = 0;
  state.camX = car.x; state.camY = car.y;
  state.camVX = 0;
}

/* ═════════════════════════ 9. RENDER ══════════════════════════════════════ */

const ctx = cvs.getContext('2d', { alpha: false });
let VW = 0, VH = 0, DPR = 1, PPM = 44;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  VW = innerWidth;
  VH = innerHeight;
  cvs.width  = Math.max(1, Math.floor(VW * DPR));
  cvs.height = Math.max(1, Math.floor(VH * DPR));
  // keep ~13.5 m of road visible horizontally, 7 m vertically
  PPM = clamp(Math.min(VW / 13.5, VH / 6.9), 24, 68);
}
addEventListener('resize', resize);

// world -> screen
const ORIGIN_X = 0.34;   // car sits left of centre so you can see ahead
function sx(wx) { return VW * ORIGIN_X + (wx - state.camX) * PPM; }
function sy(wy) { return VH * 0.62 - (wy - state.camY) * PPM; }

function updateCamera(dt) {
  const car = state.car;
  // look ahead proportional to speed, clamped
  const look = clamp(car.vx * 0.62, -3.2, 8.0);
  const tX = car.x + look;
  const tY = car.y + 0.30;

  const kX = 1 - Math.pow(0.0012, dt);
  const kY = 1 - Math.pow(0.0075, dt);
  state.camX = lerp(state.camX, tX, kX);
  state.camY = lerp(state.camY, tY, kY);
}

/* ── parallax background ────────────────────────────────────────────────── */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VH * 0.80);
  g.addColorStop(0.00, '#6ea7d4');
  g.addColorStop(0.38, '#9dc4e0');
  g.addColorStop(0.68, '#d6e2e9');
  g.addColorStop(1.00, '#efe6d2');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  const sunX = VW * 0.80, sunY = VH * 0.16, rr = Math.max(VH * 0.30, 120);
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, rr);
  sg.addColorStop(0.00, 'rgba(255,248,220,0.95)');
  sg.addColorStop(0.18, 'rgba(255,240,196,0.42)');
  sg.addColorStop(0.55, 'rgba(255,236,188,0.10)');
  sg.addColorStop(1.00, 'rgba(255,236,188,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sunX - rr, sunY - rr, rr * 2, rr * 2);
}

function drawHills() {
  // two parallax bands, each sampling a cheap sine stack in screen space
  const layer = (par, amp, baseOff, fill, seed) => {
    const off = state.camX * par * PPM;
    const base = VH * 0.615 + baseOff - state.camY * par * PPM * 0.45;
    ctx.beginPath();
    ctx.moveTo(-20, VH + 20);
    for (let px = -20; px <= VW + 20; px += 14) {
      const u = (px + off) * 0.0042 + seed;
      const h = Math.sin(u) * 0.62 + Math.sin(u * 2.37 + 1.9) * 0.30 +
                Math.sin(u * 0.53 + 0.4) * 0.5;
      ctx.lineTo(px, base - h * amp);
    }
    ctx.lineTo(VW + 20, VH + 20);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  };
  layer(0.10, VH * 0.085, -VH * 0.035, '#93aebd', 0.0);
  layer(0.20, VH * 0.070,  VH * 0.038, '#7e9aac', 2.6);
}

function drawMidground() {
  const par = 0.42;
  const off = state.camX * par * PPM;
  const baseY = VH * 0.615 + VH * 0.075 - state.camY * par * PPM * 0.5;

  const rnd = mulberry32(20240607);
  // deterministic scrolling list of props, spaced along -x..+x
  const SPACING = VW / 5.5;
  const first = Math.floor((off - SPACING) / SPACING);
  const last  = Math.ceil((off + VW + SPACING) / SPACING);

  for (let i = first; i <= last; i++) {
    const jitter = rnd();
    const px = i * SPACING - off + jitter * SPACING * 0.55;
    if (px < -140 || px > VW + 140) continue;

    const gy = baseY + Math.sin(px * 0.006) * 10;
    const scale = 0.72 + rnd() * 0.5;
    const kind = rnd();

    if (kind < 0.46) {
      // ---- house ----
      const w = (30 + rnd() * 26) * scale;
      const h = (26 + rnd() * 20) * scale;
      ctx.fillStyle = '#e2d8c6';
      ctx.fillRect(px - w / 2, gy - h, w, h + 4);
      // roof
      ctx.fillStyle = '#b06a53';
      ctx.beginPath();
      ctx.moveTo(px - w / 2 - 6 * scale, gy - h);
      ctx.lineTo(px, gy - h - h * 0.46);
      ctx.lineTo(px + w / 2 + 6 * scale, gy - h);
      ctx.closePath();
      ctx.fill();
      // windows
      ctx.fillStyle = 'rgba(72,96,116,0.50)';
      const ww = w * 0.17, wh = h * 0.26;
      ctx.fillRect(px - w * 0.26, gy - h * 0.70, ww, wh);
      ctx.fillRect(px + w * 0.08, gy - h * 0.70, ww, wh);
      // door
      ctx.fillStyle = 'rgba(120,96,72,0.55)';
      ctx.fillRect(px - w * 0.07, gy - h * 0.42, w * 0.14, h * 0.42);
    } else if (kind < 0.86) {
      // ---- tree ----
      const h = (40 + rnd() * 34) * scale;
      ctx.fillStyle = '#6b5540';
      ctx.fillRect(px - 2.4 * scale, gy - h * 0.48, 4.8 * scale, h * 0.48);
      ctx.fillStyle = '#4d7854';
      const r0 = h * 0.30;
      ctx.beginPath();
      ctx.arc(px, gy - h * 0.62, r0, 0, TAU);
      ctx.arc(px - r0 * 0.72, gy - h * 0.48, r0 * 0.70, 0, TAU);
      ctx.arc(px + r0 * 0.72, gy - h * 0.50, r0 * 0.66, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath();
      ctx.arc(px - r0 * 0.28, gy - h * 0.72, r0 * 0.42, 0, TAU);
      ctx.fill();
    } else {
      // ---- utility pole ----
      ctx.fillStyle = '#6d6257';
      const h = 62 * scale;
      ctx.fillRect(px - 1.6 * scale, gy - h, 3.2 * scale, h);
      ctx.fillRect(px - 9 * scale, gy - h * 0.90, 18 * scale, 2.4 * scale);
      ctx.strokeStyle = 'rgba(80,74,66,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px - 9 * scale, gy - h * 0.90);
      ctx.lineTo(px - 9 * scale - SPACING * 0.6, gy - h * 0.74);
      ctx.stroke();
    }
  }
}

/* ── terrain ────────────────────────────────────────────────────────────── */
function drawTerrain() {
  const STEP = 5;
  const pts = [];
  for (let px = -STEP; px <= VW + STEP; px += STEP) {
    const wx = (px - VW * ORIGIN_X) / PPM + state.camX;
    pts.push({ px, py: sy(terrainY(wx)), wx });
  }

  // filled ground
  ctx.beginPath();
  ctx.moveTo(pts[0].px, pts[0].py);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].px, pts[i].py);
  ctx.lineTo(VW + STEP, VH + 40);
  ctx.lineTo(-STEP, VH + 40);
  ctx.closePath();

  const g = ctx.createLinearGradient(0, VH * 0.42, 0, VH);
  g.addColorStop(0.00, '#63676b');
  g.addColorStop(0.35, '#4e5256');
  g.addColorStop(1.00, '#33363a');
  ctx.fillStyle = g;
  ctx.fill();

  // gravel patch tint
  for (let i = 0; i < pts.length - 1; i++) {
    const p = pts[i], q = pts[i + 1];
    const gw = gravelWeight(p.wx);
    if (gw <= 0.02) continue;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(q.px, q.py);
    ctx.lineTo(q.px, VH + 40);
    ctx.lineTo(p.px, VH + 40);
    ctx.closePath();
    ctx.fillStyle = `rgba(172,150,110,${0.40 * gw})`;
    ctx.fill();
  }

  // surface line
  ctx.beginPath();
  ctx.moveTo(pts[0].px, pts[0].py);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].px, pts[i].py);
  ctx.strokeStyle = '#26292c';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  // dashed centre line on flat asphalt
  ctx.save();
  ctx.strokeStyle = 'rgba(230,220,180,0.20)';
  ctx.lineWidth = 2;
  ctx.setLineDash([16, 22]);
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (gravelWeight(p.wx) > 0.3 || rampProfile(p.wx) > 0.01) continue;
    if (i === 0) ctx.moveTo(p.px, p.py - 3);
    else ctx.lineTo(p.px, p.py - 3);
  }
  ctx.stroke();
  ctx.restore();

  // ramp edge markers
  const rx0 = T.rampX, rx1 = T.rampX + T.rampLen;
  ctx.strokeStyle = 'rgba(232,201,90,0.55)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(sx(rx0), sy(terrainY(rx0)));
  ctx.lineTo(sx(rx1), sy(terrainY(rx1)));
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ── particles ──────────────────────────────────────────────────────────── */
function burstDust(wx, wy, count, intensity) {
  const n = Math.min(count | 0, 60);
  for (let i = 0; i < n; i++) {
    if (state.dust.length > 320) break;
    state.dust.push({
      x: wx + (Math.random() - 0.5) * 1.1,
      y: wy + Math.random() * 0.22,
      vx: (Math.random() - 0.5) * (1.6 + intensity * 6),
      vy: Math.random() * (1.0 + intensity * 3.4),
      r: 0.10 + Math.random() * 0.26,
      life: 0.55 + Math.random() * 1.0,
      max: 1.55,
    });
  }
}

function tickParticles(dt) {
  const d = state.dust;
  for (let i = d.length - 1; i >= 0; i--) {
    const p = d[i];
    p.life -= dt;
    if (p.life <= 0) { d.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy -= 2.4 * dt;
    p.vx *= 1 - 1.7 * dt;
  }
  for (let i = state.skids.length - 1; i >= 0; i--) {
    state.skids[i].a -= dt * 0.085;
    if (state.skids[i].a <= 0.015) state.skids.splice(i, 1);
  }
  if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 1.5);
}

function drawParticles() {
  // skid marks first (under the car)
  for (const s of state.skids) {
    ctx.fillStyle = `rgba(24,24,26,${s.a})`;
    ctx.beginPath();
    ctx.ellipse(sx(s.x), sy(s.y), 2.6, 1.5, 0, 0, TAU);
    ctx.fill();
  }
  // dust on top
  for (const p of state.dust) {
    const a = clamp(p.life / p.max, 0, 1);
    const r = Math.max(1, p.r * (1.7 - a * 0.7) * PPM);
    ctx.fillStyle = `rgba(198,182,152,${a * 0.42})`;
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), r, 0, TAU);
    ctx.fill();
  }
}

/* ── the car ────────────────────────────────────────────────────────────── */

/* 1980s Turkish family sedan, Şahin/Fiat-131 lineage:
   squared-off three-box body, flat bonnet and boot, upright greenhouse with
   thin pillars, rectangular headlamps, steel wheels with hubcaps.
   No badges, no lettering. Beige paint.                                     */

function drawCarBody(car) {
  const p = (lx, ly) => [lx * PPM, -ly * PPM];   // body-local metres -> px

  // ---- silhouette ----
  // Right = front.  Points traced clockwise from the rear bumper.
  const OUTLINE = [
    [-2.02, -0.42],  // rear lower
    [-2.09, -0.30],  // rear bumper
    [-2.06, -0.06],
    [-2.00,  0.12],  // boot lid start (flat)
    [-1.28,  0.16],  // boot lid (long, flat)
    [-0.92,  0.44],  // base of rear screen
    [-0.72,  0.60],  // rear screen top
    [-0.52,  0.62],  // roof rear
    [ 0.30,  0.62],  // roof (flat, long)
    [ 0.46,  0.58],  // top of windscreen
    [ 0.92,  0.36],  // windscreen base (upright = thin pillars)
    [ 1.36,  0.30],  // bonnet
    [ 1.92,  0.26],  // bonnet front (flat)
    [ 2.02,  0.14],
    [ 2.09, -0.06],  // front bumper
    [ 2.02, -0.30],
    [ 1.98, -0.42],
    [ 1.34, -0.50],  // sill
    [-1.34, -0.50],
  ];

  ctx.beginPath();
  OUTLINE.forEach(([lx, ly], i) => {
    const [X, Y] = p(lx, ly);
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  });
  ctx.closePath();

  const paint = ctx.createLinearGradient(0, -0.64 * PPM, 0, 0.52 * PPM);
  paint.addColorStop(0.00, '#f6f1e3');
  paint.addColorStop(0.30, '#eae3d2');
  paint.addColorStop(0.58, '#d9d0bc');
  paint.addColorStop(0.80, '#c2b8a1');
  paint.addColorStop(1.00, '#9d9481');
  ctx.fillStyle = paint;
  ctx.fill();
  ctx.strokeStyle = 'rgba(58,52,42,0.55)';
  ctx.lineWidth = Math.max(1, PPM * 0.020);
  ctx.stroke();

  // ---- rocker shadow ----
  ctx.beginPath();
  let A = p(-1.94, -0.50), B = p(1.94, -0.50);
  let C = p(1.94, -0.40), D = p(-1.94, -0.40);
  ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(44,40,34,0.50)';
  ctx.fill();

  // ---- greenhouse (side glass) ----
  // thin B-pillar splits it into two long panes
  const glassGrad = ctx.createLinearGradient(0, -0.58 * PPM, 0, -0.16 * PPM);
  glassGrad.addColorStop(0, 'rgba(138,166,182,0.88)');
  glassGrad.addColorStop(0.55, 'rgba(104,134,152,0.82)');
  glassGrad.addColorStop(1, 'rgba(78,104,122,0.86)');

  // rear pane
  ctx.beginPath();
  A = p(-0.86, 0.30); B = p(-0.68, 0.54);
  C = p(-0.10, 0.55); D = p(-0.10, 0.31);
  ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]);
  ctx.closePath();
  ctx.fillStyle = glassGrad;
  ctx.fill();

  // front pane
  ctx.beginPath();
  A = p(0.02, 0.55); B = p(0.42, 0.54);
  C = p(0.86, 0.32); D = p(0.02, 0.31);
  ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]);
  ctx.closePath();
  ctx.fillStyle = glassGrad;
  ctx.fill();

  // B-pillar (thin, body coloured)
  ctx.beginPath();
  A = p(-0.09, 0.55); B = p(0.01, 0.55);
  C = p(0.01, 0.31); D = p(-0.09, 0.31);
  ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  ctx.lineTo(C[0], C[1]); ctx.lineTo(D[0], D[1]);
  ctx.closePath();
  ctx.fillStyle = 'rgba(226,219,203,0.92)';
  ctx.fill();

  // windscreen highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = Math.max(1, PPM * 0.016);
  A = p(0.10, 0.53); B = p(0.62, 0.35);
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();

  // ---- door shut lines ----
  ctx.strokeStyle = 'rgba(96,88,74,0.40)';
  ctx.lineWidth = Math.max(0.8, PPM * 0.013);
  for (const dx of [-0.96, -0.05, 0.86]) {
    A = p(dx, 0.29); B = p(dx, -0.47);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  }
  // door handles
  ctx.fillStyle = 'rgba(74,68,56,0.75)';
  for (const dx of [-0.30, 0.62]) {
    A = p(dx, 0.10);
    ctx.fillRect(A[0], A[1], PPM * 0.13, PPM * 0.032);
  }

  // ---- rectangular headlamps ----
  ctx.fillStyle = '#fbf6da';
  A = p(1.80, 0.19);
  ctx.fillRect(A[0], A[1], PPM * 0.20, PPM * 0.115);
  ctx.strokeStyle = 'rgba(120,112,96,0.85)';
  ctx.lineWidth = Math.max(0.8, PPM * 0.012);
  ctx.strokeRect(A[0], A[1], PPM * 0.20, PPM * 0.115);
  // amber indicator below
  ctx.fillStyle = '#e79a3e';
  A = p(1.82, 0.065);
  ctx.fillRect(A[0], A[1], PPM * 0.16, PPM * 0.05);

  // ---- tail lamps ----
  ctx.fillStyle = '#b6322a';
  A = p(-2.06, 0.10);
  ctx.fillRect(A[0], A[1], PPM * 0.13, PPM * 0.13);
  ctx.fillStyle = '#d4802a';
  A = p(-2.06, -0.05);
  ctx.fillRect(A[0], A[1], PPM * 0.13, PPM * 0.055);

  // ---- bumpers: dark grey, not chrome ----
  ctx.fillStyle = 'rgba(52,48,42,0.88)';
  A = p(-2.13, -0.30);
  ctx.fillRect(A[0], A[1], PPM * 0.12, PPM * 0.13);
  A = p(2.01, -0.30);
  ctx.fillRect(A[0], A[1], PPM * 0.12, PPM * 0.13);

  // ---- door mirror ----
  ctx.fillStyle = 'rgba(60,55,48,0.9)';
  A = p(0.74, 0.40);
  ctx.fillRect(A[0], A[1], PPM * 0.075, PPM * 0.05);

  // ---- slight body roll sheen along the shoulder ----
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = Math.max(1, PPM * 0.02);
  A = p(-1.9, 0.13); B = p(1.9, 0.20);
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
}

function drawWheel(wh, bodyAngle) {
  const r = WHEEL_R * PPM;
  ctx.save();
  ctx.translate(wh.offsetX * PPM, -(AXLE_Y - wh.s) * PPM);

  // relative spin so the hubcap pattern turns with the wheel
  ctx.rotate(wh.angle - bodyAngle);

  // tyre
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, TAU);
  ctx.fillStyle = '#202024';
  ctx.fill();
  ctx.strokeStyle = 'rgba(8,8,10,0.95)';
  ctx.lineWidth = Math.max(1, PPM * 0.018);
  ctx.stroke();

  // steel wheel face
  const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.08, 0, 0, r * 0.66);
  g.addColorStop(0, '#d3d7db');
  g.addColorStop(0.60, '#b0b5ba');
  g.addColorStop(1, '#8d9297');
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.64, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  // hubcap vents
  ctx.fillStyle = 'rgba(84,90,96,0.80)';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.40, Math.sin(a) * r * 0.40, r * 0.072, 0, TAU);
    ctx.fill();
  }

  // centre cap
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.17, 0, TAU);
  ctx.fillStyle = '#e2e5e8';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,126,132,0.8)';
  ctx.lineWidth = Math.max(0.8, PPM * 0.012);
  ctx.stroke();

  ctx.restore();
}

function drawCar() {
  const car = state.car;
  const bodyAng = car.angle;

  // ---- contact shadow on the ground ----
  const gY = terrainY(car.x);
  const gAng = Math.atan2(terrainSlope(car.x), 1);
  const alt = clamp((car.y - gY) / 3.2, 0, 1);
  ctx.save();
  ctx.translate(sx(car.x), sy(gY));
  ctx.rotate(-gAng);
  ctx.globalAlpha = 0.34 * (1 - alt * 0.75);
  ctx.fillStyle = '#111417';
  ctx.beginPath();
  ctx.ellipse(0, 0, BODY_HALF_L * PPM * 0.96, PPM * 0.14, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  // ---- body transform: one clean pass so helpers work in pixel units ----
  ctx.save();
  ctx.translate(sx(car.x), sy(car.y));
  ctx.rotate(-bodyAng);

  // wheels sit behind the body silhouette
  for (const wh of car.wheels) drawWheel(wh, bodyAng);

  drawCarBody(car);

  // ---- suspension visualisation (only in debug) ----
  if (state.debug) {
    ctx.strokeStyle = 'rgba(120,210,255,0.55)';
    ctx.lineWidth = 1;
    for (const wh of car.wheels) {
      const mx = wh.offsetX * PPM, my = -AXLE_Y * PPM;
      const wx = wh.offsetX * PPM, wy = -(AXLE_Y - wh.s) * PPM;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(wx, wy);
      ctx.stroke();
      // compression bar
      const frac = clamp(wh.comp, 0, 1);
      ctx.fillStyle = `rgba(${Math.round(80 + 175 * frac)},${Math.round(200 - 140 * frac)},90,0.9)`;
      ctx.fillRect(mx - 3, my, 6, (wy - my) * frac);
    }
  }

  ctx.restore();
}

/* ═════════════════════════ 10. HUD ════════════════════════════════════════ */

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  const car = state.car;
  const pad = Math.round(Math.min(VW, VH) * 0.028);
  const bw = clamp(VW * 0.215, 176, 300);
  const bh = clamp(VH * 0.155, 96, 146);
  const bx = pad, by = VH - bh - pad;

  ctx.save();

  // ---- speed / gear panel ----
  ctx.fillStyle = 'rgba(12,16,20,0.76)';
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,201,90,0.34)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  const kmh = Math.hypot(car.vx, car.vy) * 3.6;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#e8c95a';
  ctx.font = `700 ${Math.round(bh * 0.44)}px ui-monospace,Menlo,monospace`;
  ctx.fillText(String(Math.round(kmh)), bx + 14, by + bh * 0.52);

  const numW = ctx.measureText(String(Math.round(kmh))).width;
  ctx.font = `500 ${Math.round(bh * 0.115)}px ui-monospace,Menlo,monospace`;
  ctx.fillStyle = 'rgba(198,208,220,0.78)';
  ctx.fillText('km/h', bx + 14 + numW + 7, by + bh * 0.50);

  // gear
  ctx.textAlign = 'right';
  ctx.font = `700 ${Math.round(bh * 0.32)}px ui-monospace,Menlo,monospace`;
  ctx.fillStyle = car.shiftTimer > 0 ? '#e57f3c' : '#cfd8e2';
  ctx.fillText(String(car.gear + 1), bx + bw - 14, by + bh * 0.46);
  ctx.font = `500 ${Math.round(bh * 0.095)}px ui-monospace,Menlo,monospace`;
  ctx.fillStyle = 'rgba(198,208,220,0.60)';
  ctx.fillText(car.manual ? 'MANUAL' : 'AUTO', bx + bw - 14, by + bh * 0.64);

  // ---- rpm bar ----
  const rpmT = clamp((car.rpm - IDLE_RPM) / (LIMITER_RPM - IDLE_RPM), 0, 1);
  const barX = bx + 14, barY = by + bh - 20, barW = bw - 28, barH = 9;

  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  roundRect(barX, barY, barW, barH, barH * 0.5);
  ctx.fill();

  const rpmCol = rpmT > 0.87 ? '#e0503c' : rpmT > 0.70 ? '#e8c95a' : '#7cc08c';
  ctx.fillStyle = rpmCol;
  roundRect(barX, barY, Math.max(4, barW * rpmT), barH, barH * 0.5);
  ctx.fill();

  // redline marker
  ctx.fillStyle = 'rgba(224,80,60,0.9)';
  ctx.fillRect(barX + barW * 0.90, barY - 2, 2, barH + 4);

  // rpm text
  ctx.textAlign = 'right';
  ctx.font = `500 ${Math.round(bh * 0.095)}px ui-monospace,Menlo,monospace`;
  ctx.fillStyle = 'rgba(198,208,220,0.60)';
  ctx.fillText(Math.round(car.rpm) + ' rpm', bx + bw - 14, barY - 5);

  ctx.restore();

  // ---- gravel warning ----
  if (!car.flipped && gravelWeight(car.x) > 0.45 && (car.wheels[0].onGround || car.wheels[1].onGround)) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.round(clamp(VW * 0.015, 11, 17))}px ui-monospace,Menlo,monospace`;
    ctx.fillStyle = 'rgba(232,201,90,0.88)';
    ctx.fillText('GRAVEL — LOW GRIP', VW / 2, VH * 0.135);
    ctx.restore();
  }

  // ---- debug panel ----
  if (state.debug) drawDebug();

  // ---- flipped overlay ----
  if (car.flipped) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.007);
    ctx.save();
    ctx.fillStyle = `rgba(150,22,18,${0.26 + 0.16 * pulse})`;
    ctx.fillRect(0, 0, VW, VH);

    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,240,232,${0.78 + 0.22 * pulse})`;
    ctx.font = `700 ${Math.round(clamp(VW * 0.062, 34, 82))}px ui-monospace,Menlo,monospace`;
    ctx.fillText('FLIPPED', VW / 2, VH * 0.44);

    ctx.font = `500 ${Math.round(clamp(VW * 0.018, 13, 23))}px ui-monospace,Menlo,monospace`;
    ctx.fillStyle = 'rgba(255,245,238,0.92)';
    ctx.fillText('press  R  to reset', VW / 2, VH * 0.44 + clamp(VW * 0.048, 28, 62));
    ctx.restore();
  }
}

function drawDebug() {
  const car = state.car;
  const f = car.wheels[0], r = car.wheels[1];
  const pad = Math.round(Math.min(VW, VH) * 0.028);
  const w = clamp(VW * 0.315, 240, 396);

  const rows = [
    ['FPS', state.fps ? state.fps.toFixed(0) : '—'],
    ['body angle', (wrapAngle(car.angle) * DEG).toFixed(1) + '°'],
    ['airborne', car.airborne ? 'YES ' + car.airTime.toFixed(2) + 's' : 'no'],
    ['— FRONT WHEEL —', ''],
    ['compression', (f.comp * 100).toFixed(0) + ' %'],
    ['slip ratio', f.slip.toFixed(3)],
    ['load', (f.load / 1000).toFixed(2) + ' kN'],
    ['grip μ', f.mu.toFixed(2)],
    ['— REAR WHEEL —', ''],
    ['compression', (r.comp * 100).toFixed(0) + ' %'],
    ['slip ratio', r.slip.toFixed(3)],
    ['load', (r.load / 1000).toFixed(2) + ' kN'],
    ['grip μ', r.mu.toFixed(2)],
    ['— ENGINE —', ''],
    ['torque', (engineTorque(car) | 0) + ' N·m'],
    ['gear ratio', totalRatio(car.gear).toFixed(2) + ' : 1'],
    ['surface', gravelWeight(car.x) > 0.5 ? 'GRAVEL' : 'ASPHALT'],
  ];

  const lh = clamp(VH * 0.0275, 12.5, 21);
  const h = rows.length * lh + 20;
  const x = VW - w - pad, y = pad;

  ctx.save();
  ctx.fillStyle = 'rgba(8,12,16,0.88)';
  roundRect(x, y, w, h, 8);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,190,240,0.30)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.textBaseline = 'top';
  let cy = y + 10;
  for (const [k, v] of rows) {
    if (k.startsWith('—')) {
      ctx.textAlign = 'left';
      ctx.font = `700 ${Math.round(lh * 0.78)}px ui-monospace,Menlo,monospace`;
      ctx.fillStyle = 'rgba(110,190,240,0.62)';
      ctx.fillText(k, x + 11, cy);
    } else {
      ctx.textAlign = 'left';
      ctx.font = `500 ${Math.round(lh * 0.80)}px ui-monospace,Menlo,monospace`;
      ctx.fillStyle = 'rgba(178,196,214,0.80)';
      ctx.fillText(k, x + 11, cy);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#e8c95a';
      ctx.fillText(v, x + w - 11, cy);
    }
    cy += lh;
  }
  ctx.restore();
}

/* ═══════════════════════ MAIN LOOP ════════════════════════════════════════ */

let accumulator = 0;
let lastTime = 0;
let fpsAccum = 0, fpsFrames = 0;

function frame(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.2) dt = 0.2;                 // tab was backgrounded
  if (dt <= 0) dt = 1 / 60;

  // fps meter
  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.35) { state.fps = fpsFrames / fpsAccum; fpsAccum = 0; fpsFrames = 0; }

  readInput();

  /* fixed-timestep physics at 120 Hz */
  accumulator += dt;
  let steps = 0;
  while (accumulator >= FIXED_DT && steps < MAX_SUBSTEPS) {
    physicsStep(FIXED_DT);
    updateGearbox(state.car, FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if (steps === MAX_SUBSTEPS) accumulator = 0;   // drop the backlog

  /* particle emission ------------------------------------------------ */
  const car = state.car;
  if (!car.flipped) {
    for (const wh of car.wheels) {
      if (!wh.onGround) continue;
      const slipAbs = Math.abs(wh.slip);
      const spinning = Math.abs(wh.spin) > Math.abs(car.vx) + 2.4;
      if (slipAbs > 0.20 || spinning) {
        if (Math.random() < 0.6 && state.skids.length < 1100) {
          state.skids.push({ x: wh.wx, y: wh.wy - WHEEL_R * 0.9, a: 0.52 });
        }
        if (slipAbs > 0.30 && Math.random() < 0.30) {
          const gw = gravelWeight(wh.wx);
          burstDust(wh.wx, wh.wy - WHEEL_R * 0.8, 1 + Math.round(gw * 2), Math.min(1, slipAbs));
        }
      }
    }
  }

  tickParticles(dt);
  updateCamera(dt);

  /* render ----------------------------------------------------------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky();
  drawHills();
  drawMidground();
  drawTerrain();
  drawParticles();
  drawCar();
  drawHUD();

  // subtle vignette
  const vg = ctx.createRadialGradient(VW * 0.5, VH * 0.5, Math.min(VW, VH) * 0.35,
                                      VW * 0.5, VH * 0.5, Math.max(VW, VH) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.34)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  requestAnimationFrame(frame);
}

/* ═══════════════════════ BOOT ═════════════════════════════════════════════ */

resize();
resetCar();
requestAnimationFrame((t) => { lastTime = t; frame(t); });
</script>
