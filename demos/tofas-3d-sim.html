/* ══════════════════════════════════════════════════════════════════════════
   12.  WHEELS + SUSPENSION VISUALS
   ══════════════════════════════════════════════════════════════════════════
   Each corner is a group whose position the suspension writes every frame.
   The axle is local X, so a wheel is a cylinder turned to spin about X and
   the front pair is yawed by the steering angle.

   A 131 rides on 13-inch steel wheels with a small chrome hubcap — not an
   alloy.  That look is the whole point: black steel, a chrome dish in the
   middle, and a visible ring of holes.
   ══════════════════════════════════════════════════════════════════════════ */
const WHEEL_R = CFG.WHEEL_R;
const WHEEL_W = CFG.WHEEL_W;

const wheelVisuals = [];

function buildWheel() {
  const group = new THREE.Group();       // positioned by the suspension
  const steer = new THREE.Group();       // yawed by the steering
  const spin  = new THREE.Group();       // rolled by the wheel angle
  group.add(steer);
  steer.add(spin);

  /* ── tyre: a lathe, so the sidewall has a real shoulder ──────────────── */
  const tyrePts = [];
  const R = WHEEL_R, rIn = R * 0.615, hw = WHEEL_W * 0.5;
  /* outer sidewall */
  tyrePts.push(new THREE.Vector2(rIn, -hw));
  tyrePts.push(new THREE.Vector2(R * 0.90, -hw));
  tyrePts.push(new THREE.Vector2(R * 0.985, -hw * 0.80));
  tyrePts.push(new THREE.Vector2(R, -hw * 0.42));
  tyrePts.push(new THREE.Vector2(R, hw * 0.42));
  tyrePts.push(new THREE.Vector2(R * 0.985, hw * 0.80));
  tyrePts.push(new THREE.Vector2(R * 0.90, hw));
  tyrePts.push(new THREE.Vector2(rIn, hw));
  const tyreGeo = new THREE.LatheGeometry(tyrePts, 20);
  /* lathe axis is Y; a wheel needs its axis along X (the axle), so turn it
     90° about Z.  That puts the circular face in the YZ plane — right — and
     the tyre width along X. */
  /* The profile is (radius, halfWidth), so the lathe already has its circular
     face in XZ and its width on Y.  A wheel needs the axis on X (the axle),
     which is Y→X: a rotation about Z.  Verified against the bounding box —
     rotateZ gives 0.19 × 0.61 × 0.61, rotateX gives 0.61 × 0.61 × 0.19 and
     puts the radius across the car. */
  tyreGeo.rotateZ(Math.PI / 2);
  const tyre = new THREE.Mesh(tyreGeo, matRubber);
  tyre.castShadow = true;
  spin.add(tyre);

  /* subtle tread blocks, so the tyre reads as rotating when it spins */
  const treadGeo = new THREE.BoxGeometry(WHEEL_W * 0.62, 0.016, 0.048);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const t = new THREE.Mesh(treadGeo, matBlack);
    t.position.set(0, Math.cos(a) * R * 0.985, Math.sin(a) * R * 0.985);
    t.rotation.x = -a;
    spin.add(t);
  }

  /* ── steel rim: a shallow dish, painted black ────────────────────────── */
  const rimGeo = new THREE.CylinderGeometry(rIn * 0.995, rIn * 0.995, WHEEL_W * 0.86, 20, 1, true);
  /* cylinder axis Y → X (same reasoning as the tyre) */
  rimGeo.rotateZ(Math.PI / 2);
  const rim = new THREE.Mesh(rimGeo, matSteel);
  spin.add(rim);

  /* the rim face: a flat disc set in from the outer edge */
  const faceGeo = new THREE.CircleGeometry(rIn * 0.985, 20);
  /* a CircleGeometry lies in XY facing +Z.  Bake the turn into the geometry
     (not the mesh) so the disc ends up facing along the axle — leaving it on
     the mesh made the face read 0.37 m across the car, i.e. still sideways. */
  faceGeo.rotateY(Math.PI / 2);
  const face = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({
    color: 0x2a2b2e, roughness: 0.62, metalness: 0.35 }));
  face.position.x = WHEEL_W * 0.40;
  spin.add(face);

  /* ── the chrome hubcap: a domed dish, the 131's most recognisable wheel
        detail.  Modelled as a spherical cap plus a ring of vent holes. ──── */
  const capR = rIn * 0.685;
  const capGeo = new THREE.SphereGeometry(capR, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.42);
  capGeo.rotateZ(-Math.PI / 2);          // dome points along +X
  /* squashed along the axle: a deep cap reached x = 0.902, making the hubcap
     the widest point on the whole car — wider than the mirrors */
  capGeo.scale(0.42, 1, 1);
  const cap = new THREE.Mesh(capGeo, matChrome);
  cap.position.x = WHEEL_W * 0.415;
  spin.add(cap);

  /* the flat chrome ring around the base of the dome */
  const ringGeo = new THREE.TorusGeometry(capR * 0.985, 0.011, 5, 18);
  ringGeo.rotateY(Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, matChrome);
  ring.position.x = WHEEL_W * 0.412;
  spin.add(ring);

  /* vent holes: four dark ovals punched around the cap, as on the real item */
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + 0.4;
    /* same trap as the rim face: bake the turn into the geometry, because
       rotating the mesh alone leaves the disc lying across the car */
    const holeGeo = new THREE.CircleGeometry(capR * 0.185, 10);
    holeGeo.rotateY(Math.PI / 2);
    const hole = new THREE.Mesh(
      holeGeo,
      new THREE.MeshStandardMaterial({ color: 0x0d0e10, roughness: 0.9 }));
    hole.position.set(WHEEL_W * 0.418,
                      Math.cos(a) * capR * 0.53,
                      Math.sin(a) * capR * 0.53);
    spin.add(hole);
  }

  /* wheel nuts around the centre */
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.012, 6), matSteel);
    nut.rotation.z = Math.PI / 2;
    nut.position.set(WHEEL_W * 0.44, Math.cos(a) * capR * 0.30, Math.sin(a) * capR * 0.30);
    spin.add(nut);
  }

  return { group, steer, spin };
}

/* The four corners, in the order the physics expects: FL, FR, RL, RR.
   The x is where the tyre CENTRELINE sits, which is inboard of the body side
   by half a tyre width plus a little clearance — putting it at TRACK/2 buried
   the wheels inside the arches.  The physics still uses CFG.TRACK for the
   spring and anti-roll lever arms. */
const WHEEL_X = HALF_W - CFG.WHEEL_W * 0.5 - 0.035;
const WHEEL_DEFS = [
  { x:  WHEEL_X, z: AXLE_F, front: true,  side:  1 },
  { x: -WHEEL_X, z: AXLE_F, front: true,  side: -1 },
  { x:  WHEEL_X, z: AXLE_R, front: false, side:  1 },
  { x: -WHEEL_X, z: AXLE_R, front: false, side: -1 },
];

for (let i = 0; i < 4; i++) {
  const w = buildWheel();
  carVisual.add(w.group);
  wheelVisuals.push(w);
}

/* ══════════════════════════════════════════════════════════════════════════
   13.  VEHICLE PHYSICS
   ══════════════════════════════════════════════════════════════════════════
   A hand-written raycast vehicle; no third-party physics engine.

   Body state
       pos, quat, vel, angVel        (world space)
       inertia diagonal              (body space: x pitch, y yaw, z roll)

   Each frame, for each corner:
       1. the hard-point ray finds the ground
       2. suspension compression → spring + damper + bump-stop + anti-roll load
       3. the contact-patch velocity splits into longitudinal and lateral slip
       4. one Pacejka curve per axis gives the normalised grip demand
       5. the two demands share a friction circle, so asking for grip in one
          direction takes it away from the other
       6. the resulting force is applied at the contact patch, which is what
          makes the body roll, dive and squat

   The drivetrain is a rear-drive 4-speed with a slipping clutch, an LSD and
   engine braking.  Nothing about the handling is scripted: understeer and
   oversteer both fall out of the model above.
   ══════════════════════════════════════════════════════════════════════════ */

const V = {
  pos: new THREE.Vector3(),
  quat: new THREE.Quaternion(),
  vel: new THREE.Vector3(),
  angVel: new THREE.Vector3(),

  /* drivetrain */
  rpm: CFG.IDLE_RPM,
  turbineRpm: CFG.IDLE_RPM,
  gear: 1,
  gearboxAuto: true,
  shiftTimer: 0,
  shiftQueued: 0,
  engineTorque: 0,
  clutch: 1,
  tcSlip: 0,          // engine rpm - turbine rpm
  tcLock: 0,          // 0 = fully slipping, 1 = locked
  tcLockTimer: 0,
  converterTorque: 0, // N·m the converter is passing to the gearbox
  stallFactor: 0,     // how far into the converter's stall region we are

  /* measured output, for the HUD and the telemetry panel */
  limiterActive: false,
  tcIntervention: 0,   // 0 = no traction control, 1 = fully cutting
  powerKw: 0,
  powerHp: 0,
  torqueAtWheels: 0,
  driveForce: 0,      // N at the contact patch
  gripUsed: 0,        // 0..1 of available longitudinal grip
  accel: 0,           // m/s^2, smoothed

  /* controls (written by readInput) */
  throttle: 0,
  brake: 0,
  steer: 0,
  handbrake: 0,
  abs: false,
  absActive: false,

  /* derived, read by HUD / effects */
  speed: 0,
  grounded: 0,
  slipAvg: 0,
  latSlipAvg: 0,
  loadTotal: 0,
  airTime: 0,
};

const HARD_Y = 0.10;              // suspension top mounts, body space

/* Geometry of the strut, all in body space:
     the CoM sits COM_Y above the wheel centres (that is what COM_Y means)
     the mount sits HARD_Y above the CoM
   so at rest the mount is MOUNT_STATIC above the wheel centre, and the
   spring's free length is exactly that plus the design deflection. */
const MOUNT_STATIC = HARD_Y + CFG.COM_Y;                       // 0.41 m
const FREE_LEN = MOUNT_STATIC + CFG.STATIC_DEFL;               // 0.535 m
/* the value `hang` takes at rest — the visual sync anchors its hub here */
const STATIC_HANG = FREE_LEN - CFG.STATIC_DEFL;                // 0.41 m
const MAX_DROOP = FREE_LEN + CFG.SUSP_TRAVEL;                  // 0.775 m

const wheels = WHEEL_DEFS.map((def) => ({
  def,
  hard: new THREE.Vector3(def.x, HARD_Y, def.z),

  grounded: false,
  travel: 0.5,           // 0 = full droop, 0.5 = static ride height, 1 = bump stop
  deflection: 0.0,       // metres the spring is currently squashed
  prevDeflection: 0.0,
  hang: 0.35,            // mount → wheel centre distance, body space
  travelPrev: 0,
  compVel: 0,
  load: 0,

  contact: new THREE.Vector3(),
  normal: new THREE.Vector3(0, 1, 0),
  absCut: 0,
  staticHold: false,
  staticHoldPrev: false,
  surface: 'asphalt',
  mu: 1,

  angle: 0,
  angVel: 0,
  slipLong: 0,
  slipLat: 0,
  fx: 0,
  fy: 0,
  skid: 0,
}));

/* ── Pacejka magic formula ────────────────────────────────────────────────
   F(s) = D·sin( C·atan( B·s − E·(B·s − atan(B·s)) ) )
   The peak of this curve is normalised to 1 so D can be read directly as a
   coefficient of friction.                                                  */

function grip(slip) {
  const a = Math.abs(slip);
  /* accelerating: the tyre keys into the surface and the peak moves outward */
  const driving = slip > 0;
  const b = driving ? CFG.TYRE_B_DRIVE : CFG.TYRE_B;
  const bs = b * a;
  const raw = Math.sin(CFG.TYRE_C * Math.atan(bs - CFG.TYRE_E * (bs - Math.atan(bs)))) /
              (driving ? PEAK_DRIVE : PEAK_BRAKE);
  /* Past the peak the curve must decay, but a sliding tyre still rubs at
     most of its peak — pure Pacejka overshoots that and makes a locked wheel
     behave like a parachute.  Floor the decay at 80 % of peak. */
  return Math.max(raw, 0.80 * clamp(a / 0.12, 0, 1));
}

/* value of the curve's peak for each of the two drive states, so D can be
   read straight off as a friction coefficient either way */
function peakOf(b) {
  let best = 0;
  for (let i = 0; i <= 600; i++) {
    const s = (i / 600) * 6;
    const bs = b * s;
    best = Math.max(best, Math.sin(CFG.TYRE_C * Math.atan(bs - CFG.TYRE_E * (bs - Math.atan(bs)))));
  }
  return best;
}
const PEAK_BRAKE = peakOf(CFG.TYRE_B);
const PEAK_DRIVE = peakOf(CFG.TYRE_B_DRIVE);

/* ── inverse of the grip curve ─────────────────────────────────────────────
   The wheel update below needs the answer to "which slip produces this much
   grip?".  The magic formula has no clean inverse, so the rising half of the
   curve is tabulated once and read back with a linear interpolation.  Same
   trick a real ECU uses for its tyre model.                                 */
const INV_STEPS = 256;
const invSlipDrive = new Float32Array(INV_STEPS + 1);
const invSlipBrake = new Float32Array(INV_STEPS + 1);
const slipAtPeak = { drive: 0, brake: 0 };

function buildInverse(B, out) {
  let best = -1, bestS = 0.1;
  for (let i = 0; i <= 2000; i++) {
    const g = gripWith(B, (i / 2000) * 2.5);
    if (g > best) { best = g; bestS = (i / 2000) * 2.5; }
  }
  let k = 0;
  for (let i = 0; i <= 2000 && k <= INV_STEPS; i++) {
    const sl = (i / 2000) * bestS;
    const g = gripWith(B, sl) / best;
    while (k <= INV_STEPS && (k / INV_STEPS) <= g) { out[k] = sl; k++; }
  }
  while (k <= INV_STEPS) { out[k] = bestS; k++; }
  return bestS;
}

function gripWith(B, a) {
  const bs = B * a;
  return Math.sin(CFG.TYRE_C * Math.atan(bs - CFG.TYRE_E * (bs - Math.atan(bs))));
}

slipAtPeak.brake = buildInverse(CFG.TYRE_B, invSlipBrake);
slipAtPeak.drive = buildInverse(CFG.TYRE_B_DRIVE, invSlipDrive);

/* normalised force 0..1 → slip, per drive direction */
function slipForGrip(norm, driving) {
  const t = clamp(norm, 0, 1) * INV_STEPS;
  const i0 = Math.floor(t), i1 = Math.min(INV_STEPS, i0 + 1);
  const f = t - i0;
  const tab = driving ? invSlipDrive : invSlipBrake;
  return tab[i0] + (tab[i1] - tab[i0]) * f;
}

/* a tyre loses a little grip per newton as load rises — this is what makes
   the car transfer weight in corners instead of behaving like a brick */
function loadSensitivity(loadN) {
  /* Real tyres lose grip per newton as load rises, but gently: a road tyre
     keeps roughly 92 % of its coefficient at twice its rated load.  The old
     constants were three times too aggressive, which quietly cost the car a
     quarter of its grip and made every stop feel like wet grass. */
  return 1 - clamp((loadN - 3900) / 52000, -0.06, 0.11);
}

/* ══════════════════════════════════════════════════════════════════════════
   14.  ENGINE + GEARBOX
   ══════════════════════════════════════════════════════════════════════════ */

/* crank torque for a 1.6 pushrod four, N·m */
/* 1.6 L OHV four, as fitted to the Şahin: 125 Nm at 3000 rpm and about
   75 hp (56 kW) at 5400.  The curve stays usable well past the power peak,
   which is what lets a 1050 kg car pull to 160 km/h with only four gears. */
/* 2.0 litre turbocharged four.  280 N·m held flat from 1800 to 3000 — the
   plateau a small turbo gives you — then a power curve that keeps climbing to
   180 hp at 5500.  That flat shelf is exactly what a six-speed automatic
   wants: every upshift lands back inside the torque band, so the car pulls in
   every gear instead of only in first and second. */
const TORQUE_CURVE = [
  [700, 140], [1000, 190], [1400, 240], [1600, 268],
  [1800, 280], [2200, 280], [2600, 280], [3000, 278],
  [3400, 275], [3800, 270], [4200, 262], [4600, 250],
  [5000, 236], [5400, 218], [5800, 196], [6200, 160], [6600, 100],
];

function torqueAtRpm(rpm) {
  const c = TORQUE_CURVE;
  /* turbo lag: below the spool threshold the engine is naturally aspirated */
  const lag = clamp((rpm - 900) / (CFG.BOOST_RPM - 900), 0, 1);
  const raw = _torqueLookup(rpm, c);
  return raw * lerp(0.55, 1.0, lag);
}

function _torqueLookup(rpm, c) {
  if (rpm <= c[0][0]) return c[0][1];
  if (rpm >= c[c.length - 1][0]) return c[c.length - 1][1];
  for (let i = 0; i < c.length - 1; i++) {
    if (rpm >= c[i][0] && rpm <= c[i + 1][0]) {
      return lerp(c[i][1], c[i + 1][1], (rpm - c[i][0]) / (c[i + 1][0] - c[i][0]));
    }
  }
  return 0;
}

const gearRatio = () => (V.gear === -1 ? -CFG.REVERSE : CFG.GEARS[V.gear - 1]);
const totalRatio = () => gearRatio() * CFG.FINAL_DRIVE;

/* wheel angular speed → engine rpm through the current gear */
function wheelRpmToEngine() {
  const wl = (wheels[2].angVel + wheels[3].angVel) * 0.5;
  return Math.abs(wl) * 60 / TAU * Math.abs(totalRatio());
}

/* ══════════════════════════════════════════════════════════════════════════
   15.  INPUT HOOKS  (readInput writes these)
   ══════════════════════════════════════════════════════════════════════════ */
let inputThrottle = 0;
let inputBrake = 0;
let inputSteer = 0;
let inputHandbrake = 0;

/* ══════════════════════════════════════════════════════════════════════════
   16.  SCRATCH VECTORS
   ══════════════════════════════════════════════════════════════════════════ */
const _xAxis = new THREE.Vector3();
const _yAxis = new THREE.Vector3();
const _zAxis = new THREE.Vector3();
const _teleVec = new THREE.Vector3();   // telemetry only, never shared
const _invQ = new THREE.Quaternion();
const _r = new THREE.Vector3();
const _pVel = new THREE.Vector3();
const _force = new THREE.Vector3();
const _torque = new THREE.Vector3();
const _wForce = new THREE.Vector3();
const _wTorque = new THREE.Vector3();
const _dq = new THREE.Quaternion();
const _wheelFwd = new THREE.Vector3();
const _wheelRight = new THREE.Vector3();
const _tmpR = new THREE.Vector3();
const _surfN = new THREE.Vector3(0, 1, 0);

/* ══════════════════════════════════════════════════════════════════════════
   17.  RESET
   ══════════════════════════════════════════════════════════════════════════ */
function startPose() {
  const i = 6;
  const p = PATH.samples[i], tg = PATH.tang[i];
  const yaw = Math.atan2(tg.x, tg.z);

  /* align the car with the local ground plane, not just its heading — a car
     dropped onto a bank at the wrong angle spends its first second bouncing,
     and that is what was nudging it sideways at the start line */
  const d = 1.6;
  const gz = (terrainHeight(p.x, p.z + d) - terrainHeight(p.x, p.z - d)) / (2 * d);
  const gx = (terrainHeight(p.x + d, p.z) - terrainHeight(p.x - d, p.z)) / (2 * d);

  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const tilt = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(-gx, 1, -gz).normalize()
  );
  q.premultiply(tilt);

  return {
    pos: new THREE.Vector3(
      p.x,
      terrainHeight(p.x, p.z) + CFG.WHEEL_R + CFG.COM_Y + 0.02,
      p.z
    ),
    quat: q,
  };
}

function resetVehicle(pose) {
  const p = pose || startPose();
  V.pos.copy(p.pos);
  V.quat.copy(p.quat);
  V.vel.set(0, 0, 0);
  V.angVel.set(0, 0, 0);
  V.rpm = CFG.IDLE_RPM;
  V.gear = 1;
  V.shiftTimer = 0;
  V.shiftQueued = 0;
  V.steer = 0;
  V.absActive = false;
  V.airTime = 0;
  V.speed = 0;

  wheels.forEach((w) => {
    w.travel = 0.5;
    w.travelPrev = 0.5;
    w.deflection = CFG.STATIC_DEFL;
    w.prevDeflection = CFG.STATIC_DEFL;
    w.hang = MOUNT_STATIC;
    w.compVel = 0;
    w.load = 0;
    w.grounded = false;
    w.angle = 0;
    w.angVel = 0;
    w.slipLong = 0;
    w.slipLat = 0;
    w.skid = 0;
    w.staticHold = false;
    w.staticHoldPrev = false;
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   18.  THE PHYSICS STEP
   ══════════════════════════════════════════════════════════════════════════ */
function physicsStep(dt) {
  V.throttle = inputThrottle;
  V.brake = inputBrake;
  V.handbrake = inputHandbrake;

  /* body axes in world space */
  _xAxis.set(1, 0, 0).applyQuaternion(V.quat);   // left
  _yAxis.set(0, 1, 0).applyQuaternion(V.quat);   // up
  _zAxis.set(0, 0, 1).applyQuaternion(V.quat);   // forward

  V.speed = V.vel.length();

  /* ── steering: speed sensitive, self-centring ────────────────────────── */
  const spd = Math.abs(V.speed);
  const lock = CFG.STEER_MAX * (1 - 0.60 * smoothstep(CFG.STEER_SPEED_LO, CFG.STEER_SPEED_HI, spd));
  if (Math.abs(inputSteer) > 0.01) {
    V.steer = approach(V.steer, inputSteer * lock, CFG.STEER_RATE * dt);
  } else {
    const rate = CFG.STEER_RETURN * (0.4 + 0.6 * smoothstep(0, 30, spd));
    V.steer = approach(V.steer, 0, rate * dt);
  }
  V.steer = clamp(V.steer, -lock, lock);

  /* ── gearbox + converter ─────────────────────────────────────────────── */
  updateGearbox(dt);
  updateConverter(dt);

  /* ── engine torque at the crank ──────────────────────────────────────── */
  const rpm = V.rpm;
  let engT = 0;
  if (!V.limiterActive) {
    engT = torqueAtRpm(rpm) * V.throttle;
    /* soft cut as it approaches the limiter, so it bounces instead of slamming */
    if (rpm > CFG.REDLINE_RPM - 150) {
      engT *= 1 - smoothstep(CFG.REDLINE_RPM - 150, CFG.REDLINE_RPM, rpm);
    }
  }

  /* ══════════════════════════════════════════════════════════════════════
     TRACTION CONTROL / TORQUE MANAGEMENT
     ══════════════════════════════════════════════════════════════════════
     A modern TCU does not let the engine dump its whole torque into a
     first-gear launch: it trims the throttle until the tyres are rolling
     rather than spinning.  Detect rear-wheel slip, pull torque back
     proportionally, and feed it in again as the slip falls.  Without this the
     car simply smoked its tyres and never moved.
     ══════════════════════════════════════════════════════════════════════ */
  let worstSlip = 0;
  for (let i = 2; i < 4; i++) {
    worstSlip = Math.max(worstSlip, Math.abs(wheels[i].slipLong));
  }
  /* full torque below 0.12 slip, zero by 0.45 — smooth, so it does not chatter */
  const tcGrip = 1 - smoothstep(0.12, 0.45, worstSlip);
  V.tcIntervention = 1 - tcGrip;
  /* only intervene when the driver is actually asking for torque */
  engT *= lerp(1, lerp(0.30, 1.0, tcGrip), clamp(V.throttle * 1.4, 0, 1));

  V.engineTorque = engT;

  /* ══════════════════════════════════════════════════════════════════════
     derived suspension constants
     ══════════════════════════════════════════════════════════════════════
     Specified as static deflection + damping ratio, the way a chassis is
     actually designed.  A corner carrying m·g compresses a spring of rate k
     by m·g/k, so k follows from the corner weight and the deflection we want;
     the damper follows from the damping ratio.                               */
  const GRAV = 9.81;
  const statF = CFG.MASS * GRAV * CFG.FRONT_WEIGHT * 0.5;
  const statR = CFG.MASS * GRAV * (1 - CFG.FRONT_WEIGHT) * 0.5;
  const K_F = statF / CFG.STATIC_DEFL;
  const K_R = statR / CFG.STATIC_DEFL;
  const C_F = 2 * CFG.DAMP_RATIO * Math.sqrt(K_F * CFG.MASS * CFG.FRONT_WEIGHT * 0.5);
  const C_R = 2 * CFG.DAMP_RATIO * Math.sqrt(K_R * CFG.MASS * (1 - CFG.FRONT_WEIGHT) * 0.5);

  /* ══════════════════════════════════════════════════════════════════════
     per-corner: raycast the ground and work out the spring deflection
     ══════════════════════════════════════════════════════════════════════ */
  let grounded = 0;

  for (let i = 0; i < 4; i++) {
    const w = wheels[i];

    /* hard point in world space */
    _r.copy(w.hard).applyQuaternion(V.quat).add(V.pos);

    const groundY = terrainHeight(_r.x, _r.z);
    /* the surface normal, from the terrain gradient.  A wheel on a slope can
       only push perpendicular to the ground, so this is what stops the car
       from silently sliding down hills with zero throttle. */
    const gx = (terrainHeight(_r.x + 0.4, _r.z) - terrainHeight(_r.x - 0.4, _r.z)) / 0.8;
    const gz = (terrainHeight(_r.x, _r.z + 0.4) - terrainHeight(_r.x, _r.z - 0.4)) / 0.8;
    _surfN.set(-gx, 1, -gz).normalize();

    /* Distance from the mount to the ground, measured along the body's up
       axis.  Dividing by the axis' Y component means a pitched or banked car
       still gets a geometrically correct wheel travel. */
    const along = (_r.y - groundY) / Math.max(0.55, _yAxis.y);

    /* how far the wheel centre hangs below the mount */
    const hang = along - CFG.WHEEL_R;

    const prevTravel = w.travel;

    if (hang >= MAX_DROOP) {
      /* the ground is further away than the strut can reach: wheel in the air */
      w.grounded = false;
      w.hang = MAX_DROOP;
      w.deflection = 0;
      w.travel = 0;
    } else {
      w.grounded = true;
      grounded++;
      w.hang = hang;
      /* spring force is generated by compressing it out of its free length */
      w.deflection = Math.max(0, FREE_LEN - hang);
      /* 0 = full droop, 0.5 = static ride height, 1 = on the bump stop */
      w.travel = clamp((w.deflection - CFG.STATIC_DEFL) / CFG.SUSP_TRAVEL + 0.5, 0, 1);
    }

    w.contact.set(_r.x, groundY, _r.z);
    w.normal.copy(_surfN);
    w.surface = surfaceAt(_r.x, _r.z);
    /* rate of change of the spring's compression, in metres per second */
    w.compVel = (w.deflection - (w.prevDeflection || 0)) / dt;
    w.prevDeflection = w.deflection;
  }

  /* ══════════════════════════════════════════════════════════════════════
     per-corner: spring, damper, bump stop, anti-roll bar → wheel load
     ══════════════════════════════════════════════════════════════════════ */
  const loads = [0, 0, 0, 0];

  for (let i = 0; i < 4; i++) {
    const w = wheels[i];
    if (!w.grounded) continue;

    const front = w.def.front;
    const k = front ? K_F : K_R;
    const c = front ? C_F : C_R;

    /* Spring force is measured from the free length, so the static weight of
       the car produces exactly STATIC_DEFL of compression and nothing else
       has to be added on top.  Damping is symmetric in bump and rebound at
       the ratio we asked for, biased slightly towards rebound the way a real
       damper is. */
    let F = k * w.deflection;

    /* damper: resists compression in bump, pulls back harder in rebound */
    const vDefl = w.compVel;
    F += c * vDefl * (vDefl > 0 ? 1.0 : 1.45);

    /* bump stop: the last 15 % of the bump travel goes very stiff */
    const over = w.deflection - (CFG.STATIC_DEFL + CFG.SUSP_TRAVEL * 0.85);
    if (over > 0) F += over * k * CFG.BUMP_STOP_RATIO;

    /* the tyre can never pull the car down */
    loads[i] = Math.max(0, F);
  }

  /* Anti-roll bars.  A bar is a torsion spring linking the two sides of an
     axle: it pushes up on the compressed side and pulls down on the extended
     one, which is exactly how a real bar resists body roll.  The force is
     proportional to the difference in wheel travel, and it is applied to the
     same load the tyres see. */
  [[0, 1, CFG.ARB_FRONT, K_F], [2, 3, CFG.ARB_REAR, K_R]].forEach(([a, b, share, k]) => {
    if (!wheels[a].grounded || !wheels[b].grounded) return;
    const dDefl = wheels[a].deflection - wheels[b].deflection;
    const barForce = dDefl * k * share;
    loads[a] = Math.max(0, loads[a] + barForce);
    loads[b] = Math.max(0, loads[b] - barForce);
  });

  /* ══════════════════════════════════════════════════════════════════════
     per-corner: tyre forces
     ══════════════════════════════════════════════════════════════════════ */
  _force.set(0, 0, 0);
  _torque.set(0, 0, 0);

  let slipSum = 0, latSum = 0, loadSum = 0;

  for (let i = 0; i < 4; i++) {
    const w = wheels[i];
    const front = w.def.front;

    w.load = loads[i];
    loadSum += loads[i];

    if (!w.grounded) {
      w.fx = 0;
      w.fy = 0;
      w.skid = 0;
      w.slipLong = 0;
      w.slipLat = 0;
      w.angVel *= 1 - 1.5 * dt;
      w.angle += w.angVel * dt;
      continue;
    }

    /* suspension force pushes up along the body axis at the hard point */
    _r.copy(w.hard).applyQuaternion(V.quat);
    _wForce.copy(_yAxis).multiplyScalar(w.load);
    _force.add(_wForce);
    _torque.add(_tmpR.copy(_r).cross(_wForce));

    /* ── contact-patch velocity: v + ω × r ─────────────────────────────── */
    _pVel.set(
      V.vel.x + V.angVel.y * _r.z - V.angVel.z * _r.y,
      V.vel.y + V.angVel.z * _r.x - V.angVel.x * _r.z,
      V.vel.z + V.angVel.x * _r.y - V.angVel.y * _r.x
    );

    /* The tyre's own frame, built on the contact plane.  Projecting the body
       axes onto that plane is what lets a wheel push a car up a hill: the
       force stays tangential to the ground and therefore has an upward
       component whenever the ground is inclined. */
    const steer = front ? V.steer : 0;
    const cs = Math.cos(steer), sn = Math.sin(steer);
    _wheelFwd.copy(_zAxis).multiplyScalar(cs).addScaledVector(_xAxis, sn);
    _wheelRight.copy(_xAxis).multiplyScalar(cs).addScaledVector(_zAxis, -sn);

    /* orthogonalise against the surface normal so the patch is planar */
    _wheelFwd.addScaledVector(w.normal, -_wheelFwd.dot(w.normal)).normalize();
    _wheelRight.addScaledVector(w.normal, -_wheelRight.dot(w.normal));
    _wheelRight.addScaledVector(_wheelFwd, -_wheelRight.dot(_wheelFwd)).normalize();

    const vLong = _pVel.dot(_wheelFwd);
    const vLat = _pVel.dot(_wheelRight);

    /* ── slip ─────────────────────────────────────────────────────────────
       Both axes are expressed as a dimensionless slip that the same magic
       formula can chew on.  Longitudinal is the usual (ωR−v)/v ratio with a
       speed floor; lateral is the tangent of the slip angle, which is the
       standard definition and peaks at about 8–10° with this B coefficient. */
    const vFloor = CFG.SLIP_V_MIN;

    /* Static friction.  Below walking pace with no drive demand the contact
       patch behaves like a rigid joint rather than a sliding one, so the
       car holds still on a slope instead of creeping.  Released the instant
       there is throttle, brake or sideways load. */
    /* "wants to drive" means the driver is asking for torque — engine braking
       at idle is not a drive request, and treating it as one was what kept
       the car from holding still on a slope. */
    const wantsDrive = V.throttle > 0.05 && !front && V.shiftTimer <= 0;
    /* Hysteresis: grab at rest, release once the wheel is actually rolling.
       The previous version released as soon as the wheel speed crept past
       0.9 m/s, then re-grabbed, and the car ratcheted itself downhill one
       frame at a time. */
    const slowEnough = Math.abs(vLong) < 0.6;
    const noPedal = V.throttle < 0.02 && V.brake < 0.02 && V.handbrake < 0.05;

    if (!w.staticHoldPrev && slowEnough && noPedal && !wantsDrive) {
      w.staticHold = true;
      w.staticHoldPrev = true;
    } else if (w.staticHoldPrev && (V.throttle > 0.02 || V.brake > 0.02 || V.handbrake > 0.05 || Math.abs(vLong) > 1.2)) {
      w.staticHold = false;
      w.staticHoldPrev = false;
    } else {
      w.staticHold = w.staticHoldPrev;
    }

    w.slipLong = (w.angVel * CFG.WHEEL_R - vLong) / Math.max(Math.abs(vLong), vFloor);
    /* Sign convention: slipLat carries the sign of the sideways velocity at
       the contact patch, so the lateral force (which negates it) always
       opposes the slide.  Getting this the wrong way round makes every
       sideways nudge grow instead of decay. */
    w.slipLat = Math.atan2(vLat, Math.max(Math.abs(vLong), 1.5));

    /* ── friction budget ────────────────────────────────────────────────
       Only the component of the suspension force that presses INTO the
       ground generates grip.  On a slope the car's weight has a tangential
       component, and the tyre has to spend its friction circle resisting
       it — which is exactly how a parked car stays parked.                  */
    const surf = surfProps(w.surface);
    const normalLoad = w.load * clamp(w.normal.dot(_yAxis), 0, 1);
    const muPeak = surf.mu * loadSensitivity(normalLoad);
    w.mu = muPeak;

    const dLong = grip(w.slipLong);
    const dLat = grip(w.slipLat);

    /* friction circle: both directions share one budget of grip.  The
       combined magnitude is clamped to μ·Fz, so a locked wheel slides at the
       friction limit instead of generating drag from its slip ratio. */
    const demand = Math.hypot(dLong, dLat);
    const share = demand > 1 ? 1 / demand : 1;

    /* at full lock the force saturates at the friction limit regardless of
       how far past the peak the slip has run */
    let fLong = muPeak * normalLoad * dLong * share * sgn(w.slipLong);
    const fLat = -muPeak * normalLoad * dLat * share * sgn(w.slipLat);

    /* ABS works on brake pressure, not on the tyre force: it releases the
       caliper of any wheel that has run past the peak-slip point, in pulses,
       and the wheel is then re-accelerated by the ground.  Modulating the
       force directly here would double-count the friction limit. */
    if (V.abs && V.brake > 0.1) {
      const over = Math.abs(w.slipLong) - CFG.ABS_SLIP;
      if (over > 0) {
        w.absCut = Math.min(1, over * 3.0);
        V.absActive = true;
      } else {
        w.absCut = Math.max(0, (w.absCut || 0) - dt * 6);
      }
    } else {
      w.absCut = 0;
    }

    /* Brake lock.  When the caliper is clamped and the wheel has stopped,
       the contact patch is static in the longitudinal direction: the tyre
       resists motion up to μ·Fz and then slides.  Without this the tyre
       curve, which is centred on rolling speed, keeps handing back a
       forward force that fights the brakes. */
    if (V.brake > 0.02) {
      let cap = muPeak * normalLoad;
      if (Math.abs(vLong) < 0.35) cap = Math.min(cap, CFG.MASS * 9.81 * 0.55);
      fLong = clamp(fLong, -cap, cap);
    }

    /* A parked car must not creep.  With no pedal input and the wheels all
       but stopped, the contact patch acts as a rigid joint: the longitudinal
       force goes to zero and the wheel stops turning.  This is what holds
       the car on the banked sections instead of letting gravity win. */
    if (w.staticHold) {
      fLong = 0;
      w.angVel = 0;
    }

    /* Hard clamp on the force vector.  The friction circle above already
       scales the demands, but rounding and the ABS cut can leak a little
       through; this guarantees the tyre can never pull harder than it grips. */
    const fMax = muPeak * normalLoad;
    const fmag = Math.hypot(fLong, fLat);
    if (fmag > fMax && fmag > 1e-6) {
      fLong *= fMax / fmag;
    }

    w.fx = fLong;
    w.fy = fLat;
    w.skid = clamp((Math.abs(w.slipLong) - 0.15) * 2.2 + (Math.abs(w.slipLat) - 0.55) * 1.3, 0, 1);

    slipSum += w.skid;
    latSum += Math.abs(w.slipLat) * 0.5;

    /* apply the contact force at the patch */
    _wForce.copy(_wheelFwd).multiplyScalar(fLong).addScaledVector(_wheelRight, fLat);
    _force.add(_wForce);
    _torque.add(_tmpR.copy(_r).cross(_wForce));

    /* ── wheel spin: a stick/slip model ──────────────────────────────────
       Straight integration of "engine torque minus tyre torque" is stiff:
       the tyre's grip climbs so fast with slip that one frame at 120 Hz
       overshoots by more than an order of magnitude and the wheel either
       freezes or explodes.

       So the corner is solved the way a tyre engineer would phrase it.
       First work out the torque that is NOT coming from the contact patch,
       then ask "how much grip would be needed to hold the wheel rolling?".

         demand = |T_other| / (R · μ · Fz)

       · demand < 1 — the tyre can hold it.  Invert the grip curve to find
         the slip that carries exactly that force, turn it into the angular
         speed that produces that slip, and relax the wheel towards it.
       · demand ≥ 1 — the tyre is saturated.  Grip is a constant at that
         point, the torque difference is constant, and the wheel can be
         integrated explicitly without any stiffness at all.

       The relaxation is unconditionally stable, the limit case is exact,
       and both a clean launch and a smoker come out of the same two lines.  */
    const drive = wheelDrive(i);
    /* ABS modulates the caliper torque, not the contact force */
    const brake = wheelBrakeT(i) * (1 - (w.absCut || 0));

    let I = 1.05;                                   // wheel + hub inertia
    if (!front) {
      /* reflected engine inertia, split across the two driven wheels.  The
         driveline ratio squares it, so in first gear this dominates — which
         is correct, and is why a low-geared car feels so reluctant to spin
         its wheels and so lively once it is rolling. */
      const r = totalRatio();
      I += CFG.ENGINE_INERTIA * r * r * 0.5;
    }

    /* everything acting on the wheel except the contact patch */
    const signW = w.angVel > 0.05 ? 1 : w.angVel < -0.05 ? -1 : sgn(drive || 1);
    const tOther = drive - brake * signW;

    const fMaxLong = muPeak * normalLoad;           // total grip available
    const demandLong = Math.abs(tOther) / Math.max(1, fMaxLong * CFG.WHEEL_R);

    /* when the tyre is not saturated, the wheel simply rolls with the ground */
    const omegaEq = vLong / CFG.WHEEL_R;

    if (demandLong < 1) {
      /* ── the tyre holds the wheel ──────────────────────────────────────
         Drive torque shows up as a small slip offset, so the wheel settles
         just faster than the ground and pushes the car along; with no
         torque it settles exactly at the rolling speed.                    */
      const sNeeded = (fMaxLong > 1 ? slipForGrip(demandLong, tOther > 0) : 0) * sgn(tOther || 1);
      const target = (vLong + sNeeded * Math.max(Math.abs(vLong), vFloor)) / CFG.WHEEL_R;

      /* Tyre relaxation: real tyres take tens of milliseconds to build
         force, and this is the time constant that keeps the stick/slip solve
         stable.  It was 12 ms, which at a 120 Hz step means the wheel jumps
         69 % of the way to equilibrium every frame — that oscillates, and the
         oscillation showed up as a speed sawtooth and a slip ratio flickering
         between 0.05 and 0.40.  45 ms puts the per-step gain at 0.185. */
      const tau = 0.045;
      w.angVel += (target - w.angVel) * Math.min(1, dt / tau);

    } else {
      /* ── saturated: the contact force is pinned, spin up explicitly ──── */
      const fSat = Math.min(fMaxLong, Math.abs(tOther) / CFG.WHEEL_R) * sgn(tOther);
      w.angVel += ((tOther - CFG.WHEEL_R * fSat) / I) * dt;
      w.spinning = Math.abs(w.angVel * CFG.WHEEL_R - vLong) > 1.2;
    }

    /* rolling resistance, and a hard stop so a parked or braked wheel
       cannot creep down a slope */
    w.angVel -= sgn(w.angVel) * surf.roll * 1.2 * dt;
    if ((brake > 0 || w.staticHold) && Math.abs(w.angVel) < 0.35) w.angVel = 0;
    w.angle += w.angVel * dt;
  }

  /* If every corner is holding statically, the car is parked: take out the
     last of the creep so it does not drift down the camber overnight. */
  if (wheels.every((w) => w.staticHold) && V.throttle < 0.02 && V.brake < 0.02) {
    V.vel.multiplyScalar(0.55);
    V.angVel.multiplyScalar(0.55);
  }

  V.grounded = grounded;
  V.slipAvg = slipSum * 0.25;
  V.latSlipAvg = latSum * 0.25;
  V.loadTotal = loadSum;

  if (grounded === 0) V.airTime += dt;
  else V.airTime = 0;

  /* ══════════════════════════════════════════════════════════════════════
     aero + gravity
     ══════════════════════════════════════════════════════════════════════ */
  const sp = V.vel.length();
  if (sp > 0.3) {
    const drag = 0.5 * CFG.AIR_DENSITY * CFG.DRAG_CD * CFG.FRONTAL_AREA * sp * sp;
    _force.addScaledVector(V.vel, -drag / sp);

    if (grounded > 0) {
      const df = 0.5 * CFG.AIR_DENSITY * CFG.DOWNFORCE * CFG.FRONTAL_AREA * sp * sp * 0.5;
      _force.addScaledVector(_yAxis, -df);
    }
  }
  _force.y -= CFG.MASS * 9.81;

  /* ══════════════════════════════════════════════════════════════════════
     integrate
     ══════════════════════════════════════════════════════════════════════ */
  V.vel.addScaledVector(_force, dt / CFG.MASS);

  /* torque → body space, where the inertia tensor is diagonal */
  _wTorque.copy(_torque).applyQuaternion(_invQ.copy(V.quat).invert());
  _wTorque.x /= CFG.INERTIA.x;
  _wTorque.y /= CFG.INERTIA.y;
  _wTorque.z /= CFG.INERTIA.z;
  _wTorque.applyQuaternion(V.quat);
  V.angVel.addScaledVector(_wTorque, dt);

  V.angVel.multiplyScalar(1 - 0.6 * dt);
  V.vel.multiplyScalar(1 - 0.008 * dt);

  V.pos.addScaledVector(V.vel, dt);

  /* q += ½·ω·q·dt */
  const av = V.angVel;
  _dq.set(av.x * dt * 0.5, av.y * dt * 0.5, av.z * dt * 0.5, 0).multiply(V.quat);
  V.quat.set(
    V.quat.x + _dq.x,
    V.quat.y + _dq.y,
    V.quat.z + _dq.z,
    V.quat.w + _dq.w
  ).normalize();

  /* ══════════════════════════════════════════════════════════════════════
     chassis vs ground — the floor must never sink through the scenery
     ══════════════════════════════════════════════════════════════════════ */
  {
    const gh = terrainHeight(V.pos.x, V.pos.z);
    const floorY = V.pos.y + Y_FLOOR - 0.06;
    if (floorY < gh) {
      V.pos.y += (gh - floorY) * 0.6;
      if (V.vel.y < 0) V.vel.y *= -0.25;
      V.vel.x *= 1 - 0.05;
      V.vel.z *= 1 - 0.05;
    }
  }

  /* ══════════════════════════════════════════════════════════════════════
     engine speed
     ══════════════════════════════════════════════════════════════════════ */
  updateEngineSpeed(dt);

  /* ══════════════════════════════════════════════════════════════════════
     telemetry — what the tyres are actually doing, not what we asked for
     ══════════════════════════════════════════════════════════════════════ */
  {
    let f = 0, gripCap = 0;
    for (let i = 0; i < 4; i++) {
      const w = wheels[i];
      f += w.fx;
      gripCap += w.mu * Math.max(0, w.load);
    }
    V.driveForce = f;
    V.gripUsed = gripCap > 1 ? clamp(Math.abs(f) / gripCap, 0, 1) : 0;

    /* smoothed longitudinal acceleration, 1/4 s time constant */
    const vAlong = V.vel.dot(_teleVec.set(0, 0, 1).applyQuaternion(V.quat));
    if (V.prevVAlong === undefined) V.prevVAlong = vAlong;
    const instAcc = (vAlong - V.prevVAlong) / Math.max(1e-4, dt);
    V.prevVAlong = vAlong;
    V.accel = lerp(V.accel, clamp(instAcc, -30, 30), 1 - Math.exp(-dt / 0.25));
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   19.  DRIVETRAIN
   ══════════════════════════════════════════════════════════════════════════ */
function wheelDrive(i) {
  const w = wheels[i];
  if (w.def.front) return 0;              // rear-wheel drive
  if (V.shiftTimer > 0) return 0;         // clutch open mid-shift
  if (V.gear === -1 && V.speed > 2.5) return 0;
  /* the idling engine drags through the gearbox only when the car is moving;
     at a standstill the clutch is open and no torque reaches the axle */
  if (V.throttle < 0.02 && V.speed < 0.6) return 0;

  /* the axle sees what the CONVERTER passed on, multiplied by the gearbox —
     that is the whole reason an automatic pulls harder off the line than the
     same engine bolted to a manual */
  const t = V.converterTorque * Math.abs(totalRatio()) * CFG.DRIVELINE_EFF *
            (V.gear === -1 ? -1 : 1);

  /* viscous LSD: torque migrates to the slower wheel */
  const other = wheels[i === 2 ? 3 : 2];
  const diff = w.angVel - other.angVel;
  const bias = clamp(diff * CFG.DIFF_LOCK * 0.05, -0.42, 0.42);
  const base = i === 2 ? 0.5 + bias : 0.5 - bias;
  return t * clamp(base, 0.08, 0.92);
}

function wheelBrakeT(i) {
  const w = wheels[i];
  const front = w.def.front;
  let t = V.brake * CFG.BRAKE_TORQUE * (front ? CFG.BRAKE_BIAS : 1 - CFG.BRAKE_BIAS) * 0.5;
  if (!front && V.handbrake > 0.02) t += V.handbrake * CFG.HANDBRAKE_TRQ * 0.5;
  return t;
}

/* ══════════════════════════════════════════════════════════════════════════
   ENGINE SPEED
   ══════════════════════════════════════════════════════════════════════════
   The crank is driven by two things and no more: combustion torque, and the
   drag of the converter's pump.  Solve N = ∫(T_engine − T_pump)/I dt instead
   of blending towards a target rpm, and the idle, the flare, the stall and
   the engine braking all fall out of one equation instead of four fudges.
   ══════════════════════════════════════════════════════════════════════════ */
function updateEngineSpeed(dt) {
  /* Speed ratio and the slip the converter is currently allowing. */
  const sr = V.rpm > 60 ? clamp(V.turbineRpm / V.rpm, 0, 1.2) : 0;
  V.tcSlip = Math.max(0, V.rpm - V.turbineRpm);

  /* ── how much slip the converter permits, right now ───────────────────
     At full throttle and zero road speed the engine may flare to its stall
     speed (turbine × stall ratio).  Lift off and the slip closes to nothing.
     As the car gathers speed the ceiling falls away to zero, which is the
     lock-up.                                                     */
  /* The slip ceiling falls away with road speed: a converter flares hard off
     the line and is fully coupled by about 60 km/h.  Above that the only
     permitted slip is the tiny governor offset, which is what lock-up is. */
  const coupled = clamp((V.speed * 3.6 - 12) / 48, 0, 1);
  const maxSlip = lerp(CFG.IDLE_RPM * 2.6, 60, coupled);
  const rpmCeiling = V.turbineRpm + maxSlip * clamp(V.throttle * 1.2, 0.15, 1);

  /* ── where the crank wants to be from combustion alone ────────────────
     Free revving with no load, that is idle + throttle × the rev range.
     This is the number the old code blended towards and it ran away because
     nothing tied it to the road.  Now it is clamped by rpmCeiling. */
  let freeTarget = CFG.IDLE_RPM + V.throttle * (CFG.LIMITER_RPM - CFG.IDLE_RPM) * 0.92;

  /* once the converter is close to locked the engine is dragged by the road */
  if (V.tcLock > 0.05) {
    freeTarget = lerp(freeTarget, Math.max(V.turbineRpm, CFG.IDLE_RPM), V.tcLock);
  }

  /* the crank can never exceed the slip ceiling */
  const target = Math.min(freeTarget, rpmCeiling);

  /* engine rotational inertia: a light crank follows fast, but not instantly */
  const response = 1 - Math.exp(-dt / CFG.ENGINE_INERTIA);
  V.rpm = Math.max(V.rpm * (1 - response) + target * response, CFG.IDLE_RPM * 0.72);

  if (V.rpm >= CFG.REDLINE_RPM) V.limiterActive = true;
  else if (V.rpm < CFG.REDLINE_RPM - 220) V.limiterActive = false;

  V.clutch = 1 - V.tcLock;

  /* ── torque delivered to the gearbox ──────────────────────────────────
     Pump torque × the converter's multiplication.  At stall the multiplication
     is nearly 2, which is what makes an automatic launch hard; as the ratio
     approaches 1 it falls to unity and the car is effectively in direct
     drive.                                                       */
  const pumpT = (V.engineTorque + CFG.ENGINE_BRAKE * 0.4) *
                clamp(0.55 + V.throttle * 0.55, 0.55, 1.10);
  V.converterTorque = pumpT * converterTorqueRatio(sr);

  /* ── measured output, recomputed every step so the HUD cannot lie ───── */
  const tq = torqueAtRpm(V.rpm);
  V.torqueAtWheels = tq;
  V.powerKw = (tq * V.rpm * TAU / 60) / 1000;
  V.powerHp = V.powerKw * 1.34102;
}

/* ══════════════════════════════════════════════════════════════════════════
   TORQUE CONVERTER
   ══════════════════════════════════════════════════════════════════════════
   A fluid coupling sits between the engine and the gearbox.  Its behaviour is
   set by one number, the speed ratio

       SR = turbine rpm / engine rpm

   At SR = 0 (stalled, car held still) the engine can spin freely and the
   converter multiplies torque by about 1.95, which is why an automatic pulls
   away so strongly in first.  As SR rises the multiplication falls away to 1
   and the coupling starts to look like a slipping clutch.  Above the lock-up
   ratio a clutch plate closes and the link becomes solid — that is the moment
   the drivetrain stops feeling elastic and starts feeling direct.
   ══════════════════════════════════════════════════════════════════════════ */

/* how hard the converter multiplies torque at a given speed ratio */
function converterTorqueRatio(sr) {
  const t = clamp(sr / CFG.TC_LOCK_RATIO, 0, 1);
  /* falls from stall ratio to 1.0, with the steep initial fall a real
     converter shows */
  return lerp(CFG.TC_STALL_TORQUE, 1.0, Math.pow(t, 0.48));
}

/* the torque the pump can drag out of the engine at this rpm */
function pumpAbsorbTorque(rpm, sr) {
  const capacity = CFG.TC_K * rpm * rpm;
  /* a converter absorbs far less when it is nearly locked */
  return capacity * (1 - clamp(sr / CFG.TC_LOCK_RATIO, 0, 1) * 0.88);
}

function updateConverter(dt) {
  const turbineRpm = Math.max(0, wheelRpmToEngine());
  V.turbineRpm = turbineRpm;

  const sr = V.rpm > 60 ? clamp(turbineRpm / V.rpm, 0, 1.2) : 0;
  V.stallFactor = 1 - clamp(sr / CFG.TC_LOCK_RATIO, 0, 1);
  V.tcSlip = Math.max(0, V.rpm - turbineRpm);

  /* lock-up: only once the ratio has been above the threshold for a while,
     and it drops out again as soon as the box shifts or the car slows */
  /* lock by ROAD SPEED and ratio together, the way a real TCU schedules it:
     it locks in every gear once the car is rolling and the shift is done */
  const lockThreshold = V.tcLock > 0.5
    ? CFG.TC_LOCK_RATIO - 0.16
    : CFG.TC_LOCK_RATIO - 0.06;
  const rollingEnough = V.speed * 3.6 > 22;
  if (sr > lockThreshold && rollingEnough && V.shiftTimer <= 0 && V.gear !== -1) {
    V.tcLockTimer += dt;
    if (V.tcLockTimer > CFG.TC_LOCK_TIME) V.tcLock = Math.min(1, V.tcLock + dt * 9);
  } else {
    V.tcLockTimer = 0;
    V.tcLock = Math.max(0, V.tcLock - dt * 6);
  }

  /* V.converterTorque is produced by updateEngineSpeed, which owns the crank
     side of the coupling.  This function must NOT write it: doing so used
     lerp(..., tcLock), so it was a no-op when the converter was slipping and
     destructive when it was locked. */
}

function updateGearbox(dt) {
  V.shiftTimer = Math.max(0, V.shiftTimer - dt);

  /* manual shifts requested with Shift / Ctrl */
  if (V.shiftQueued !== 0) {
    const dir = V.shiftQueued;
    V.shiftQueued = 0;
    if (!V.gearboxAuto && V.shiftTimer <= 0) {
      let target = V.gear;
      if (V.gear === -1 && dir > 0) target = 1;
      else if (V.gear === 1 && dir < 0 && V.speed < 4) target = -1;
      else target = V.gear + dir;

      if (target !== V.gear && target >= -1 && target <= CFG.GEARS.length) {
        V.gear = target;
        V.shiftTimer = CFG.SHIFT_TIME;
      }
    }
  }

  if (!V.gearboxAuto || V.shiftTimer > 0) return;

  /* ══════════════════════════════════════════════════════════════════════
     AUTOMATIC SHIFT SCHEDULE  —  scheduled on ROAD SPEED, with hysteresis
     ══════════════════════════════════════════════════════════════════════
     Scheduling on engine rpm alone made the box hunt: a downshift spikes the
     turbine speed instantly, which immediately satisfies the upshift test and
     sends it straight back up.  A real TCU schedules on output (road) speed
     and leaves a wide gap between the up and down points, so the box commits
     to a gear and stays there.  Rpm is then only used as a veto at the top and
     bottom of the range.
     ══════════════════════════════════════════════════════════════════════ */
  const redlineRad = CFG.REDLINE_RPM * TAU / 60;
  const NGEAR = CFG.GEARS.length;
  const gearTopKph = (g) =>
    (redlineRad * CFG.WHEEL_R / (CFG.GEARS[g - 1] * CFG.FINAL_DRIVE)) * 3.6;

  const kph = V.speed * 3.6;
  const thr = clamp(V.throttle, 0, 1);

  /* upshift and downshift road speeds for each gear change, 0 → 1 … 4 → 5.
     Light throttle shifts low for economy; flat out holds each gear to ~0.92
     of its top speed.  The gap between the two columns is the hysteresis. */
  const upKph   = (g) => lerp(gearTopKph(g) * 0.30, gearTopKph(g) * 0.92, Math.pow(thr, 0.9));
  const downKph = (g) => lerp(gearTopKph(g) * 0.14, gearTopKph(g) * 0.55, Math.pow(thr, 0.9));

  /* ── upshift ─────────────────────────────────────────────────────────── */
  if (V.gear > 0 && V.gear < NGEAR) {
    /* whichever arrives first: the road-speed schedule, or the engine running
       out of revs (converter slip makes the second one bite first under load) */
    const bySpeed = kph > upKph(V.gear) && V.rpm > 1500;
    const byRpm = V.rpm > CFG.REDLINE_RPM - 250 && V.speed > 6;
    if (bySpeed || byRpm) {
      V.gear++;
      V.shiftTimer = CFG.SHIFT_TIME;
      V.tcLock *= 0.4;
      V.tcLockTimer = 0;
      return;
    }
  }

  /* ── downshift ───────────────────────────────────────────────────────── */
  if (V.gear > 1) {
    const into = V.gear - 1;
    /* do not select a gear whose top speed is already below the road speed */
    const fits = gearTopKph(into) > kph * 1.06;
    const must = (kph < downKph(into) || V.rpm < 1050) && fits;
    /* kickdown: a deep stab skips one gear when it would help */
    const kick = thr > 0.88 && V.rpm < CFG.REDLINE_RPM * 0.62 && V.gear > 1;
    if (must || kick) {
      V.gear--;
      V.shiftTimer = CFG.SHIFT_TIME;
      V.tcLock *= 0.4;
      V.tcLockTimer = 0;
    }
  }

  /* ── first gear from rest, and reverse ───────────────────────────────── */
  if (V.gear === 0) V.gear = 1;
}

/* ══════════════════════════════════════════════════════════════════════════
   20.  VISUAL SYNC
   ══════════════════════════════════════════════════════════════════════════ */
function syncCarMesh() {
  carRoot.position.copy(V.pos);
  carRoot.quaternion.copy(V.quat);

  for (let i = 0; i < 4; i++) {
    const w = wheels[i], vis = wheelVisuals[i];

    /* Anchor the hub to Y_HUB (the height the arches are cut for) and let the
       suspension move it from there.  STATIC_HANG is the rest value of `hang`,
       so at rest the offset is zero and the tyre sits exactly on the road;
       under load it rises and in droop it falls, which is the travel the
       physics already computed.  Placing it at HARD_Y - hang instead put the
       hub at -0.31 against an arch cut for -0.25 and buried every tyre 6 cm. */
    vis.group.position.set(w.def.x, Y_HUB - (w.hang - STATIC_HANG), w.def.z);
    vis.steer.rotation.y = w.def.front ? V.steer : 0;
    vis.spin.rotation.x = w.angle;
  }
}


/* ══════════════════════════════════════════════════════════════════════════
   21.  INPUT
   ══════════════════════════════════════════════════════════════════════════ */
step(60, 'kontroller bağlanıyor…');

const KEYS = Object.create(null);
const TOUCH = { left: 0, right: 0, gas: 0, brake: 0, hb: 0 };

const KEYMAP = {
  KeyW: 1, ArrowUp: 1,
  KeyS: 1, ArrowDown: 1,
  KeyA: 1, ArrowLeft: 1,
  KeyD: 1, ArrowRight: 1,
  Space: 1,
};

function flashChips() {
  CHIP.auto.classList.toggle('on', V.gearboxAuto);
  CHIP.auto.querySelector('span').textContent = V.gearboxAuto ? 'vites' : 'manuel';
  CHIP.abs.classList.toggle('on', V.abs);
  CHIP.abs.querySelector('span').textContent = V.abs ? 'açık' : 'kapalı';
  CHIP.light.classList.toggle('on', lightsOn);
  CHIP.light.querySelector('span').textContent = lightsOn ? 'açık' : 'kapalı';
}

function toggleLights() {
  lightsOn = !lightsOn;
  headlights.forEach((m) => {
    m.material.emissive.setHex(lightsOn ? 0xfff2cc : 0x000000);
    m.material.emissiveIntensity = lightsOn ? 2.0 : 0;
  });
  beamL.visible = lightsOn;
  beamR.visible = lightsOn;
}

function cycleCamera() {
  CAM.mode = (CAM.mode + 1) % 3;
  camLabel.textContent = CAM.names[CAM.mode];
  camLabel.classList.add('show');
  clearTimeout(camLabelTimer);
  camLabelTimer = setTimeout(() => camLabel.classList.remove('show'), 1200);
}

window.addEventListener('keydown', (e) => {
  if (KEYMAP[e.code]) { KEYS[e.code] = 1; e.preventDefault(); }
  if (e.repeat) return;

  switch (e.code) {
    case 'KeyT': V.gearboxAuto = !V.gearboxAuto; flashChips(); break;
    case 'ShiftLeft': case 'ShiftRight': V.shiftQueued = 1; break;
    case 'ControlLeft': case 'ControlRight': V.shiftQueued = -1; e.preventDefault(); break;
    case 'KeyB': V.abs = !V.abs; flashChips(); break;
    case 'KeyL': toggleLights(); flashChips(); break;
    case 'KeyC': cycleCamera(); break;
    case 'KeyR': resetVehicle(); break;
    case 'KeyG': V.gear = (V.gear === -1 ? 1 : -1); V.shiftTimer = 0.1; break;
    case 'F1': $('debug').classList.toggle('on'); e.preventDefault(); break;
  }
}, { passive: false });

window.addEventListener('keyup', (e) => { if (KEYMAP[e.code]) KEYS[e.code] = 0; });
window.addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = 0; });

/* ── touch pads ─────────────────────────────────────────────────────────── */
if (IS_MOBILE) $('touch').classList.add('on');
window.addEventListener('touchstart', () => $('touch').classList.add('on'), { once: true, passive: true });

/* Every control is a pointer target.  Pointer capture means a thumb that
   slides off the button still releases it — without that the pedal sticks on
   and the car drives itself into the scenery. */
document.querySelectorAll('[data-act]').forEach((pad) => {
  const act = pad.dataset.act;
  const down = (e) => {
    e.preventDefault();
    pad.classList.add('hit');
    if (act === 'cam') { cycleCamera(); return; }
    if (act === 'reset') { resetVehicle(); return; }
    if (TOUCH[act] !== undefined) TOUCH[act] = 1;
  };
  const up = (e) => {
    if (e) e.preventDefault();
    pad.classList.remove('hit');
    if (TOUCH[act] !== undefined) TOUCH[act] = 0;
  };
  pad.addEventListener('pointerdown', (e) => { pad.setPointerCapture(e.pointerId); down(e); });
  pad.addEventListener('pointerup', up);
  pad.addEventListener('pointercancel', up);
  pad.addEventListener('pointerleave', (e) => { if (!e.buttons) up(e); });
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
});

/* ── live feedback for the touch controls ────────────────────────────────
   The pedals and the steering gauge are driven from the same values the
   physics uses, so what you see is what the car is being told to do.      */
const _elGasFill   = $('gasFill');
const _elBrakeFill = $('brakeFill');
const _elNeedle    = $('sgNeedle');
const _elArc       = $('sgArc');
const STEER_ARC_R  = 24;
const STEER_ARC_MAX = 1.15;   // radians of lock the gauge represents

function updateTouchFeedback() {
  /* pedal fill: the pedal's own input, with a short fade so it reads as a
     press rather than a flicker */
  const gas   = clamp(Math.max(TOUCH.gas, KEYS.KeyW || KEYS.ArrowUp ? 1 : 0), 0, 1);
  const brake = clamp(Math.max(TOUCH.brake, KEYS.KeyS || KEYS.ArrowDown ? 1 : 0), 0, 1);
  if (_elGasFill)   _elGasFill.style.height   = (gas * 100).toFixed(0) + '%';
  if (_elBrakeFill) _elBrakeFill.style.height = (brake * 100).toFixed(0) + '%';

  /* steering gauge: needle turns with the wheel, arc fills from centre */
  if (_elNeedle) {
    const ang = clamp(-V.steer / STEER_ARC_MAX, -1, 1) * 90;   // degrees
    _elNeedle.setAttribute('transform', `rotate(${ang.toFixed(1)} 30 30)`);
  }
  if (_elArc) {
    const t = clamp(Math.abs(V.steer) / STEER_ARC_MAX, 0, 1);
    const sweep = t * Math.PI * 0.5;
    const dir = V.steer >= 0 ? -1 : 1;
    const a0 = -Math.PI / 2;
    const a1 = a0 + dir * sweep;
    const x0 = 30 + STEER_ARC_R * Math.cos(a0);
    const y0 = 30 + STEER_ARC_R * Math.sin(a0);
    const x1 = 30 + STEER_ARC_R * Math.cos(a1);
    const y1 = 30 + STEER_ARC_R * Math.sin(a1);
    const large = Math.abs(sweep) > Math.PI ? 1 : 0;
    _elArc.setAttribute('d',
      `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${STEER_ARC_R} ${STEER_ARC_R} 0 ${large} ${dir < 0 ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}`);
  }
}

function readInput() {
  const gas = KEYS.KeyW || KEYS.ArrowUp ? 1 : 0;
  const brk = KEYS.KeyS || KEYS.ArrowDown ? 1 : 0;
  const lft = KEYS.KeyA || KEYS.ArrowLeft ? 1 : 0;
  const rgt = KEYS.KeyD || KEYS.ArrowRight ? 1 : 0;
  const hb = KEYS.Space ? 1 : 0;

  let thr = Math.max(gas, TOUCH.gas);
  let br = Math.max(brk, TOUCH.brake);
  /* +steer = turn LEFT (that is the sign the physics uses).  This used to be
     `right − left`, which inverted the whole control: D swung the car left
     and A swung it right. */
  const steer = (Math.max(lft, TOUCH.left) - Math.max(rgt, TOUCH.right));
  inputHandbrake = Math.max(hb, TOUCH.hb);
  inputSteer = clamp(steer, -1, 1);

  /* W/S keep their meaning at any speed; S doubles as reverse when stopped */
  if (V.speed < 1.0 && br > 0.1 && thr < 0.1) {
    V.gear = -1;
    inputThrottle = br;          // reversing: S drives backwards
    inputBrake = 0;
  } else {
    if (V.gear === -1 && thr > 0.1) V.gear = 1;
    inputThrottle = thr;
    inputBrake = br;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   22.  CAMERAS
   ══════════════════════════════════════════════════════════════════════════ */
const CAM = {
  mode: 0,
  names: ['TAKİP', 'KAPUT', 'KOKPİT'],
  pos: new THREE.Vector3(),
  fov: CFG.FOV_BASE,
  init: false,
};

const _cf = new THREE.Vector3();
const _cu = new THREE.Vector3();
const _cr = new THREE.Vector3();
const _camWant = new THREE.Vector3();
const _camLook = new THREE.Vector3();
const _worldUp = new THREE.Vector3(0, 1, 0);

function updateCamera(dt) {
  _cf.set(0, 0, 1).applyQuaternion(V.quat);
  _cu.set(0, 1, 0).applyQuaternion(V.quat);
  _cr.set(1, 0, 0).applyQuaternion(V.quat);

  const sN = clamp(V.speed / 45, 0, 1);

  if (CAM.mode === 0) {
    const back = 6.6 + sN * 2.4;
    const up = 2.35 + sN * 0.45;

    _camWant.copy(V.pos).addScaledVector(_cf, -back).addScaledVector(_cu, up);

    /* never let the chase camera sink into a hill */
    const gh = terrainHeight(_camWant.x, _camWant.z) + 1.5;
    if (_camWant.y < gh) _camWant.y = gh;

    if (!CAM.init) { CAM.pos.copy(_camWant); CAM.init = true; }
    CAM.pos.lerp(_camWant, 1 - Math.exp(-7.5 * dt));

    _camLook.copy(V.pos).addScaledVector(_cf, 7.0 + sN * 9).addScaledVector(_cu, 0.55);

    camera.position.copy(CAM.pos);
    camera.up.copy(_worldUp);
    camera.lookAt(_camLook);

    /* the field of view opens up with speed — the classic chase cue */
    const targetFov = lerp(CFG.FOV_BASE, CFG.FOV_MAX, sN * sN);
    CAM.fov = lerp(CAM.fov, targetFov, 1 - Math.exp(-4.5 * dt));

  } else if (CAM.mode === 1) {
    /* hood cam: ahead of the windscreen, rigidly attached */
    _camWant.copy(V.pos).addScaledVector(_cf, 0.55).addScaledVector(_cu, 0.80);
    camera.position.copy(_camWant);
    camera.up.copy(_cu);
    _camLook.copy(_camWant).addScaledVector(_cf, 25).addScaledVector(_cu, 0.15);
    camera.lookAt(_camLook);
    CAM.fov = lerp(CAM.fov, CFG.FOV_BASE + 6 + sN * 7, 1 - Math.exp(-6 * dt));

  } else {
    /* Cockpit: the driver's eye.  In model space the driver sits at
       x = +0.34 (left-hand drive), y = 0.92 above the centre of mass and
       z = 0.02, which puts the eye just behind the wheel and below the roof. */
    _camWant.copy(V.pos)
      .addScaledVector(_cf, 0.02)
      .addScaledVector(_cu, 0.92)
      .addScaledVector(_cr, 0.34);
    camera.position.copy(_camWant);
    camera.up.copy(_cu);
    _camLook.copy(_camWant).addScaledVector(_cf, 25).addScaledVector(_cu, -0.03);
    camera.lookAt(_camLook);
    CAM.fov = lerp(CAM.fov, CFG.FOV_BASE + 2 + sN * 8, 1 - Math.exp(-6 * dt));
  }

  if (Math.abs(camera.fov - CAM.fov) > 0.01) {
    camera.fov = CAM.fov;
    camera.updateProjectionMatrix();
  }

  /* drag the shadow frustum along with the car */
  sunLight.position.set(V.pos.x + 80, V.pos.y + 120, V.pos.z + 62);
  sunLight.target.position.copy(V.pos);
  sunLight.target.updateMatrixWorld();
}

let lightsOn = false;

const beamL = new THREE.SpotLight(0xfff4d6, 0, 55, 0.42, 0.6, 1.2);
const beamR = new THREE.SpotLight(0xfff4d6, 0, 55, 0.42, 0.6, 1.2);
