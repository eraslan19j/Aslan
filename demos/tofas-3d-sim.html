<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Şahin — 3D Sürüş Simülatörü</title>
<style>
  :root{
    --ink:#eef2f7; --dim:#8b95a5; --warm:#e8c05a; --hot:#ff5a3c;
    --panel:rgba(10,14,20,.62); --edge:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#070a0e;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink);overscroll-behavior:none;touch-action:none}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #app canvas{position:fixed;inset:0;width:100%!important;height:100%!important}

  /* ══════════ loader ══════════ */
  #load{position:fixed;inset:0;z-index:60;display:grid;place-content:center;gap:16px;
    background:radial-gradient(ellipse at 50% 38%,#16202e,#070a0e 72%);text-align:center;
    transition:opacity .6s ease,visibility .6s;padding:24px}
  #load.gone{opacity:0;visibility:hidden}
  #load h1{font:700 32px/1 ui-monospace,monospace;letter-spacing:.2em;color:#f3e6c8}
  #load h1 small{display:block;margin-top:9px;font:500 9px/1 ui-monospace,monospace;
    letter-spacing:.4em;color:#6f7b8c}
  #bar{width:220px;height:2px;background:#1d2531;margin:4px auto 0;overflow:hidden;border-radius:2px}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#c99b3d,#f0d68a);
    transition:width .3s ease}
  #msg{font-size:9px;letter-spacing:.18em;color:#5d6878;text-transform:uppercase;
    min-height:14px;max-width:80vw;margin:0 auto}
  #msg.err{color:#ff7a5c;letter-spacing:.03em;text-transform:none;line-height:1.5}

  /* ══════════ HUD ══════════ */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
    transition:opacity .7s .2s}
  #hud.on{opacity:1}

  #cluster{position:absolute;right:max(14px,env(safe-area-inset-right));
    bottom:max(14px,env(safe-area-inset-bottom));width:180px;height:180px}
  #cluster svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .dial-bg{fill:rgba(8,11,16,.7);stroke:rgba(255,255,255,.09);stroke-width:1}
  #spdArc,#rpmArc{fill:none;stroke-linecap:round}
  #spdArc{stroke-width:5}
  #rpmArc{stroke-width:3.2;opacity:.92}
  #spdNum{font:700 38px/1 ui-monospace,monospace;fill:#f4f7fb;letter-spacing:-.03em}
  #spdUnit{font:600 8px/1 ui-monospace,monospace;fill:#79849a;letter-spacing:.24em}
  #gearNum{font:700 16px/1 ui-monospace,monospace;fill:#e8c05a}
  #gearLbl{font:600 6px/1 ui-monospace,monospace;fill:#66707f;letter-spacing:.2em}
  #rpmMini{font:600 8px/1 ui-monospace,monospace;fill:#8b95a5;letter-spacing:.08em}

  #minimap{position:absolute;left:max(14px,env(safe-area-inset-left));
    top:max(14px,env(safe-area-inset-top));width:128px;height:128px;border-radius:10px;
    overflow:hidden;background:rgba(8,11,16,.6);border:1px solid var(--edge);
    backdrop-filter:blur(6px)}
  #mapCanvas{display:block;width:100%;height:100%}

  #chips{position:absolute;left:max(14px,env(safe-area-inset-left));
    top:calc(max(14px,env(safe-area-inset-top)) + 136px);
    display:flex;flex-direction:column;gap:4px;font-size:8px;letter-spacing:.12em}
  .chip{display:flex;align-items:center;gap:5px;padding:2.5px 7px;border-radius:20px;
    background:var(--panel);border:1px solid var(--edge);color:#7d8898;
    text-transform:uppercase;transition:all .18s}
  .chip b{color:#c3ccd8;font-weight:600}
  .chip.on{color:#0b0e13;background:#e8c05a;border-color:#e8c05a}
  .chip.on b{color:#0b0e13}

  #shift{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%) scale(.7);
    font:700 50px/1 ui-monospace,monospace;color:#fff;opacity:0;
    text-shadow:0 0 26px rgba(232,192,90,.65);pointer-events:none}
  #shift.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
  }

  /* ══════════ touch ══════════ */
  #touch{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;
    transition:opacity .4s}
  #touch.on{opacity:1}
  .pad{position:absolute;pointer-events:auto;display:grid;place-items:center;
    border-radius:50%;background:rgba(12,17,24,.46);border:1.5px solid rgba(255,255,255,.12);
    backdrop-filter:blur(4px);user-select:none;
    transition:background .1s,border-color .1s,transform .1s}
  .pad.hit{background:rgba(232,192,90,.3);border-color:rgba(232,192,90,.8);transform:scale(.95)}
  .pad svg{width:46%;height:46%;fill:none;stroke:rgba(240,246,252,.7);
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #padL{left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));
    width:84px;height:84px}
  #padR{right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));
    width:84px;height:84px}
  #padGas{right:calc(max(16px,env(safe-area-inset-right)) + 96px);
    bottom:max(16px,env(safe-area-inset-bottom));width:64px;height:64px}
  #padBrake{right:calc(max(16px,env(safe-area-inset-right)) + 96px);
    bottom:calc(max(16px,env(safe-area-inset-bottom)) + 72px);width:64px;height:64px}
  #padHB{left:calc(max(16px,env(safe-area-inset-left)) + 92px);
    bottom:calc(max(16px,env(safe-area-inset-bottom)) + 6px);width:52px;height:52px;
    font:600 8px/1 ui-monospace,monospace;letter-spacing:.08em;color:#9aa5b5}
  #padCam{right:max(14px,env(safe-area-inset-right));
    top:calc(max(14px,env(safe-area-inset-top)) + 2px);width:42px;height:42px;border-radius:11px;
    font:600 8px/1 ui-monospace,monospace;letter-spacing:.04em;color:#9aa5b5}
  #padReset{right:calc(max(14px,env(safe-area-inset-right)) + 48px);
    top:calc(max(14px,env(safe-area-inset-top)) + 2px);width:42px;height:42px;border-radius:11px}

  /* ══════════ debug ══════════ */
  #debug{position:fixed;left:max(14px,env(safe-area-inset-left));
    bottom:max(14px,env(safe-area-inset-bottom));z-index:25;
    padding:10px 12px;border-radius:9px;background:rgba(6,9,13,.87);
    border:1px solid var(--edge);font-size:9.5px;line-height:1.55;
    letter-spacing:.01em;color:#9aa5b5;display:none;min-width:236px;
    backdrop-filter:blur(8px);pointer-events:none}
  #debug.on{display:block}
  #debug h4{font-size:7.5px;letter-spacing:.2em;color:#5c6675;text-transform:uppercase;
    margin:0 0 5px;font-weight:600}
  #debug h4:not(:first-child){margin-top:8px}
  #debug .row{display:flex;justify-content:space-between;gap:10px}
  #debug .row span:last-child{color:#dfe6ef;font-variant-numeric:tabular-nums}
  #debug .w{display:grid;grid-template-columns:26px 1fr 56px;gap:5px;align-items:center;
    margin-bottom:2px}
  #debug .w em{font-style:normal;color:#6f7a8a;font-size:8px}
  #debug .w i{height:3px;background:#4d9de0;display:block;border-radius:2px;width:0%}
  #debug .w span{color:#dfe6ef;font-variant-numeric:tabular-nums;font-size:8.5px;text-align:right}

  /* ══════════ help ══════════ */
  #help{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:22;padding:6px 14px;border-radius:20px;
    background:var(--panel);border:1px solid var(--edge);font-size:8.5px;
    letter-spacing:.07em;color:#7b8697;white-space:nowrap;backdrop-filter:blur(6px);
    transition:opacity .6s;pointer-events:none;text-transform:uppercase}
  #help.dim{opacity:0}
  #help b{color:#b9c3d0;font-weight:600}
  @media (max-width:820px){ #help{display:none} }
  @media (max-height:440px){
    #cluster{width:124px;height:124px} #minimap{width:92px;height:92px}
    #padL,#padR{width:70px;height:70px}
  }
  #camLabel{position:fixed;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 44px));
    transform:translateX(-50%);z-index:24;font:600 9px/1 ui-monospace,monospace;
    letter-spacing:.28em;color:#c9a24a;opacity:0;transition:opacity .3s;
    text-transform:uppercase;pointer-events:none}
  #camLabel.show{opacity:1}
</style>
</head>
<body>

<div id="app"></div>

<div id="load">
  <h1>ŞAHİN<small>3D DRIVING SIMULATOR</small></h1>
  <div id="bar"><i></i></div>
  <div id="msg">yükleniyor…</div>
</div>

<div id="hud">
  <div id="minimap"><canvas id="mapCanvas" width="256" height="256"></canvas></div>

  <div id="chips">
    <div class="chip on" id="chipAuto"><b>OTO</b><span>vites</span></div>
    <div class="chip" id="chipAbs"><b>ABS</b><span>kapalı</span></div>
    <div class="chip" id="chipLight"><b>FAR</b><span>kapalı</span></div>
  </div>

  <svg id="cluster" viewBox="0 0 180 180">
    <defs>
      <linearGradient id="gradSpd" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#5ac8e8"/>
        <stop offset="0.52" stop-color="#e8c05a"/>
        <stop offset="1" stop-color="#ff5a3c"/>
      </linearGradient>
      <linearGradient id="gradRpm" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#4a5568"/>
        <stop offset="0.76" stop-color="#c8d0dc"/>
        <stop offset="1" stop-color="#ff5a3c"/>
      </linearGradient>
    </defs>
    <circle class="dial-bg" cx="90" cy="90" r="84"/>
    <g id="ticks"></g>
    <path id="rpmArc" d="" stroke="url(#gradRpm)"/>
    <path id="spdArc" d="" stroke="url(#gradSpd)"/>
    <text id="spdNum" x="90" y="94" text-anchor="middle">0</text>
    <text id="spdUnit" x="90" y="109" text-anchor="middle">KM/H</text>
    <text id="gearNum" x="136" y="146" text-anchor="middle">N</text>
    <text id="gearLbl" x="136" y="156" text-anchor="middle">VİTES</text>
    <text id="rpmMini" x="44" y="146" text-anchor="middle">0</text>
  </svg>

  <div id="shift"></div>
</div>

<div id="touch">
  <div class="pad" id="padL" data-act="left">
    <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>
  </div>
  <div class="pad" id="padR" data-act="right">
    <svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
  </div>
  <div class="pad" id="padGas" data-act="gas">
    <svg viewBox="0 0 24 24"><path d="M12 19 L12 5 M6 11 L12 5 L18 11"/></svg>
  </div>
  <div class="pad" id="padBrake" data-act="brake">
    <svg viewBox="0 0 24 24"><path d="M6 12 L18 12"/></svg>
  </div>
  <div class="pad" id="padHB" data-act="hb">EL</div>
  <div class="pad" id="padCam" data-act="cam">CAM</div>
  <div class="pad" id="padReset" data-act="reset">
    <svg viewBox="0 0 24 24" style="width:42%;height:42%"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
  </div>
</div>

<div id="debug"></div>

<div id="help">
  <b>W/S</b> gaz·fren &nbsp; <b>A/D</b> direksiyon &nbsp; <b>Space</b> el freni &nbsp;
  <b>T</b> oto/manuel &nbsp; <b>Shift/Ctrl</b> vites &nbsp; <b>B</b> ABS &nbsp;
  <b>L</b> far &nbsp; <b>C</b> kamera &nbsp; <b>R</b> sıfırla &nbsp; <b>F1</b> teşhis
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';
try { boot(); } catch (e) { console.error(e); }
function boot() {


/* ══════════════════════════════════════════════════════════════════════════
   0.  BOOT PLUMBING
   ══════════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const UI = { msg: $('msg'), bar: $('bar').firstElementChild, load: $('load') };

function step(pct, text) {
  UI.bar.style.width = pct + '%';
  if (text) UI.msg.textContent = text;
}
function fail(err) {
  console.error(err);
  UI.msg.className = 'err';
  UI.msg.textContent = 'Başlatılamadı: ' + (err && err.message ? err.message : err);
}
window.addEventListener('error', (e) => { if (!window.__ready) fail(e.error || e.message); });

/* ══════════════════════════════════════════════════════════════════════════
   1.  CONSTANTS
   ══════════════════════════════════════════════════════════════════════════ */
const CFG = {
  MASS: 1050,
  /* body-space inertia: x = pitch axis, y = yaw axis, z = roll axis */
  INERTIA: new THREE.Vector3(1400, 1500, 420),
  /* CoM height above the wheel-centre line (so 0.25 + wheel radius above
     the road, roughly 0.55 m — right for a rear-drive 1980s sedan) */
  COM_Y: 0.25,
  WHEELBASE: 2.46,
  TRACK: 1.33,
  WHEEL_R: 0.305,
  WHEEL_W: 0.19,
  FRONT_WEIGHT: 0.55,

  /* suspension is specified the way a chassis engineer would: a static
     deflection (which sets the ride frequency) and a damping ratio.  The
     spring rate per corner is then derived from the corner weight, so the
     car always sits exactly at its design ride height. */
  STATIC_DEFL: 0.125,      // m of spring compression carrying the car
  DAMP_RATIO: 0.38,        // fraction of critical damping
  SUSP_TRAVEL: 0.30,       // m of usable travel either side of static
  BUMP_STOP_RATIO: 6.5,    // bump stop stiffness as a multiple of the spring
  ARB_FRONT: 0.42,         // anti-roll bar share of the axle roll stiffness
  ARB_REAR: 0.26,

  TYRE_B: 11.0,          // cornering / braking stiffness
  TYRE_B_DRIVE: 5.2,     // accelerating: peak slip is further out
  TYRE_C: 1.42,
  TYRE_E: 0.32,
  SLIP_V_MIN: 2.4,
  ROLL_RES: 0.014,

  IDLE_RPM: 850,
  REDLINE_RPM: 5800,
  LIMITER_RPM: 6300,
  ENGINE_INERTIA: 0.19,
  ENGINE_BRAKE: 26,

  GEARS: [3.50, 1.95, 1.32, 1.00],
  FINAL_DRIVE: 4.10,
  DRIVELINE_EFF: 0.91,
  DIFF_LOCK: 0.55,
  AUTO_UP: 4900,
  AUTO_DOWN: 1900,
  SHIFT_TIME: 0.24,

  BRAKE_TORQUE: 2500,
  BRAKE_BIAS: 0.62,
  HANDBRAKE_TRQ: 2600,
  ABS_SLIP: 0.20,

  STEER_MAX: 0.56,
  STEER_RATE: 3.4,
  STEER_RETURN: 5.2,
  STEER_SPEED_LO: 4.0,
  STEER_SPEED_HI: 42.0,

  DRAG_CD: 0.38,
  FRONTAL_AREA: 1.90,
  AIR_DENSITY: 1.22,
  DOWNFORCE: 0.30,

  FIXED_DT: 1 / 120,
  MAX_SUBSTEPS: 4,

  FOV_BASE: 62,
  FOV_MAX: 78,
};

const SURFACES = {
  asphalt: { mu: 1.00, roll: 1.00, dust: 0.00, smoke: 0.55 },
  gravel:  { mu: 0.62, roll: 1.90, dust: 1.00, smoke: 0.05 },
  grass:   { mu: 0.46, roll: 3.10, dust: 0.75, smoke: 0.02 },
  kerb:    { mu: 0.92, roll: 1.15, dust: 0.05, smoke: 0.40 },
};

/* ══════════════════════════════════════════════════════════════════════════
   2.  MATH
   ══════════════════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const approach = (cur, tgt, rate) => cur + clamp(tgt - cur, -rate, rate);
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

let _seed = 0x5A17;
const rnd = () => { _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5; return ((_seed >>> 0) % 100000) / 100000; };
const rrnd = (a, b) => a + rnd() * (b - a);

/* ══════════════════════════════════════════════════════════════════════════
   3.  NOISE
   ══════════════════════════════════════════════════════════════════════════ */
const PERM = (() => {
  const p = new Uint8Array(512), t = new Uint8Array(256);
  let s = 1337;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 256; i++) t[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = t[i]; t[i] = t[j]; t[j] = tmp; }
  for (let i = 0; i < 512; i++) p[i] = t[i & 255];
  return p;
})();

const _fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function _grad(h, x, y) {
  switch (h & 7) {
    case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
    case 4: return x; case 5: return -x; case 6: return y; default: return -y;
  }
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const X = xi & 255, Y = yi & 255;
  const xf = x - xi, yf = y - yi;
  const u = _fade(xf), v = _fade(yf);
  const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1];
  const ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
  const x1 = lerp(_grad(aa, xf, yf), _grad(ba, xf - 1, yf), u);
  const x2 = lerp(_grad(ab, xf, yf - 1), _grad(bb, xf - 1, yf - 1), u);
  return lerp(x1, x2, v);
}
function fbm(x, y, oct = 4) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += noise2(x * f, y * f) * a; n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

/* ══════════════════════════════════════════════════════════════════════════
   4.  TRACK
   ══════════════════════════════════════════════════════════════════════════ */
const TRACK = {
  width: 11.5,
  kerbW: 1.15,
  pts: [
    [0, -96], [64, -104], [118, -84], [142, -40],
    [138, 8], [112, 44], [146, 80], [140, 124],
    [98, 150], [42, 142], [0, 118], [-46, 126],
    [-92, 112], [-124, 74], [-136, 26], [-122, -22],
    [-136, -62], [-112, -100], [-58, -110],
  ],
  /* the track climbs and falls around the lap — these are the coefficients
     of a periodic elevation function in arc-length space (see elevAt) */
  elevA: 4.5, elevB: 2.0,
  ramp: { x: -118, z: 96, len: 16, w: 9, h: 2.0 },
  bumps: [{ x: 152, z: -62 }, { x: -128, z: 50 }, { x: 42, z: 132 }],
  puddles: [
    { x: 126, z: 62, r: 5.5 },
    { x: -70, z: -92, r: 4.8 },
    { x: -20, z: 130, r: 6.2 },
  ],
  gravel: { x: 26, z: -28, r: 27 },
};

const PATH = (() => {
  const cps = TRACK.pts.map(([x, z]) => new THREE.Vector3(x, 0, z));
  const curve = new THREE.CatmullRomCurve3(cps, true, 'centripetal', 0.5);
  const N = 1000;
  const samples = curve.getSpacedPoints(N);
  samples.pop();
  const len = curve.getLength();
  const tang = samples.map((p, i) => {
    const a = samples[(i - 1 + samples.length) % samples.length];
    const b = samples[(i + 1) % samples.length];
    return new THREE.Vector3().subVectors(b, a).normalize();
  });
  const CELL = 18;
  const buckets = new Map();
  samples.forEach((p, i) => {
    const k = Math.floor(p.x / CELL) + ',' + Math.floor(p.z / CELL);
    let arr = buckets.get(k);
    if (!arr) { arr = []; buckets.set(k, arr); }
    arr.push(i);
  });
  return { curve, samples, tang, len, buckets, CELL, N: samples.length };
})();

const _near = { i: 0, dist: 0, lateral: 0, s: 0 };
function nearestOnPath(x, z) {
  const CELL = PATH.CELL;
  const ci = Math.floor(x / CELL), cj = Math.floor(z / CELL);
  let best = -1, bestD2 = Infinity;
  for (let ring = 0; ring <= 2; ring++) {
    for (let dx = -ring; dx <= ring; dx++) {
      for (let dz = -ring; dz <= ring; dz++) {
        if (ring > 0 && Math.abs(dx) !== ring && Math.abs(dz) !== ring) continue;
        const list = PATH.buckets.get((ci + dx) + ',' + (cj + dz));
        if (!list) continue;
        for (let n = 0; n < list.length; n++) {
          const idx = list[n], p = PATH.samples[idx];
          const d2 = (p.x - x) ** 2 + (p.z - z) ** 2;
          if (d2 < bestD2) { bestD2 = d2; best = idx; }
        }
      }
    }
    if (best >= 0 && ring >= 1) break;
  }
  if (best < 0) {
    for (let i = 0; i < PATH.samples.length; i++) {
      const p = PATH.samples[i];
      const d2 = (p.x - x) ** 2 + (p.z - z) ** 2;
      if (d2 < bestD2) { bestD2 = d2; best = i; }
    }
  }
  const p = PATH.samples[best], tg = PATH.tang[best];
  const ox = x - p.x, oz = z - p.z;
  _near.i = best;
  _near.dist = Math.sqrt(bestD2);
  _near.lateral = tg.z * ox - tg.x * oz;
  _near.s = best / PATH.N;
  return _near;
}

/* ── altitude of the racing surface, as a smooth periodic function of the
      normalised arc length.  Two harmonics are enough for a believable lap
      with a climb, a crest and a dip, and it closes the loop exactly. ── */
function elevAt(t) {
  /* f(0) === f(1) because both terms have integer frequency */
  return TRACK.elevA * Math.sin(TAU * t)
       + TRACK.elevB * Math.sin(TAU * 2 * t + 1.15);
}

/* ── terrain height ─────────────────────────────────────────────────────── */
function terrainHeight(x, z) {
  const n = nearestOnPath(x, z);
  const halfW = TRACK.width * 0.5;
  const away = Math.max(0, n.dist - halfW);

  /* the road surface is the reference plane; everything else grows from it */
  let h = elevAt(n.s);

  let add = 0;
  const rise = smoothstep(3, 46, away);
  add += rise * (fbm(x * 0.0105, z * 0.0105, 4) * 3.4 + 0.45);
  add += rise * fbm(x * 0.042, z * 0.042, 3) * 0.5;
  add *= smoothstep(0, 4.2, away);

  /* the gravel pad is flattened so drifting is predictable */
  const G = TRACK.gravel;
  const gd = Math.hypot(x - G.x, z - G.z);
  if (gd < G.r + 10) {
    const padH = elevAt(nearestOnPath(G.x, G.z).s) + 0.55;
    const k = smoothstep(G.r * 0.62, G.r * 0.98, gd);
    add = lerp(add * 0.15, add, k);
    h = lerp(padH, h, smoothstep(G.r * 0.62, G.r * 1.25, gd)) + add;
    return h;
  }
  h += add;

  /* ramp — wedge along +X, road-aligned */
  const R = TRACK.ramp;
  if (Math.abs(z - R.z) < R.w * 0.5 && x > R.x && x < R.x + R.len) {
    const t = (x - R.x) / R.len;
    h += R.h * t * t;
  }
  if (Math.abs(z - R.z) < R.w * 0.5 && x >= R.x + R.len && x < R.x + R.len + 4) {
    h += R.h * (1 - smoothstep(0, 4, x - R.x - R.len));
  }

  /* speed bumps: shallow humps sitting on the asphalt, judged by path distance */
  if (n.dist < halfW + 2) {
    for (let b = 0; b < TRACK.bumps.length; b++) {
      const B = TRACK.bumps[b];
      const d = Math.hypot(x - B.x, z - B.z);
      if (d < 2.2) h += 0.115 * Math.cos((d / 2.2) * Math.PI * 0.5) ** 2;
    }
  }
  return h;
}

/* ── surface at a point ─────────────────────────────────────────────────── */
function surfaceAt(x, z) {
  const n = nearestOnPath(x, z);
  const halfW = TRACK.width * 0.5;

  if (n.dist < halfW) {
    /* puddles carve into the asphalt */
    for (let i = 0; i < TRACK.puddles.length; i++) {
      const P = TRACK.puddles[i];
      if (Math.hypot(x - P.x, z - P.z) < P.r) return 'wet';
    }
    return 'asphalt';
  }
  if (n.dist < halfW + TRACK.kerbW) return 'kerb';

  const G = TRACK.gravel;
  if (Math.hypot(x - G.x, z - G.z) < G.r) return 'gravel';

  /* a gravel shoulder hugging the road before the grass takes over */
  if (n.dist < halfW + 4.0) return 'gravel';

  return 'grass';
}

/* wet is asphalt with reduced grip — derived rather than duplicated */
const WET = { mu: 0.58, roll: 1.05, dust: 0.0, smoke: 0.10 };
function surfProps(key) {
  if (key === 'wet') return WET;
  return SURFACES[key] || SURFACES.grass;
}

/* ══════════════════════════════════════════════════════════════════════════
   8.  ROAD / KERBS / START LINE
   ══════════════════════════════════════════════════════════════════════════
   A ribbon is swept along the spline.  Each slice asks the same
   terrainHeight() the physics uses, so the visible road can never drift away
   from the surface the wheels are riding on.
   ══════════════════════════════════════════════════════════════════════════ */
function ribbonGeometry(offsets, yLift, vTiles) {
  /* offsets = [leftEdge, rightEdge] as signed metres from the centreline,
     positive = the car's left when travelling forwards */
  const N = PATH.N;
  const nOff = offsets.length;
  const verts = new Float32Array((N + 1) * nOff * 3);
  const uvs = new Float32Array((N + 1) * nOff * 2);
  const idx = [];

  for (let i = 0; i <= N; i++) {
    const k = i % N;
    const p = PATH.samples[k], tg = PATH.tang[k];
    const lx = tg.z, lz = -tg.x;                  // left normal in XZ
    for (let j = 0; j < nOff; j++) {
      const off = offsets[j];
      const x = p.x + lx * off, z = p.z + lz * off;
      const vi = (i * nOff + j) * 3;
      verts[vi] = x;
      verts[vi + 1] = terrainHeight(x, z) + yLift;
      verts[vi + 2] = z;
      const ui = (i * nOff + j) * 2;
      uvs[ui] = j / (nOff - 1);
      uvs[ui + 1] = (i / N) * vTiles;
    }
    if (i < N) {
      for (let j = 0; j < nOff - 1; j++) {
        const a = i * nOff + j, b = a + nOff;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* lane markings: a dashed centre line and solid edges, painted as ribbons */
{
  const dashLen = 4.2, gapLen = 5.4, period = dashLen + gapLen;
  const total = PATH.len;
  const count = Math.floor(total / period);
  const dashGeos = [];

  for (let d = 0; d < count; d++) {
    const t0 = (d * period) / total;
    const t1 = (d * period + dashLen) / total;
    const segs = 4;
    const verts = [], idxs = [];
    for (let k = 0; k <= segs; k++) {
      const t = lerp(t0, t1, k / segs);
      const sIdx = Math.floor(t * PATH.N) % PATH.N;
      const p = PATH.samples[sIdx], tg = PATH.tang[sIdx];
      const hw = 0.075;
      verts.push(p.x + tg.z * hw, terrainHeight(p.x, p.z) + 0.045, p.z - tg.x * hw);
      verts.push(p.x - tg.z * hw, terrainHeight(p.x, p.z) + 0.045, p.z + tg.x * hw);
      if (k < segs) {
        const o = k * 2;
        idxs.push(o, o + 2, o + 1, o + 1, o + 2, o + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idxs);
    g.computeVertexNormals();
    dashGeos.push(g);
  }

  /* merge the dashes into one mesh by hand — cheaper than one draw call each */
  let vCount = 0, iCount = 0;
  dashGeos.forEach((g) => { vCount += g.attributes.position.count; iCount += g.index.count; });
  const mPos = new Float32Array(vCount * 3);
  const mIdx = new Uint32Array(iCount);
  let vo = 0, io = 0;
  dashGeos.forEach((g) => {
    mPos.set(g.attributes.position.array, vo * 3);
    const gi = g.index.array;
    for (let k = 0; k < gi.length; k++) mIdx[io + k] = gi[k] + vo;
    vo += g.attributes.position.count;
    io += gi.length;
    g.dispose();
  });
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
  merged.setIndex(new THREE.BufferAttribute(mIdx, 1));
  merged.computeVertexNormals();

  const lines = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({
    color: 0xd8d2c0, roughness: 0.7,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }));
  scene.add(lines);
}

/* ── cypress: a lathed spindle, the signature tree of the Anatolian verge ── */
function makeCypressGeometry() {
  const pts = [];
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    const y = t * 7.6;
    const r = Math.sin(Math.pow(t, 0.58) * Math.PI) * 1.15 * (1 - t * 0.3) + 0.06;
    pts.push(new THREE.Vector2(Math.max(0.05, r), y));
  }
  return new THREE.LatheGeometry(pts, 8);
}

const CYPRESS_GEO = makeCypressGeometry();
const CROWN_GEO = new THREE.IcosahedronGeometry(1.5, 0);
const TRUNK_GEO = new THREE.CylinderGeometry(0.15, 0.22, 1.7, 5);

/* pick tree positions along the lap, well clear of the tarmac */
const treeSlots = [];
for (let i = 0; i < 170; i++) {
  const s = Math.floor((i / 170) * PATH.N);
  const p = PATH.samples[s], tg = PATH.tang[s];
  const side = i % 2 ? 1 : -1;
  const off = side * (HALF_ROAD + rrnd(10, 44));
  const x = p.x + tg.z * off, z = p.z - tg.x * off;

  const G = TRACK.gravel;
  if (Math.hypot(x - G.x, z - G.z) < G.r + 7) continue;
  const R = TRACK.ramp;
  if (Math.abs(x - R.x - 8) < 15 && Math.abs(z - R.z) < 12) continue;
  let clash = false;
  for (const P of TRACK.puddles) if (Math.hypot(x - P.x, z - P.z) < P.r + 5) clash = true;
  if (clash) continue;

  treeSlots.push({ x, z, h: rrnd(0.7, 1.45), cyp: rnd() < 0.6, rot: rrnd(0, TAU) });
}

{
  const cyp = treeSlots.filter((t) => t.cyp);

  cyp.forEach((t, i) => {

}

{

/* ── buildings: Anatolian apartment blocks, windows painted into a texture ─ */
function makeFacadeTex(withWindows) {
  return canvasTex(256, (c, S) => {
    c.fillStyle = '#cdc2ad';
    c.fillRect(0, 0, S, S);
    const gr = c.createLinearGradient(0, 0, 0, S);
    gr.addColorStop(0, 'rgba(150,140,120,0.03)');
    gr.addColorStop(1, 'rgba(80,72,60,0.34)');
    c.fillStyle = gr;
    c.fillRect(0, 0, S, S);
    if (!withWindows) return;
    const cols = 4, rows = 5;
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols; k++) {
        const x = 18 + k * 58, y = 20 + r * 46;
        c.fillStyle = Math.random() < 0.2 ? '#f7dda4' : '#39424e';
        c.fillRect(x, y, 34, 30);
        c.fillStyle = 'rgba(255,255,255,0.13)';
        c.fillRect(x, y, 34, 3);
        c.strokeStyle = 'rgba(45,40,34,0.5)';
        c.lineWidth = 1.6;
        c.strokeRect(x, y, 34, 30);
      }
    }
  });
}
const facadeTex = makeFacadeTex(true);
const blankTex = makeFacadeTex(false);

const texRoof = canvasTex(64, (c, S) => {
  c.fillStyle = '#9b9182';

});

/* ── telegraph poles + sagging wires ─────────────────────────────────────── */
{
  const poleGeo = new THREE.CylinderGeometry(0.12, 0.18, 8.4, 5);
  const armGeo = new THREE.BoxGeometry(2.2, 0.12, 0.12);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x5d4c39, roughness: 0.96 });
  const pts = [];

  for (let i = 0; i < 24; i++) {
    const s = Math.floor((i / 24) * PATH.N);
    const p = PATH.samples[s], tg = PATH.tang[s];
    const side = i % 2 ? 1 : -1;
    const off = side * (HALF_ROAD + 6.8);
    const x = p.x + tg.z * off, z = p.z - tg.x * off;
    const y = terrainHeight(x, z);

    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(x, y + 4.2, z);
    pole.castShadow = true;
    scenery.add(pole);

    const arm = new THREE.Mesh(armGeo, poleMat);
    arm.position.set(x, y + 7.8, z);
    arm.rotation.y = Math.atan2(tg.x, tg.z);
    scenery.add(arm);

    pts.push(new THREE.Vector3(x, y + 7.75, z));
  }

  const wireMat = new THREE.LineBasicMaterial({ color: 0x2c241c, transparent: true, opacity: 0.5 });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (a.distanceTo(b) > 70) continue;
    const seg = [];
    for (let k = 0; k <= 6; k++) {
      const t = k / 6;
      const p = a.clone().lerp(b, t);
      p.y -= Math.sin(t * Math.PI) * 0.9;
      seg.push(p);
    }
    scenery.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(seg), wireMat));
  }
}

{

/* ══════════════════════════════════════════════════════════════════════════
   11.  CAR MODEL  —  1980s Turkish family sedan
   ══════════════════════════════════════════════════════════════════════════
   Model-space convention, used everywhere from here on:

        +Z = forward (nose)      +X = left      +Y = up
        origin = centre of mass, which sits COM_Y above the wheel centres

   Real-world targets:  4.37 m long · 1.65 m wide · 1.39 m tall · 2.46 m
   wheelbase · 1.33 m track · 13-inch steel wheels with chrome hubcaps.

   Nothing here is a texture on a box: the body is an extrusion of the side
   silhouette, the glasshouse is its own set of panes, and every part that
   has to move, open or light up is a separate mesh.
   ══════════════════════════════════════════════════════════════════════════ */
step(48, 'araç modelleniyor…');

const PAINT = 0xe9e3d2;        // ivory — a very common Şahin colour
const BODY_W = 1.52;   // shell width; doors and trim bring the car to 1.65
const HALF_BODY = BODY_W / 2;
/* Heights are measured up from the wheel contact patch, which sits at
   y = -0.555 in model space, so a real-world figure of 1.39 m becomes 0.835. */
const Y_GROUND = -0.555;       // contact patch
const Y_SILL = -0.245;         // bottom of the painted body (0.31 m up)
const Y_FLOOR = Y_SILL;
const Y_BELT = 0.395;          // window sill / belt line  (0.95 m up)
const Y_SCUTTLE = 0.315;       // base of the windscreen    (0.87 m up)
const Y_DECK = 0.365;          // boot lid                  (0.92 m up)
const Y_BONNET = 0.330;        // bonnet                    (0.885 m up)
const Y_ROOF = 0.835;          // roof                      (1.39 m up)
const Z_NOSE = 2.0;
const Z_TAIL = -2.05;
const AXLE_F = CFG.WHEELBASE * 0.5;
const AXLE_R = -CFG.WHEELBASE * 0.5;
const ARCH_R = 0.455;
const BODY_L_HALF = 2.19;

const carRoot = new THREE.Group();
scene.add(carRoot);
const carVisual = new THREE.Group();
carRoot.add(carVisual);

/* ── materials ───────────────────────────────────────────────────────────── */
const matPaint = new THREE.MeshPhysicalMaterial({
  color: PAINT, roughness: 0.30, metalness: 0.05,
  clearcoat: 0.9, clearcoatRoughness: 0.14,
});
const matChrome = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, roughness: 0.13, metalness: 1.0 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0x27313d, roughness: 0.06, metalness: 0.0,
  transparent: true, opacity: 0.62,
  clearcoat: 1.0, clearcoatRoughness: 0.03, side: THREE.DoubleSide,
});
const matRubber = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.95 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x9aa2ac, roughness: 0.42, metalness: 0.9 });
const matInterior = new THREE.MeshStandardMaterial({ color: 0x2b2723, roughness: 0.94 });
const matSeat = new THREE.MeshStandardMaterial({ color: 0x5a4c3d, roughness: 0.96 });
const matBlack = new THREE.MeshStandardMaterial({ color: 0x131519, roughness: 0.78 });
const matSeam = new THREE.MeshBasicMaterial({ color: 0x4a443a });
const matHeadlight = new THREE.MeshPhysicalMaterial({
  color: 0xf2efe4, roughness: 0.05, metalness: 0.10,
  /* a faint self-illumination so the lamp reads as glass even by daylight */
  emissive: 0x6a6250, emissiveIntensity: 0.55, clearcoat: 1.0,
});
const matAmber = new THREE.MeshStandardMaterial({ color: 0xd97a1f, roughness: 0.28 });
const matTail = () => new THREE.MeshPhysicalMaterial({
  color: 0x8e1f16, roughness: 0.18, metalness: 0.0,
  emissive: 0x3a0a04, emissiveIntensity: 0.25, clearcoat: 0.85,
});

/* ── BODY: extrude the side silhouette across the car's width ─────────────── */
const bodyShape = new THREE.Shape();
bodyShape.moveTo(Z_TAIL, Y_SILL);         // rear bottom
bodyShape.lineTo(Z_TAIL, Y_DECK - 0.02);  // vertical rear panel, boot height
bodyShape.lineTo(-1.96, Y_DECK);          // boot lid
bodyShape.lineTo(-1.50, Y_DECK + 0.015);  // base of the rear screen
bodyShape.lineTo(-0.80, Y_ROOF);          // C-pillar  (raked, 131-like)
bodyShape.lineTo(-0.24, Y_ROOF);          // roof
bodyShape.lineTo(0.52, Y_ROOF);           // roof front edge
bodyShape.lineTo(0.94, Y_SCUTTLE);        // windscreen base  (short bonnet)
bodyShape.lineTo(1.56, Y_BONNET);         // bonnet
bodyShape.lineTo(1.94, Y_BONNET);         // bonnet nose
bodyShape.quadraticCurveTo(Z_NOSE, Y_BONNET - 0.012, Z_NOSE, Y_BONNET - 0.085);
bodyShape.lineTo(Z_NOSE, Y_SCUTTLE - 0.10);  // grille panel
bodyShape.lineTo(1.97, Y_SILL);           // front valance
bodyShape.lineTo(Z_TAIL, Y_SILL);
bodyShape.closePath();

/* ── arch cut-outs ─────────────────────────────────────────────────────────
   The silhouette is a closed loop; carving a half-disc out of the bottom
   edge at each axle gives the wheels somewhere to live.  Without this the
   paint runs straight over the tyres and the car looks like it is floating.

   The path is walked from the rear-bottom corner forwards, so the notches
   are inserted in that order.                                              */
const SHAPE_BOTTOM = Y_FLOOR;
const archCut = new THREE.Shape();
archCut.absarc(0, 0, ARCH_R, 0, Math.PI, false);

/* rebuild the silhouette with the two arches subtracted */
const bodyShape2 = new THREE.Shape();
bodyShape2.moveTo(Z_TAIL, SHAPE_BOTTOM);
bodyShape2.lineTo(Z_TAIL, Y_DECK - 0.02);
bodyShape2.lineTo(-1.96, Y_DECK);
bodyShape2.lineTo(-1.50, Y_DECK + 0.015);
bodyShape2.lineTo(-0.80, Y_ROOF);
bodyShape2.lineTo(-0.24, Y_ROOF);
bodyShape2.lineTo(0.52, Y_ROOF);
bodyShape2.lineTo(0.94, Y_SCUTTLE);
bodyShape2.lineTo(1.56, Y_BONNET);
bodyShape2.lineTo(1.94, Y_BONNET);
bodyShape2.quadraticCurveTo(Z_NOSE, Y_BONNET - 0.012, Z_NOSE, Y_BONNET - 0.085);
bodyShape2.lineTo(Z_NOSE, Y_SCUTTLE - 0.10);
bodyShape2.lineTo(1.97, Y_SILL);
/* now run back along the floor, cutting an arch at each axle */
bodyShape2.lineTo(AXLE_F + ARCH_R * 0.92, Y_FLOOR);
bodyShape2.absarc(AXLE_F, Y_FLOOR, ARCH_R * 0.92, 0, Math.PI, true);
bodyShape2.lineTo(AXLE_R + ARCH_R * 0.92, Y_FLOOR);
bodyShape2.absarc(AXLE_R, Y_FLOOR, ARCH_R * 0.92, 0, Math.PI, true);
bodyShape2.lineTo(Z_TAIL, SHAPE_BOTTOM);
bodyShape2.closePath();

const bodyGeo = new THREE.ExtrudeGeometry(bodyShape2, {
  depth: BODY_W - 0.08,
  bevelEnabled: true,
  bevelThickness: 0.026,
  bevelSize: 0.026,
  bevelSegments: 2,
  curveSegments: 8,
});
/* The shape is drawn in XY (longitudinal, vertical) and extruded along +Z.
   rotateY(-90°) maps shape-X → world Z and extrusion → world -X, so after
   the rotation the slab runs from x = -depth to x = 0; centring it on X puts
   the body squarely on the car's axis.  A tiny extra nudge on Z lines the
   extrusion up with the model's own centreline. */
bodyGeo.rotateY(-Math.PI / 2);
bodyGeo.translate((BODY_W - 0.08) / 2, 0, 0);
bodyGeo.computeBoundingBox();
bodyGeo.translate(0, 0, -(bodyGeo.boundingBox.min.z + bodyGeo.boundingBox.max.z) / 2);
bodyGeo.computeVertexNormals();

const bodyMesh = new THREE.Mesh(bodyGeo, matPaint);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
carVisual.add(bodyMesh);

/* ── rocker / lower body: fills the gap between the sill and the wheels ─── */
{
  /* a shallow box tucked just inside the body sides, running the length of
     the wheelbase and reaching down to the top of the wheels */
  const rocker = new THREE.Mesh(
    new THREE.BoxGeometry(BODY_W - 0.36, 0.10, CFG.WHEELBASE - 0.10),
    matPaint
  );
  /* reach down to just above the wheel centre line, the way a rocker box does */
  rocker.position.set(0, Y_FLOOR - 0.035, -0.05);
  rocker.castShadow = true;
  rocker.receiveShadow = true;
  carVisual.add(rocker);

  /* front and rear valance panels below the bumpers */
  [-1, 1].forEach((side) => {
    const v = new THREE.Mesh(
      new THREE.BoxGeometry(BODY_W - 0.14, 0.16, 0.10),
      new THREE.MeshStandardMaterial({ color: 0x232326, roughness: 0.9 })
    );
    v.position.set(0, Y_FLOOR - 0.04, side * (BODY_L_HALF - 0.10));
    carVisual.add(v);
  });

  /* inner arch liners so you cannot see through the wheel wells */
  [AXLE_F, AXLE_R].forEach((az) => {
    [-1, 1].forEach((side) => {
      const liner = new THREE.Mesh(
        new THREE.CylinderGeometry(ARCH_R - 0.015, ARCH_R - 0.015, 0.10, 12, 1, true, 0, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x2b2926, roughness: 0.95, side: THREE.DoubleSide })
      );
      liner.rotation.z = Math.PI / 2;   // cylinder axis along X, radius in YZ
      liner.position.set(side * (BODY_W / 2 - 0.14), Y_FLOOR + 0.02, az);
      carVisual.add(liner);
    });
  });
}

/* ── wheel arch lips: half-tori on the body sides ────────────────────────── */
[AXLE_F, AXLE_R].forEach((az) => {
  [-1, 1].forEach((side) => {
    const lip = new THREE.Mesh(
      new THREE.TorusGeometry(ARCH_R, 0.028, 5, 14, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0xd3cbb8, roughness: 0.5 })
    );
    lip.position.set(side * (HALF_BODY - 0.005), Y_FLOOR + 0.05, az);
    lip.rotation.y = Math.PI / 2;
    lip.castShadow = true;
    carVisual.add(lip);
  });
});

/* ── DOORS: separate meshes sitting proud of the body with real shut lines ─ */
const doorGroups = [];
[-1, 1].forEach((side) => {
  const x = side * (HALF_BODY - 0.012);

  /* The door skin runs from the sill up to the belt line and STOPS there —
     anything taller hides the side glass and the car reads as a slab. */
  const DOOR_H = Y_BELT - Y_SILL;          // 0.64
  const DOOR_Y = Y_SILL + DOOR_H * 0.5;    // 0.075

  /* front door: from the A-pillar to the B-pillar */
  const fDoor = new THREE.Mesh(new THREE.BoxGeometry(0.035, DOOR_H, 1.06), matPaint);
  fDoor.position.set(x, DOOR_Y, 0.06);
  fDoor.castShadow = true;
  carVisual.add(fDoor);
  doorGroups.push(fDoor);

  /* rear door */
  const rDoor = new THREE.Mesh(new THREE.BoxGeometry(0.035, DOOR_H, 0.98), matPaint);
  rDoor.position.set(x, DOOR_Y, -0.94);
  rDoor.castShadow = true;
  carVisual.add(rDoor);
  doorGroups.push(rDoor);

  /* shut lines: thin recessed dark strips at the door edges */
  [0.59, -0.47, -1.44, -1.98].forEach((z) => {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.008, DOOR_H - 0.02, 0.012), matSeam);
    seam.position.set(x + side * 0.019, DOOR_Y, z);
    carVisual.add(seam);
  });

  /* handles: just below the belt line, where a hand actually goes */
  [0.16, -1.14].forEach((z) => {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.036, 0.20), matChrome);
    h.position.set(x + side * 0.024, Y_BELT - 0.075, z);
    carVisual.add(h);
  });

  /* the chrome rubbing strip along the flank, at mid-door height */
  const strip = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.026, 3.50), matChrome);
  strip.position.set(x + side * 0.021, Y_SILL + DOOR_H * 0.42, -0.70);
  carVisual.add(strip);

  /* Sill / rocker: a body-coloured skirt running between the arches.  This
     is what closes the visual gap between the painted shell and the tyres. */
  const sill = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.155, 2.36), matPaint);
  sill.position.set(x + side * 0.004, Y_FLOOR - 0.055, -0.05);
  sill.castShadow = true;
  carVisual.add(sill);

/* ══════════════════════════════════════════════════════════════════════════
   12.  WHEELS + SUSPENSION VISUALS
   ══════════════════════════════════════════════════════════════════════════
   Each corner is a group whose position is written by the suspension every
   frame.  The axle is local X, so a wheel is a cylinder rotated to spin
   about X and the front pair is yawed by the steering angle.
   ══════════════════════════════════════════════════════════════════════════ */
const WHEEL_R = CFG.WHEEL_R;
const WHEEL_W = CFG.WHEEL_W;

function buildWheel() {
  const group = new THREE.Group();     // positioned by the suspension
  const steer = new THREE.Group();     // yawed by the steering
  const spin = new THREE.Group();      // rolled by the wheel speed
  group.add(steer);
  steer.add(spin);

  /* tyre */
  const tyre = new THREE.Mesh(
    new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, WHEEL_W, 24, 1),
    matRubber
  );
  tyre.rotation.z = Math.PI / 2;
  tyre.castShadow = true;
  spin.add(tyre);

  /* sidewall shoulders, so the tread reads as rounded rather than a drum */
  [-1, 1].forEach((s) => {
    const sh = new THREE.Mesh(new THREE.TorusGeometry(WHEEL_R - 0.026, 0.028, 5, 24), matRubber);
    sh.position.x = s * (WHEEL_W / 2 - 0.012);
    sh.rotation.y = Math.PI / 2;
    sh.castShadow = true;
    spin.add(sh);
  });

  /* steel rim */
  const rim = new THREE.Mesh(
    new THREE.CylinderGeometry(WHEEL_R * 0.68, WHEEL_R * 0.68, WHEEL_W * 0.94, 20),
    matSteel
  );
  rim.rotation.z = Math.PI / 2;
  spin.add(rim);

  /* chrome hubcap, dished outward */
  const capPts = [];
  for (let i = 0; i <= 5; i++) {
    const t = i / 5;
    capPts.push(new THREE.Vector2(WHEEL_R * 0.20 + t * WHEEL_R * 0.50, t * 0.030));
  }
  const cap = new THREE.Mesh(new THREE.LatheGeometry(capPts, 20), matChrome);
  cap.rotation.z = -Math.PI / 2;
  cap.position.x = WHEEL_W * 0.42;
  spin.add(cap);

  /* vent slots — these make the rotation legible at speed */
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * TAU;
    const slot = new THREE.Mesh(new THREE.BoxGeometry(0.010, 0.026, 0.055), matBlack);
    slot.position.set(WHEEL_W * 0.44, Math.cos(a) * WHEEL_R * 0.40, Math.sin(a) * WHEEL_R * 0.40);
    slot.rotation.x = -a;
    spin.add(slot);
  }

  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.040, 10, 8), matChrome);
  hub.position.x = WHEEL_W * 0.45;
  hub.scale.x = 0.5;
  spin.add(hub);

  /* brake disc — does not spin with the cap, it sits inboard */
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(WHEEL_R * 0.60, WHEEL_R * 0.60, 0.016, 18),
    new THREE.MeshStandardMaterial({ color: 0x565a60, roughness: 0.65, metalness: 0.6 })
  );
  disc.rotation.z = Math.PI / 2;
  disc.position.x = -WHEEL_W * 0.12;
  spin.add(disc);

  return { group, steer, spin };
}

/* corner order used by the physics: 0 FL, 1 FR, 2 RL, 3 RR
   (+X is the car's left, so FL is +X, and +Z is forward) */
const WHEEL_DEFS = [
  { x: HALF_BODY - 0.075, z: AXLE_F, front: true, side: 1 },
  { x: -(HALF_BODY - 0.075), z: AXLE_F, front: true, side: -1 },
  { x: HALF_BODY - 0.075, z: AXLE_R, front: false, side: 1 },
  { x: -(HALF_BODY - 0.075), z: AXLE_R, front: false, side: -1 },
];

const wheelVisuals = WHEEL_DEFS.map((def) => {
  const w = buildWheel();
  w.def = def;
  carVisual.add(w.group);
  return w;
