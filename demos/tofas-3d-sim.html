/* ── skid marks ─────────────────────────────────────────────────────────── */
const SKID_MAX = 1200;
const skidGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(SKID_MAX * 4 * 3);
  const uv = new Float32Array(SKID_MAX * 4 * 2);
  const idx = new Uint32Array(SKID_MAX * 6);
  for (let i = 0; i < SKID_MAX; i++) {
    const o = i * 4;
    idx[i * 6] = o; idx[i * 6 + 1] = o + 1; idx[i * 6 + 2] = o + 2;
    idx[i * 6 + 3] = o; idx[i * 6 + 4] = o + 2; idx[i * 6 + 5] = o + 3;
  }
  skidGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  skidGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  skidGeo.setIndex(new THREE.BufferAttribute(idx, 1));
  skidGeo.setDrawRange(0, 0);
}
const skidTex = (() => {
  const cv = document.createElement('canvas');
  cv.width = 32; cv.height = 64;
  const c = cv.getContext('2d');
  const gr = c.createLinearGradient(0, 0, 32, 0);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.26, 'rgba(0,0,0,0.85)');
  gr.addColorStop(0.74, 'rgba(0,0,0,0.85)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = gr;
  c.fillRect(0, 0, 32, 64);
  const t = new THREE.CanvasTexture(cv);
  return t;
})();
const skidMesh = new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({
  map: skidTex, transparent: true, opacity: 0.62, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6,
}));
skidMesh.renderOrder = 2;
skidMesh.frustumCulled = false;
scene.add(skidMesh);

let skidHead = 0, skidCount = 0;
const skidPrev = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
const skidHas = [false, false, false, false];

function pushSkid(i, a, b, halfW) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const len = Math.hypot(dx, dz);
  if (len < 0.03) return;
  const nx = (-dz / len) * halfW, nz = (dx / len) * halfW;

  const pos = skidGeo.attributes.position.array;
  const uv = skidGeo.attributes.uv.array;
  const o = skidHead * 12;

  const yA = terrainHeight(a.x, a.z) + 0.03;
  const yB = terrainHeight(b.x, b.z) + 0.03;

  pos[o] = a.x - nx; pos[o + 1] = yA; pos[o + 2] = a.z - nz;
  pos[o + 3] = a.x + nx; pos[o + 4] = yA; pos[o + 5] = a.z + nz;
  pos[o + 6] = b.x + nx; pos[o + 7] = yB; pos[o + 8] = b.z + nz;
  pos[o + 9] = b.x - nx; pos[o + 10] = yB; pos[o + 11] = b.z - nz;

  const u = skidHead * 8;
  uv[u] = 0; uv[u + 1] = 0;
  uv[u + 2] = 1; uv[u + 3] = 0;
  uv[u + 4] = 1; uv[u + 5] = 1;
  uv[u + 6] = 0; uv[u + 7] = 1;

  skidHead = (skidHead + 1) % SKID_MAX;
  skidCount = Math.min(skidCount + 1, SKID_MAX);

  skidGeo.setDrawRange(0, skidCount * 6);
  skidGeo.attributes.position.needsUpdate = true;
  skidGeo.attributes.uv.needsUpdate = true;
}

/* ── particles ──────────────────────────────────────────────────────────── */
const PUFF_MAX = IS_MOBILE ? 160 : 380;
const puffGeo = new THREE.BufferGeometry();
{
  puffGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PUFF_MAX * 3), 3));
  puffGeo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(PUFF_MAX), 1));
  puffGeo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(PUFF_MAX * 3), 3));
  puffGeo.setAttribute('aAlpha', new THREE.BufferAttribute(new Float32Array(PUFF_MAX), 1));
  puffGeo.setDrawRange(0, 0);
}

const puffMat = new THREE.ShaderMaterial({
  uniforms: {
    uMap: { value: texPuff },
    uPix: { value: renderer.getPixelRatio() * window.innerHeight * 0.5 },
  },
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    attribute float aAlpha;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uPix;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uPix / max(-mv.z, 0.5);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uMap;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec4 t = texture2D(uMap, gl_PointCoord);
      float a = t.a * vAlpha;
      if (a < 0.004) discard;
      gl_FragColor = vec4(vColor, a);
      #include <colorspace_fragment>
    }`,
  transparent: true,
  depthWrite: false,
  depthTest: true,
});

const puffPoints = new THREE.Points(puffGeo, puffMat);
puffPoints.frustumCulled = false;
puffPoints.renderOrder = 3;
scene.add(puffPoints);

const puffs = [];
for (let i = 0; i < PUFF_MAX; i++) {
  puffs.push({ on: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, size: 1, r: 1, g: 1, b: 1 });
}
const puffPos = puffGeo.attributes.position.array;
const puffSize = puffGeo.attributes.aSize.array;
const puffCol = puffGeo.attributes.aColor.array;
const puffAlpha = puffGeo.attributes.aAlpha.array;

function spawnPuff(x, y, z, vx, vy, vz, size, life, r, g, b) {
  for (let i = 0; i < PUFF_MAX; i++) {
    const p = puffs[i];
    if (p.on) continue;
    p.on = true;
    p.x = x; p.y = y; p.z = z;
    p.vx = vx; p.vy = vy; p.vz = vz;
    p.life = life; p.max = life;
    p.size = size; p.r = r; p.g = g; p.b = b;
    return;
  }
}

function updatePuffs(dt) {
  let n = 0;
  for (let i = 0; i < PUFF_MAX; i++) {
    const p = puffs[i];
    if (!p.on) continue;

    p.life -= dt;
    if (p.life <= 0) { p.on = false; continue; }

    const k = p.life / p.max;             // 1 → 0
    const age = 1 - k;

    /* smoke rises and slows; dust spreads wider */
    p.vy += (0.55 - p.vy * 1.3) * dt;
    p.vx *= 1 - 1.8 * dt;
    p.vz *= 1 - 1.8 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.z += p.vz * dt;

    puffPos[n * 3] = p.x;
    puffPos[n * 3 + 1] = p.y;
    puffPos[n * 3 + 2] = p.z;
    puffSize[n] = p.size * (1 + age * 2.6);
    puffCol[n * 3] = p.r;
    puffCol[n * 3 + 1] = p.g;
    puffCol[n * 3 + 2] = p.b;
    puffAlpha[n] = Math.min(1, k * 1.8) * 0.62 * (1 - age * 0.35);
    n++;
  }

  puffGeo.setDrawRange(0, n);
  puffGeo.attributes.position.needsUpdate = true;
  puffGeo.attributes.aSize.needsUpdate = true;
  puffGeo.attributes.aColor.needsUpdate = true;
  puffGeo.attributes.aAlpha.needsUpdate = true;
}

/* ── emission, driven by the tyre state the physics produced ─────────────── */
const _ep = new THREE.Vector3();

function emitEffects(dt) {
  const tailBrake = V.brake > 0.08 || V.handbrake > 0.1;
  for (let i = 0; i < taillights.length; i++) {
    const m = taillights[i].material;
    m.emissive.setHex(tailBrake ? 0xff2208 : 0x3a0a04);
    m.emissiveIntensity = tailBrake ? 2.4 : 0.25;
  }

  for (let i = 0; i < 4; i++) {
    const w = wheels[i];

    /* contact patch in world space */
    _ep.copy(w.hard).applyQuaternion(V.quat).add(V.pos);

    const sliding = w.grounded && w.skid > 0.16 && V.speed > 1.5;

    if (sliding) {
      const sx = _ep.x + (w.def.side * 0.06);
      const sz = _ep.z;

      if (skidHas[i]) pushSkid(i, skidPrev[i], new THREE.Vector3(sx, 0, sz), 0.10 + w.skid * 0.045);
      skidPrev[i].set(sx, 0, sz);
      skidHas[i] = true;

      const surf = surfProps(w.surface);
      const isDust = surf.dust > 0.4;
      const rate = w.skid * (isDust ? surf.dust : surf.smoke) * (IS_MOBILE ? 34 : 70);

      if (Math.random() < rate * dt) {
        const gy = terrainHeight(sx, sz) + 0.12;
        const spread = isDust ? 1.5 : 0.8;
        spawnPuff(
          sx + rrnd(-0.1, 0.1), gy, sz + rrnd(-0.1, 0.1),
          V.vel.x * 0.14 + rrnd(-spread, spread),
          rrnd(0.4, 1.2),
          V.vel.z * 0.14 + rrnd(-spread, spread),
          rrnd(0.5, 1.1),
          rrnd(0.7, 1.6),
          isDust ? 0.60 : 0.82, isDust ? 0.55 : 0.83, isDust ? 0.44 : 0.86
        );
      }
    } else {
      skidHas[i] = false;
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   24.  AUDIO — everything synthesised with Web Audio
   ══════════════════════════════════════════════════════════════════════════ */
step(76, 'ses sentezleniyor…');

const AUDIO = { ready: false, ctx: null };

function initAudio() {
  if (AUDIO.ready) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  const ctx = new AC();
  AUDIO.ctx = ctx;

  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);

  /* ── engine: two detuned saws + a sub square through a resonant lowpass ── */
  const engineBus = ctx.createGain();
  engineBus.gain.value = 0;

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 700;
  lp.Q.value = 4.5;
  engineBus.connect(lp);
  lp.connect(master);

  const mkOsc = (type, gainValue, detuneCents) => {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = 55;
    o.detune.value = detuneCents;
    const g = ctx.createGain();
    g.gain.value = gainValue;
    o.connect(g);
    g.connect(engineBus);
    o.start();
    return o;
  };
  const oscA = mkOsc('sawtooth', 0.44, 0);
  const oscB = mkOsc('sawtooth', 0.30, 11);
  const oscSub = mkOsc('square', 0.26, -1207);
  const oscHarm = mkOsc('triangle', 0.16, 0);

  /* ── noise source shared by squeal and wind ───────────────────────────── */
  const bufLen = ctx.sampleRate * 2;
  const noiseBuf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;

  /* tyre squeal */
  const sq = ctx.createBufferSource();
  sq.buffer = noiseBuf;
  sq.loop = true;
  const sqBP = ctx.createBiquadFilter();
  sqBP.type = 'bandpass';
  sqBP.frequency.value = 2200;
  sqBP.Q.value = 14;
  const sqGain = ctx.createGain();
  sqGain.gain.value = 0;
  sq.connect(sqBP);
  sqBP.connect(sqGain);
  sqGain.connect(master);
  sq.start();

  /* wind */
  const wnd = ctx.createBufferSource();
  wnd.buffer = noiseBuf;
  wnd.loop = true;
  const wndLP = ctx.createBiquadFilter();
  wndLP.type = 'lowpass';
  wndLP.frequency.value = 480;
  const wndGain = ctx.createGain();
  wndGain.gain.value = 0;
  wnd.connect(wndLP);
  wndLP.connect(wndGain);
  wndGain.connect(master);
  wnd.start();

  /* gravel rumble — a second band of noise, gated by surface */
  const gr = ctx.createBufferSource();
  gr.buffer = noiseBuf;
  gr.loop = true;
  const grBP = ctx.createBiquadFilter();
  grBP.type = 'bandpass';
  grBP.frequency.value = 320;
  grBP.Q.value = 2.2;
  const grGain = ctx.createGain();
  grGain.gain.value = 0;
  gr.connect(grBP);
  grBP.connect(grGain);
  grGain.connect(master);
  gr.start();

  Object.assign(AUDIO, {
    ready: true, master, engineBus, lp, oscA, oscB, oscSub, oscHarm,
    sqBP, sqGain, wndLP, wndGain, grGain,
  });

  master.gain.setTargetAtTime(0.6, ctx.currentTime, 0.8);
}

function updateAudio() {
  if (!AUDIO.ready) return;
  const t = AUDIO.ctx.currentTime;
  const r = V.rpm;

  /* four-cylinder firing frequency, in Hz */
  const f0 = (r / 60) * 2;
  AUDIO.oscA.frequency.setTargetAtTime(f0, t, 0.03);
  AUDIO.oscB.frequency.setTargetAtTime(f0 * 2.005, t, 0.03);
  AUDIO.oscSub.frequency.setTargetAtTime(f0 * 0.5, t, 0.03);
  AUDIO.oscHarm.frequency.setTargetAtTime(f0 * 3.0, t, 0.03);

  const load = clamp(V.throttle * 0.7 + r / CFG.LIMITER_RPM * 0.5, 0, 1);
  AUDIO.engineBus.gain.setTargetAtTime(0.035 + load * 0.075, t, 0.05);
  AUDIO.lp.frequency.setTargetAtTime(380 + load * 2100, t, 0.06);

  /* squeal follows the tyre slip the physics computed */
  const squeal = clamp(V.slipAvg * 1.6 + V.latSlipAvg * 0.5 - 0.22, 0, 1);
  AUDIO.sqGain.gain.setTargetAtTime(squeal * 0.13, t, 0.06);
  AUDIO.sqBP.frequency.setTargetAtTime(1900 + squeal * 1700, t, 0.08);

  /* wind rises with the square of speed */
  const w = clamp(V.speed / 46, 0, 1);
  AUDIO.wndGain.gain.setTargetAtTime(w * w * 0.085, t, 0.15);

  /* gravel rumble only when a wheel is actually on it */
  let onGravel = 0;
  for (let i = 0; i < 4; i++) if (wheels[i].grounded && wheels[i].surface === 'gravel') onGravel++;
  AUDIO.grGain.gain.setTargetAtTime(onGravel * 0.02 * clamp(V.speed / 12, 0, 1), t, 0.08);
}

const resumeAudio = () => {
  initAudio();
  if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
};
window.addEventListener('pointerdown', resumeAudio);
window.addEventListener('keydown', resumeAudio);

/* ══════════════════════════════════════════════════════════════════════════
   25.  HUD
   ══════════════════════════════════════════════════════════════════════════ */
step(82, 'gösterge paneli…');

const H = {
  spdNum: $('spdNum'),
  gearNum: $('gearNum'),
  rpmMini: $('rpmMini'),
  spdArc: $('spdArc'),
  rpmArc: $('rpmArc'),
  ticks: $('ticks'),
  shift: $('shift'),
  debug: $('debug'),
};

const PW = {
  power: $('pwPower'), torque: $('pwTorque'), force: $('pwForce'),
  grip: $('pwGrip'), tc: $('pwTc'),
  powerBar: $('pwPowerBar'), torqueBar: $('pwTorqueBar'), forceBar: $('pwForceBar'),
};

const CHIP = {
  auto: $('chipAuto'),
  abs: $('chipAbs'),
  light: $('chipLight'),
};

const ARC_START = Math.PI * 0.75;
const ARC_SWEEP = Math.PI * 1.5;

function arcD(cx, cy, radius, t0, t1) {
  const a0 = ARC_START + t0 * ARC_SWEEP;
  const a1 = ARC_START + t1 * ARC_SWEEP;
  const large = (a1 - a0) > Math.PI ? 1 : 0;
  const x0 = cx + Math.cos(a0) * radius;
  const y0 = cy + Math.sin(a0) * radius;
  const x1 = cx + Math.cos(a1) * radius;
  const y1 = cy + Math.sin(a1) * radius;
  return 'M ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
         ' A ' + radius + ' ' + radius + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
}

/* dial ticks, drawn once */
(function buildDial() {
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 90, cy = 90;
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    const a = ARC_START + t * ARC_SWEEP;
    const major = i % 6 === 0;
    const r0 = major ? 61 : 65;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (cx + Math.cos(a) * r0).toFixed(2));
    l.setAttribute('y1', (cy + Math.sin(a) * r0).toFixed(2));
    l.setAttribute('x2', (cx + Math.cos(a) * 71).toFixed(2));
    l.setAttribute('y2', (cy + Math.sin(a) * 71).toFixed(2));
    l.setAttribute('stroke', t > 0.84 ? '#e8563c' : major ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.22)');
    l.setAttribute('stroke-width', major ? '1.8' : '1');
    l.setAttribute('stroke-linecap', 'round');
    H.ticks.appendChild(l);
  }
  for (let i = 0; i <= 4; i++) {
    const a = ARC_START + (i / 4) * ARC_SWEEP;
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', (cx + Math.cos(a) * 48).toFixed(2));
    txt.setAttribute('y', (cy + Math.sin(a) * 48 + 3).toFixed(2));
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '7.5');
    txt.setAttribute('font-family', 'ui-monospace,monospace');
    txt.setAttribute('fill', 'rgba(255,255,255,0.3)');
    txt.textContent = String(i * 50);
    H.ticks.appendChild(txt);
  }
})();

let lastGearShown = null;
let absFlash = 0;

function updateHUD(dt) {
  const kmh = V.speed * 3.6;
  const sT = clamp(kmh / 200, 0, 1);
  H.spdNum.textContent = Math.round(kmh);
  H.spdArc.setAttribute('d', sT > 0.003 ? arcD(90, 90, 66, 0, sT) : '');

  const rT = clamp((V.rpm - CFG.IDLE_RPM) / (CFG.LIMITER_RPM - CFG.IDLE_RPM), 0, 1);
  H.rpmArc.setAttribute('d', rT > 0.003 ? arcD(90, 90, 75, 0, rT) : '');
  H.rpmMini.textContent = Math.round(V.rpm);

  /* ── powertrain strip ───────────────────────────────────────────────────
     Bars are scaled to the engine's own peaks, so a full bar means the engine
     is actually making its advertised number rather than an arbitrary one. */
  const hpNow = V.powerHp;
  const tqNow = V.torqueAtWheels;
  const fNow = Math.abs(V.driveForce);
  PW.power.textContent = Math.round(hpNow);
  PW.torque.textContent = Math.round(tqNow);
  PW.force.textContent = Math.round(fNow);
  PW.grip.textContent = Math.round(V.gripUsed * 100) + '%';
  PW.powerBar.style.width = clamp(hpNow / (CFG.PEAK_POWER_KW * 1.34102), 0, 1) * 100 + '%';
  PW.torqueBar.style.width = clamp(tqNow / CFG.PEAK_TORQUE, 0, 1) * 100 + '%';
  PW.forceBar.style.width = clamp(fNow / 4200, 0, 1) * 100 + '%';
  PW.tc.classList.toggle('on', V.tcIntervention > 0.12);

  const g = V.gear === -1 ? 'R' : String(V.gear);
  H.gearNum.textContent = g;
  H.gearNum.setAttribute('fill', V.gear === -1 ? '#5ac8e8' : '#e8c05a');

  if (g !== lastGearShown) {
    lastGearShown = g;
    H.shift.textContent = g;
    H.shift.classList.remove('pop');
    void H.shift.offsetWidth;
    H.shift.classList.add('pop');
  }

  /* the ABS chip pulses while the system is intervening */
  if (V.absActive) { absFlash = 0.35; V.absActive = false; }
  absFlash = Math.max(0, absFlash - dt);
  CHIP.abs.classList.toggle('on', V.abs);
  CHIP.abs.style.background = absFlash > 0 ? '#ff7a3c' : '';
  CHIP.abs.style.borderColor = absFlash > 0 ? '#ff7a3c' : '';
}

/* ══════════════════════════════════════════════════════════════════════════
   26.  MINIMAP
   ══════════════════════════════════════════════════════════════════════════ */
const mapCanvas = $('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');
const MAP_SIZE = mapCanvas.width;

const mapBounds = (() => {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  PATH.samples.forEach((p) => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.z < minZ) minZ = p.z;
    if (p.z > maxZ) maxZ = p.z;
  });
  const pad = MAP_SIZE * 0.09;
  const w = Math.max(maxX - minX, maxZ - minZ);
  const s = (MAP_SIZE - pad * 2) / w;
  return {
    minX, minZ, s,
    ox: (MAP_SIZE - (maxX - minX) * s) / 2,
    oz: (MAP_SIZE - (maxZ - minZ) * s) / 2,
  };
})();

const mapPx = (x, z) => [
  mapBounds.ox + (x - mapBounds.minX) * mapBounds.s,
  mapBounds.oz + (z - mapBounds.minZ) * mapBounds.s,
];

const mapBg = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = MAP_SIZE;
  const c = cv.getContext('2d');

  c.lineJoin = 'round';
  c.lineCap = 'round';

  /* the loop */
  c.beginPath();
  PATH.samples.forEach((p, i) => {
    const [x, y] = mapPx(p.x, p.z);
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  });
  c.closePath();
  c.strokeStyle = 'rgba(255,255,255,0.10)';
  c.lineWidth = 11;
  c.stroke();
  c.strokeStyle = 'rgba(232,192,90,0.62)';
  c.lineWidth = 3.4;
  c.stroke();

  /* gravel pad */
  const [gx, gy] = mapPx(TRACK.gravel.x, TRACK.gravel.z);
  c.fillStyle = 'rgba(156,138,102,0.26)';
  c.beginPath();
  c.arc(gx, gy, TRACK.gravel.r * mapBounds.s, 0, TAU);
  c.fill();

  /* start line */
  const [sx, sy] = mapPx(PATH.samples[0].x, PATH.samples[0].z);
  c.fillStyle = '#f4e8ca';
  c.beginPath();
  c.arc(sx, sy, 3.6, 0, TAU);
  c.fill();

  return cv;
})();

function drawMinimap() {
  mapCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
  mapCtx.drawImage(mapBg, 0, 0);

  const [cx, cy] = mapPx(V.pos.x, V.pos.z);

  /* heading, taken straight from the model's forward axis */
  const fx = 2 * (V.quat.x * V.quat.z + V.quat.w * V.quat.y);
  const fz = 1 - 2 * (V.quat.x * V.quat.x + V.quat.y * V.quat.y);
  const heading = Math.atan2(fx, fz);

  mapCtx.save();
  mapCtx.translate(cx, cy);
  mapCtx.rotate(-heading + Math.PI);
  mapCtx.fillStyle = '#ff5a3c';
  mapCtx.strokeStyle = 'rgba(255,255,255,0.75)';
  mapCtx.lineWidth = 1.1;
  mapCtx.beginPath();
  mapCtx.moveTo(0, -8);
  mapCtx.lineTo(5.2, 5.5);
  mapCtx.lineTo(0, 2.6);
  mapCtx.lineTo(-5.2, 5.5);
  mapCtx.closePath();
  mapCtx.fill();
  mapCtx.stroke();
  mapCtx.restore();
}

/* ══════════════════════════════════════════════════════════════════════════
   27.  DEBUG OVERLAY  (F1)
   ══════════════════════════════════════════════════════════════════════════ */
const NAMES = ['ÖN-SOL', 'ÖN-SAĞ', 'ARK-SOL', 'ARK-SAĞ'];
let dbgAcc = 0;

function updateDebug(dt) {
  if (!H.debug.classList.contains('on')) return;
  dbgAcc += dt;
  if (dbgAcc < 0.1) return;
  dbgAcc = 0;

  let s = '<h4>motor / şanzıman</h4>';
  s += '<div class="row"><span>devir</span><span>' + Math.round(V.rpm) + ' rpm</span></div>';
  s += '<div class="row"><span>tork</span><span>' + V.engineTorque.toFixed(1) + ' Nm</span></div>';
  s += '<div class="row"><span>vites</span><span>' + (V.gear === -1 ? 'R' : V.gear) + ' · ' + (V.gearboxAuto ? 'oto' : 'man') + '</span></div>';
  s += '<div class="row"><span>hız</span><span>' + (V.speed * 3.6).toFixed(1) + ' km/h</span></div>';
  s += '<div class="row"><span>gaz / fren</span><span>' + (V.throttle * 100 | 0) + '% / ' + (V.brake * 100 | 0) + '%</span></div>';
  s += '<div class="row"><span>direksiyon</span><span>' + (V.steer * 57.3).toFixed(1) + '°</span></div>';
  s += '<div class="row"><span>debriyaj</span><span>' + (V.clutch * 100 | 0) + '%</span></div>';

  s += '<h4>tekerlekler</h4>';
  for (let i = 0; i < 4; i++) {
    const w = wheels[i];
    const bar = clamp(w.travel, 0, 1) * 100;
    const col = w.grounded ? '#4d9de0' : '#4a4550';
    s += '<div class="w"><em>' + NAMES[i] + '</em>' +
         '<i style="width:' + bar.toFixed(0) + '%;background:' + col + '"></i>' +
         '<span>' + (w.load / 1000).toFixed(2) + 'kN</span></div>';
    s += '<div class="row"><span style="font-size:7.5px;color:#5c6675;padding-left:30px">slip</span>' +
         '<span style="font-size:7.5px">' + w.slipLong.toFixed(2) + ' / ' + w.slipLat.toFixed(2) + ' · ' + w.surface + '</span></div>';
  }

  s += '<h4>gövde</h4>';
  s += '<div class="row"><span>toplam yük</span><span>' + (V.loadTotal / 1000).toFixed(2) + ' kN</span></div>';
  s += '<div class="row"><span>temas</span><span>' + V.grounded + ' / 4</span></div>';
  s += '<div class="row"><span>slip ort.</span><span>' + V.slipAvg.toFixed(2) + '</span></div>';
  s += '<div class="row"><span>havada</span><span>' + V.airTime.toFixed(2) + ' s</span></div>';
  s += '<div class="row"><span>fps</span><span>' + fpsAvg.toFixed(0) + '</span></div>';

  H.debug.innerHTML = s;
}

/* ══════════════════════════════════════════════════════════════════════════
   28.  MAIN LOOP
   ══════════════════════════════════════════════════════════════════════════ */
step(90, 'son rötuşlar…');

const camLabel = document.createElement('div');
camLabel.id = 'camLabel';
camLabel.className = '';
camLabel.textContent = CAM.names[0];
document.body.appendChild(camLabel);
let camLabelTimer = 0;

resetVehicle(startPose());
syncCarMesh();
flashChips();

let accTime = 0;
let lastTime = 0;
let fpsAcc = 0, fpsCount = 0, fpsAvg = 60;
let frames = 0;

function loop(now) {
  requestAnimationFrame(loop);

  const t = now * 0.001;
  let dt = t - lastTime;
  lastTime = t;
  if (!(dt > 0) || !isFinite(dt)) dt = 1 / 60;
  dt = Math.min(dt, 0.1);

  fpsAcc += dt;
  fpsCount++;
  if (fpsAcc >= 0.25) { fpsAvg = fpsCount / fpsAcc; fpsAcc = 0; fpsCount = 0; }

  readInput();
  updateTouchFeedback();

  /* fixed-step physics so the suspension is stable on any frame rate */
  accTime += dt;
  let n = 0;
  while (accTime >= CFG.FIXED_DT && n < CFG.MAX_SUBSTEPS) {
    physicsStep(CFG.FIXED_DT);
    accTime -= CFG.FIXED_DT;
    n++;
  }
  if (n >= CFG.MAX_SUBSTEPS) accTime = 0;

  syncCarMesh();
  updateCamera(dt);
  emitEffects(dt);
  updatePuffs(dt);
  updateAudio();
  updateHUD(dt);
  drawMinimap();
  updateDebug(dt);

  renderer.render(scene, camera);

  frames++;
  if (frames === 4) {
    UI.load.classList.add('gone');
    $('hud').classList.add('on');
    window.__ready = true;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   29.  RESIZE
   ══════════════════════════════════════════════════════════════════════════ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_DPR));
  renderer.setSize(w, h);
  puffMat.uniforms.uPix.value = renderer.getPixelRatio() * h * 0.5;
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

step(100, 'hazır');
requestAnimationFrame(loop);

} /* boot() */

</script>
