<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Şahin — 3D Sürüş Simülatörü</title>
<style>
  :root{
    --ink:#eef2f7; --dim:#8b95a5; --warm:#e8c05a; --hot:#ff5a3c;
    --panel:rgba(10,14,20,.62); --edge:rgba(255,255,255,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#070a0e;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--ink);overscroll-behavior:none;touch-action:none}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #app canvas{position:fixed;inset:0;width:100%!important;height:100%!important}

  /* ══════════ loader ══════════ */
  #load{position:fixed;inset:0;z-index:60;display:grid;place-content:center;gap:16px;
    background:radial-gradient(ellipse at 50% 38%,#16202e,#070a0e 72%);text-align:center;
    transition:opacity .6s ease,visibility .6s;padding:24px}
  #load.gone{opacity:0;visibility:hidden}
  #load h1{font:700 32px/1 ui-monospace,monospace;letter-spacing:.2em;color:#f3e6c8}
  #load h1 small{display:block;margin-top:9px;font:500 9px/1 ui-monospace,monospace;
    letter-spacing:.4em;color:#6f7b8c}
  #bar{width:220px;height:2px;background:#1d2531;margin:4px auto 0;overflow:hidden;border-radius:2px}
  #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#c99b3d,#f0d68a);
    transition:width .3s ease}
  #msg{font-size:9px;letter-spacing:.18em;color:#5d6878;text-transform:uppercase;
    min-height:14px;max-width:80vw;margin:0 auto}
  #msg.err{color:#ff7a5c;letter-spacing:.03em;text-transform:none;line-height:1.5}

  /* ══════════ HUD ══════════ */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
    transition:opacity .7s .2s}
  #hud.on{opacity:1}

  #cluster{position:absolute;right:max(12px,env(safe-area-inset-right));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + 146px);
    width:150px;height:150px}
  #cluster svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .dial-bg{fill:rgba(8,11,16,.7);stroke:rgba(255,255,255,.09);stroke-width:1}
  #spdArc,#rpmArc{fill:none;stroke-linecap:round}
  #spdArc{stroke-width:5}
  #rpmArc{stroke-width:3.2;opacity:.92}
  #spdNum{font:700 38px/1 ui-monospace,monospace;fill:#f4f7fb;letter-spacing:-.03em}
  #spdUnit{font:600 8px/1 ui-monospace,monospace;fill:#79849a;letter-spacing:.24em}
  #gearNum{font:700 16px/1 ui-monospace,monospace;fill:#e8c05a}
  #gearLbl{font:600 6px/1 ui-monospace,monospace;fill:#66707f;letter-spacing:.2em}
  #rpmMini{font:600 8px/1 ui-monospace,monospace;fill:#8b95a5;letter-spacing:.08em}

  #minimap{position:absolute;left:max(14px,env(safe-area-inset-left));
    top:max(14px,env(safe-area-inset-top));width:128px;height:128px;border-radius:10px;
    overflow:hidden;background:rgba(8,11,16,.6);border:1px solid var(--edge);
    backdrop-filter:blur(6px)}
  #mapCanvas{display:block;width:100%;height:100%}

  #chips{position:absolute;left:max(14px,env(safe-area-inset-left));
    top:calc(max(14px,env(safe-area-inset-top)) + 136px);
    display:flex;flex-direction:column;gap:4px;font-size:8px;letter-spacing:.12em}
  .chip{display:flex;align-items:center;gap:5px;padding:2.5px 7px;border-radius:20px;
    background:var(--panel);border:1px solid var(--edge);color:#7d8898;
    text-transform:uppercase;transition:all .18s}
  .chip b{color:#c3ccd8;font-weight:600}
  .chip.on{color:#0b0e13;background:#e8c05a;border-color:#e8c05a}
  .chip.on b{color:#0b0e13}

  #shift{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%) scale(.7);
    font:700 50px/1 ui-monospace,monospace;color:#fff;opacity:0;
    text-shadow:0 0 26px rgba(232,192,90,.65);pointer-events:none}
  #shift.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
  }

  /* ══════════ touch ══════════ */
  #touch{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;
    transition:opacity .4s}
  #touch.on{opacity:1}
  .pad{position:absolute;pointer-events:auto;display:grid;place-items:center;
    border-radius:50%;background:rgba(12,17,24,.46);border:1.5px solid rgba(255,255,255,.12);
    backdrop-filter:blur(4px);user-select:none;
    transition:background .1s,border-color .1s,transform .1s}
  .pad.hit{background:rgba(232,192,90,.3);border-color:rgba(232,192,90,.8);transform:scale(.95)}
  .pad svg{width:46%;height:46%;fill:none;stroke:rgba(240,246,252,.7);
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  /* ══════════════ touch controls: CarX-style layout ══════════════
     Every control is its own layer: a brushed-glass disc with a hairline
     bevel, a soft drop shadow and a coloured rim that lights up when it is
     actually pressed.  The steering read-out between the paddles turns as you
     steer, so you can see the lock angle rather than guessing at it.        */

  /* ── steering paddles + live gauge ─────────────────────────────────── */
  #steerWrap{position:absolute;
    left:max(14px,env(safe-area-inset-left));
    bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px}

  .spad{width:74px;height:74px;border-radius:20px;
    display:grid;place-items:center;pointer-events:auto;
    background:linear-gradient(155deg,rgba(46,54,66,.72),rgba(14,18,24,.82));
    border:1px solid rgba(150,170,195,.22);
    box-shadow:0 6px 18px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.10),
               inset 0 -2px 6px rgba(0,0,0,.5);
    backdrop-filter:blur(10px) saturate(1.2);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);
    user-select:none;transition:transform .08s,border-color .12s,background .12s}
  .spad svg{width:44%;height:44%;fill:none;stroke:rgba(226,238,250,.86);
    stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .spad.hit{transform:scale(.94);
    background:linear-gradient(155deg,rgba(232,192,90,.34),rgba(120,92,26,.5));
    border-color:rgba(232,192,90,.85);
    box-shadow:0 0 22px rgba(232,192,90,.34),inset 0 1px 0 rgba(255,235,190,.3)}

  #steerGauge{width:60px;height:60px;flex:0 0 auto;opacity:.9}
  #steerGauge svg{width:100%;height:100%;overflow:visible}
  .sg-track{fill:rgba(10,14,20,.5);stroke:rgba(150,170,195,.2);stroke-width:2}
  .sg-arc{fill:none;stroke:#e8c05a;stroke-width:3.4;stroke-linecap:round;
    filter:drop-shadow(0 0 5px rgba(232,192,90,.65))}
  .sg-needle{stroke:#f2f6fb;stroke-width:2;stroke-linecap:round;
    transform-box:fill-box;transform-origin:center;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}

  /* ── pedals ───────────────────────────────────────────────────────── */
  #pedalWrap{position:absolute;right:max(14px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;align-items:center}

  .pedal{position:relative;width:88px;height:60px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    overflow:hidden;pointer-events:auto;user-select:none;
    background:linear-gradient(155deg,rgba(44,52,64,.74),rgba(12,16,22,.86));
    border:1px solid rgba(150,170,195,.22);
    box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.09);
    backdrop-filter:blur(10px) saturate(1.2);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);
    transition:transform .08s,box-shadow .12s}
  .pedal svg{width:20px;height:20px;fill:none;stroke:rgba(226,238,250,.85);
    stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .pedal-lbl{font:700 8.5px/1 ui-monospace,monospace;letter-spacing:.14em;
    color:rgba(200,214,232,.8)}
  /* a fill bar that rises from the bottom as the pedal is pressed */
  .pedal-fill{position:absolute;left:0;right:0;bottom:0;height:0%;display:block;
    background:linear-gradient(0deg,rgba(232,192,90,.42),rgba(232,192,90,.06));
    transition:height .07s linear;pointer-events:none}

  #padGas.hit{transform:scale(.97);
    box-shadow:0 0 24px rgba(232,192,90,.4),inset 0 1px 0 rgba(255,235,190,.25);
    border-color:rgba(232,192,90,.75)}
  #padBrake.hit{transform:scale(.97);
    box-shadow:0 0 24px rgba(255,90,60,.4),inset 0 1px 0 rgba(255,190,180,.25);
    border-color:rgba(255,90,60,.75)}
  #padBrake .pedal-fill{background:linear-gradient(0deg,rgba(255,90,60,.42),rgba(255,90,60,.06))}
  #padBrake.hit .pedal-fill{background:linear-gradient(0deg,rgba(255,90,60,.5),rgba(255,90,60,.1))}

  /* ── handbrake: a wide bar level with the top pedal ────────────────── */
  .chip-btn{position:absolute;
    right:calc(max(14px,env(safe-area-inset-right)) + 100px);
    bottom:calc(max(16px,env(safe-area-inset-bottom)) + 34px);
    display:flex;align-items:center;gap:6px;padding:0 12px;height:42px;
    border-radius:12px;pointer-events:auto;user-select:none;
    background:linear-gradient(155deg,rgba(44,52,64,.74),rgba(12,16,22,.86));
    border:1px solid rgba(150,170,195,.22);
    box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.09);
    backdrop-filter:blur(10px) saturate(1.2);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);
    font:700 8px/1 ui-monospace,monospace;letter-spacing:.12em;
    color:rgba(200,214,232,.85);transition:transform .08s,box-shadow .12s}
  .chip-btn svg{width:15px;height:15px;fill:none;stroke:rgba(226,238,250,.85);
    stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .chip-btn.hit{transform:scale(.95);
    box-shadow:0 0 22px rgba(255,90,60,.45);border-color:rgba(255,90,60,.8);
    color:#ffd0c4}

  /* ── utility keys ─────────────────────────────────────────────────── */
  #utilWrap{position:absolute;right:max(14px,env(safe-area-inset-right));
    top:calc(max(14px,env(safe-area-inset-top)) + 4px);
    display:flex;gap:8px}
  .util{width:44px;height:44px;border-radius:13px;pointer-events:auto;
    display:grid;place-items:center;user-select:none;
    background:linear-gradient(155deg,rgba(44,52,64,.7),rgba(12,16,22,.84));
    border:1px solid rgba(150,170,195,.2);
    box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(8px);
    transition:transform .08s,border-color .12s}
  .util svg{width:50%;height:50%;fill:none;stroke:rgba(214,226,242,.82);
    stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .util.hit{transform:scale(.92);border-color:rgba(232,192,90,.8)}

  /* ══════════ debug ══════════ */
  #debug{position:fixed;left:max(14px,env(safe-area-inset-left));
    bottom:max(14px,env(safe-area-inset-bottom));z-index:25;
    padding:10px 12px;border-radius:9px;background:rgba(6,9,13,.87);
    border:1px solid var(--edge);font-size:9.5px;line-height:1.55;
    letter-spacing:.01em;color:#9aa5b5;display:none;min-width:236px;
    backdrop-filter:blur(8px);pointer-events:none}
  #debug.on{display:block}
  #debug h4{font-size:7.5px;letter-spacing:.2em;color:#5c6675;text-transform:uppercase;
    margin:0 0 5px;font-weight:600}
  #debug h4:not(:first-child){margin-top:8px}
  #debug .row{display:flex;justify-content:space-between;gap:10px}
  #debug .row span:last-child{color:#dfe6ef;font-variant-numeric:tabular-nums}
  #debug .w{display:grid;grid-template-columns:26px 1fr 56px;gap:5px;align-items:center;
    margin-bottom:2px}
  #debug .w em{font-style:normal;color:#6f7a8a;font-size:8px}
  #debug .w i{height:3px;background:#4d9de0;display:block;border-radius:2px;width:0%}
  #debug .w span{color:#dfe6ef;font-variant-numeric:tabular-nums;font-size:8.5px;text-align:right}

  /* ══════════ help ══════════ */
  #help{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:22;padding:6px 14px;border-radius:20px;
    background:var(--panel);border:1px solid var(--edge);font-size:8.5px;
    letter-spacing:.07em;color:#7b8697;white-space:nowrap;backdrop-filter:blur(6px);
    transition:opacity .6s;pointer-events:none;text-transform:uppercase}
  #help.dim{opacity:0}
  #help b{color:#b9c3d0;font-weight:600}
  @media (max-width:820px){ #help{display:none} }
  @media (max-height:540px){
    #cluster{width:112px;height:112px;
      bottom:calc(max(10px,env(safe-area-inset-bottom)) + 122px)}
    #minimap{width:84px;height:84px}
    .spad{width:64px;height:64px}
    #steerGauge{width:50px;height:50px}
    .pedal{width:76px;height:52px}
    .chip-btn{height:38px;padding:0 10px}
  }
  /* short landscape phones: keep the gauges small and the pads out of them */
  @media (max-height:420px){
    #cluster{width:96px;height:96px;bottom:auto;
      top:calc(max(8px,env(safe-area-inset-top)) + 40px)}
    .spad{width:58px;height:58px}
    .pedal{width:68px;height:46px}
    #steerGauge{display:none}
  }
  /* portrait phones: gauges at the top-right, clear of everything */
  @media (max-width:560px) and (orientation:portrait){
    #cluster{width:126px;height:126px;top:calc(max(12px,env(safe-area-inset-top)) + 52px);
      bottom:auto}
    #minimap{width:96px;height:96px}
  }
  #camLabel{position:fixed;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 44px));
    transform:translateX(-50%);z-index:24;font:600 9px/1 ui-monospace,monospace;
    letter-spacing:.28em;color:#c9a24a;opacity:0;transition:opacity .3s;
    text-transform:uppercase;pointer-events:none}
  #camLabel.show{opacity:1}
</style>
</head>
<body>

<div id="app"></div>

<div id="load">
  <h1>ŞAHİN<small>3D DRIVING SIMULATOR</small></h1>
  <div id="bar"><i></i></div>
  <div id="msg">yükleniyor…</div>
</div>

<div id="hud">
  <div id="minimap"><canvas id="mapCanvas" width="256" height="256"></canvas></div>

  <div id="chips">
    <div class="chip on" id="chipAuto"><b>OTO</b><span>vites</span></div>
    <div class="chip" id="chipAbs"><b>ABS</b><span>kapalı</span></div>
    <div class="chip" id="chipLight"><b>FAR</b><span>kapalı</span></div>
  </div>

  <svg id="cluster" viewBox="0 0 180 180">
    <defs>
      <linearGradient id="gradSpd" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#5ac8e8"/>
        <stop offset="0.52" stop-color="#e8c05a"/>
        <stop offset="1" stop-color="#ff5a3c"/>
      </linearGradient>
      <linearGradient id="gradRpm" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#4a5568"/>
        <stop offset="0.76" stop-color="#c8d0dc"/>
        <stop offset="1" stop-color="#ff5a3c"/>
      </linearGradient>
    </defs>
    <circle class="dial-bg" cx="90" cy="90" r="84"/>
    <g id="ticks"></g>
    <path id="rpmArc" d="" stroke="url(#gradRpm)"/>
    <path id="spdArc" d="" stroke="url(#gradSpd)"/>
    <text id="spdNum" x="90" y="94" text-anchor="middle">0</text>
    <text id="spdUnit" x="90" y="109" text-anchor="middle">KM/H</text>
    <text id="gearNum" x="136" y="146" text-anchor="middle">N</text>
    <text id="gearLbl" x="136" y="156" text-anchor="middle">VİTES</text>
    <text id="rpmMini" x="44" y="146" text-anchor="middle">0</text>
  </svg>

  <div id="shift"></div>

  <!-- ── powertrain telemetry: what the engine and gearbox are doing ───── -->
  <div id="power">
    <div class="pw-row">
      <span class="pw-k">GÜÇ</span>
      <span class="pw-v" id="pwPower">0</span>
      <span class="pw-u">hp</span>
    </div>
    <div class="pw-bar"><i id="pwPowerBar"></i></div>
    <div class="pw-row">
      <span class="pw-k">TORK</span>
      <span class="pw-v" id="pwTorque">0</span>
      <span class="pw-u">Nm</span>
    </div>
    <div class="pw-bar"><i id="pwTorqueBar"></i></div>
    <div class="pw-row">
      <span class="pw-k">ÇEKİŞ</span>
      <span class="pw-v" id="pwForce">0</span>
      <span class="pw-u">N</span>
    </div>
    <div class="pw-bar"><i id="pwForceBar"></i></div>
    <div class="pw-row pw-small">
      <span class="pw-k">TUTUŞ</span>
      <span class="pw-v" id="pwGrip">0%</span>
      <span class="pw-k pw-tc" id="pwTc">TC</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════
     TOUCH CONTROLS — laid out the way a mobile driving game lays them out.
     Left thumb: power steering.  Right thumb: throttle / brake / handbrake.
     Small utility keys along the top right.  Nothing overlaps the HUD.
     ══════════════════════════════════════════════════════════════════════ -->
<div id="touch">

  <!-- ── steering: a paddle each side of a live angle read-out ─────────── -->
  <div id="steerWrap">
    <div class="spad" id="padL" data-act="left" aria-label="sola">
      <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>
    </div>
    <div id="steerGauge">
      <svg viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" class="sg-track"/>
        <path id="sgArc" class="sg-arc" d=""/>
        <line id="sgNeedle" x1="30" y1="30" x2="30" y2="12" class="sg-needle"/>
      </svg>
    </div>
    <div class="spad" id="padR" data-act="right" aria-label="sağa">
      <svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg>
    </div>
  </div>

  <!-- ── pedals: throttle above brake, on the right thumb ──────────────── -->
  <div id="pedalWrap">
    <div class="pedal" id="padGas" data-act="gas" aria-label="gaz">
      <svg viewBox="0 0 24 24"><path d="M12 19 L12 6 M6 12 L12 6 L18 12"/></svg>
      <span class="pedal-lbl">GAZ</span>
      <i class="pedal-fill" id="gasFill"></i>
    </div>
    <div class="pedal" id="padBrake" data-act="brake" aria-label="fren">
      <svg viewBox="0 0 24 24"><path d="M6 12 L18 12"/></svg>
      <span class="pedal-lbl">FREN</span>
      <i class="pedal-fill" id="brakeFill"></i>
    </div>
  </div>

  <!-- ── handbrake: a wide bar above the pedals, where a thumb reaches ─── -->
  <div class="chip-btn" id="padHB" data-act="hb">
    <svg viewBox="0 0 24 24"><path d="M12 4 L12 20 M5 11 L12 4 L19 11"/></svg>
    <span>EL FRENİ</span>
  </div>

  <!-- ── utility keys, top right, clear of the gauges ──────────────────── -->
  <div id="utilWrap">
    <div class="util" id="padCam" data-act="cam">
      <svg viewBox="0 0 24 24"><path d="M4 8h4l2-2h4l2 2h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg>
    </div>
    <div class="util" id="padReset" data-act="reset">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
    </div>
  </div>
</div>

<div id="debug"></div>

<div id="help">
  <b>W/S</b> gaz·fren &nbsp; <b>A/D</b> direksiyon &nbsp; <b>Space</b> el freni &nbsp;
  <b>T</b> oto/manuel &nbsp; <b>Shift/Ctrl</b> vites &nbsp; <b>B</b> ABS &nbsp;
  <b>L</b> far &nbsp; <b>C</b> kamera &nbsp; <b>R</b> sıfırla &nbsp; <b>F1</b> teşhis
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';
try { boot(); } catch (e) { console.error(e); }
function boot() {


/* ══════════════════════════════════════════════════════════════════════════
   0.  BOOT PLUMBING
   ══════════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const UI = { msg: $('msg'), bar: $('bar').firstElementChild, load: $('load') };

function step(pct, text) {
  UI.bar.style.width = pct + '%';
  if (text) UI.msg.textContent = text;
}
function fail(err) {
  console.error(err);
  UI.msg.className = 'err';
  UI.msg.textContent = 'Başlatılamadı: ' + (err && err.message ? err.message : err);
}

/* ══════════════════════════════════════════════════════════════════════════
   2.  MATH
   ══════════════════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const approach = (cur, tgt, rate) => cur + clamp(tgt - cur, -rate, rate);
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

let _seed = 0x5A17;
const rnd = () => { _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5; return ((_seed >>> 0) % 100000) / 100000; };
const rrnd = (a, b) => a + rnd() * (b - a);

/* ══════════════════════════════════════════════════════════════════════════
   3.  NOISE
   ══════════════════════════════════════════════════════════════════════════ */
const PERM = (() => {
  const p = new Uint8Array(512), t = new Uint8Array(256);
  let s = 1337;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 256; i++) t[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = t[i]; t[i] = t[j]; t[j] = tmp; }
  for (let i = 0; i < 512; i++) p[i] = t[i & 255];
  return p;
})();

const _fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function _grad(h, x, y) {
  switch (h & 7) {
    case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
    case 4: return x; case 5: return -x; case 6: return y; default: return -y;
  }
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const X = xi & 255, Y = yi & 255;
  const xf = x - xi, yf = y - yi;
  const u = _fade(xf), v = _fade(yf);
  const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1];
  const ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
  const x1 = lerp(_grad(aa, xf, yf), _grad(ba, xf - 1, yf), u);
  const x2 = lerp(_grad(ab, xf, yf - 1), _grad(bb, xf - 1, yf - 1), u);
  return lerp(x1, x2, v);
}
function fbm(x, y, oct = 4) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += noise2(x * f, y * f) * a; n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

/* ══════════════════════════════════════════════════════════════════════════
   4.  TRACK
   ══════════════════════════════════════════════════════════════════════════ */
const TRACK = {
  width: 11.5,
  kerbW: 1.15,
  pts: [
    [0, -96], [64, -104], [118, -84], [142, -40],
    [138, 8], [112, 44], [146, 80], [140, 124],
    [98, 150], [42, 142], [0, 118], [-46, 126],
    [-92, 112], [-124, 74], [-136, 26], [-122, -22],
    [-136, -62], [-112, -100], [-58, -110],
  ],
  /* the track climbs and falls around the lap — these are the coefficients
     of a periodic elevation function in arc-length space (see elevAt) */
  elevA: 4.5, elevB: 2.0,
  ramp: { x: -118, z: 96, len: 16, w: 9, h: 2.0 },
  bumps: [{ x: 152, z: -62 }, { x: -128, z: 50 }, { x: 42, z: 132 }],
  puddles: [
    { x: 126, z: 62, r: 5.5 },
    { x: -70, z: -92, r: 4.8 },
    { x: -20, z: 130, r: 6.2 },
  ],
  gravel: { x: 26, z: -28, r: 27 },
};

const PATH = (() => {
  const cps = TRACK.pts.map(([x, z]) => new THREE.Vector3(x, 0, z));
  const curve = new THREE.CatmullRomCurve3(cps, true, 'centripetal', 0.5);
  const N = 1000;
  const samples = curve.getSpacedPoints(N);
  samples.pop();
  const len = curve.getLength();
  const tang = samples.map((p, i) => {
    const a = samples[(i - 1 + samples.length) % samples.length];
    const b = samples[(i + 1) % samples.length];
    return new THREE.Vector3().subVectors(b, a).normalize();
  });
  const CELL = 18;
  const buckets = new Map();
  samples.forEach((p, i) => {
    const k = Math.floor(p.x / CELL) + ',' + Math.floor(p.z / CELL);
    let arr = buckets.get(k);
    if (!arr) { arr = []; buckets.set(k, arr); }
    arr.push(i);
  });
  return { curve, samples, tang, len, buckets, CELL, N: samples.length };
})();

const _near = { i: 0, dist: 0, lateral: 0, s: 0 };
function nearestOnPath(x, z) {
  const CELL = PATH.CELL;
  const ci = Math.floor(x / CELL), cj = Math.floor(z / CELL);
  let best = -1, bestD2 = Infinity;
  for (let ring = 0; ring <= 2; ring++) {
    for (let dx = -ring; dx <= ring; dx++) {
      for (let dz = -ring; dz <= ring; dz++) {
        if (ring > 0 && Math.abs(dx) !== ring && Math.abs(dz) !== ring) continue;
        const list = PATH.buckets.get((ci + dx) + ',' + (cj + dz));
        if (!list) continue;
        for (let n = 0; n < list.length; n++) {
          const idx = list[n], p = PATH.samples[idx];
          const d2 = (p.x - x) ** 2 + (p.z - z) ** 2;
          if (d2 < bestD2) { bestD2 = d2; best = idx; }
        }
      }
    }
    if (best >= 0 && ring >= 1) break;
  }
  if (best < 0) {
    for (let i = 0; i < PATH.samples.length; i++) {
      const p = PATH.samples[i];
      const d2 = (p.x - x) ** 2 + (p.z - z) ** 2;
      if (d2 < bestD2) { bestD2 = d2; best = i; }
    }
  }
  const p = PATH.samples[best], tg = PATH.tang[best];
  const ox = x - p.x, oz = z - p.z;
  _near.i = best;
  _near.dist = Math.sqrt(bestD2);
  _near.lateral = tg.z * ox - tg.x * oz;
  _near.s = best / PATH.N;
  return _near;
}

/* ── altitude of the racing surface, as a smooth periodic function of the
      normalised arc length.  Two harmonics are enough for a believable lap
      with a climb, a crest and a dip, and it closes the loop exactly. ── */
function elevAt(t) {
  /* f(0) === f(1) because both terms have integer frequency */
  return TRACK.elevA * Math.sin(TAU * t)
       + TRACK.elevB * Math.sin(TAU * 2 * t + 1.15);
}

/* ── terrain height ─────────────────────────────────────────────────────── */
function terrainHeight(x, z) {
  const n = nearestOnPath(x, z);
  const halfW = TRACK.width * 0.5;
  const away = Math.max(0, n.dist - halfW);

  /* the road surface is the reference plane; everything else grows from it */
  let h = elevAt(n.s);

  let add = 0;
  const rise = smoothstep(3, 46, away);
  add += rise * (fbm(x * 0.0105, z * 0.0105, 4) * 3.4 + 0.45);
  add += rise * fbm(x * 0.042, z * 0.042, 3) * 0.5;
  add *= smoothstep(0, 4.2, away);

  /* the gravel pad is flattened so drifting is predictable */
  const G = TRACK.gravel;
  const gd = Math.hypot(x - G.x, z - G.z);
  if (gd < G.r + 10) {
    const padH = elevAt(nearestOnPath(G.x, G.z).s) + 0.55;
    const k = smoothstep(G.r * 0.62, G.r * 0.98, gd);
    add = lerp(add * 0.15, add, k);
    h = lerp(padH, h, smoothstep(G.r * 0.62, G.r * 1.25, gd)) + add;
    return h;
  }
  h += add;

  /* ramp — wedge along +X, road-aligned */
  const R = TRACK.ramp;
  if (Math.abs(z - R.z) < R.w * 0.5 && x > R.x && x < R.x + R.len) {
    const t = (x - R.x) / R.len;
    h += R.h * t * t;
  }
  if (Math.abs(z - R.z) < R.w * 0.5 && x >= R.x + R.len && x < R.x + R.len + 4) {
    h += R.h * (1 - smoothstep(0, 4, x - R.x - R.len));
  }

  /* speed bumps: shallow humps sitting on the asphalt, judged by path distance */
  if (n.dist < halfW + 2) {
    for (let b = 0; b < TRACK.bumps.length; b++) {
      const B = TRACK.bumps[b];
      const d = Math.hypot(x - B.x, z - B.z);
      if (d < 2.2) h += 0.115 * Math.cos((d / 2.2) * Math.PI * 0.5) ** 2;
    }
  }
  return h;
}

/* ── surface at a point ─────────────────────────────────────────────────── */
function surfaceAt(x, z) {
  const n = nearestOnPath(x, z);
  const halfW = TRACK.width * 0.5;

  if (n.dist < halfW) {
    /* puddles carve into the asphalt */
    for (let i = 0; i < TRACK.puddles.length; i++) {
      const P = TRACK.puddles[i];
      if (Math.hypot(x - P.x, z - P.z) < P.r) return 'wet';
    }
    return 'asphalt';
  }
  if (n.dist < halfW + TRACK.kerbW) return 'kerb';

  const G = TRACK.gravel;
  if (Math.hypot(x - G.x, z - G.z) < G.r) return 'gravel';

  /* a gravel shoulder hugging the road before the grass takes over */
  if (n.dist < halfW + 4.0) return 'gravel';

  return 'grass';
}

/* wet is asphalt with reduced grip — derived rather than duplicated */
const WET = { mu: 0.58, roll: 1.05, dust: 0.0, smoke: 0.10 };
function surfProps(key) {
  if (key === 'wet') return WET;
  return SURFACES[key] || SURFACES.grass;
}

/* ══════════════════════════════════════════════════════════════════════════
   PROCEDURAL ENVIRONMENT MAP
   ══════════════════════════════════════════════════════════════════════════
   Without an environment map, every metal surface in the scene has nothing to
   reflect, so chrome reads as flat grey plastic and paint has no depth.  This
   is the single biggest reason a Three.js car looks "CGI" instead of like the
   reference photography: the reference has sky, horizon and ground bouncing
   off every panel.

   Rather than ship an HDR file (the brief says one self-contained file, no
   external assets), the environment is painted into a canvas — sky gradient,
   a warm horizon band, a darker ground half and a soft sun disc — then run
   through PMREMGenerator so it produces properly pre-filtered roughness
   levels.  It costs a few milliseconds once at boot.                       */
step(44, 'ışıklandırma hazırlanıyor…');

function buildEnvironment() {
  const W = 512, H = 256;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  /* upper half: sky, deep at the zenith fading to pale at the horizon */
  const sky = g.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0.00, '#2a4f7c');
  sky.addColorStop(0.45, '#7fa3c8');
  sky.addColorStop(0.80, '#c8d6e2');
  sky.addColorStop(1.00, '#e8eef4');
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H * 0.5);

  /* lower half: the ground bounce.  Warm asphalt/dirt, much darker than the
     sky, which is what gives the car its dark underside reflections. */
  const ground = g.createLinearGradient(0, H * 0.5, 0, H);
  ground.addColorStop(0.00, '#8d8b84');
  ground.addColorStop(0.35, '#5c5a54');
  ground.addColorStop(1.00, '#2b2a27');
  g.fillStyle = ground;
  g.fillRect(0, H * 0.5, W, H * 0.5);

  /* the sun: a tight bright disc with a wide bloom, up and to the left so it
     lines up with the key light in the scene */
  const sunX = W * 0.26, sunY = H * 0.20;
  const bloom = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.42);
  bloom.addColorStop(0.00, 'rgba(255,252,240,1.00)');
  bloom.addColorStop(0.06, 'rgba(255,246,224,0.85)');
  bloom.addColorStop(0.28, 'rgba(255,238,200,0.28)');
  bloom.addColorStop(1.00, 'rgba(255,236,196,0.00)');
  g.fillStyle = bloom;
  g.fillRect(0, 0, W, H);

  /* a warm band right on the horizon, the way low sun lights the haze */
  const hazeBand = g.createLinearGradient(0, H * 0.44, 0, H * 0.56);
  hazeBand.addColorStop(0, 'rgba(255,226,178,0.00)');
  hazeBand.addColorStop(0.5, 'rgba(255,222,170,0.55)');
  hazeBand.addColorStop(1, 'rgba(255,214,158,0.00)');
  g.fillStyle = hazeBand;
  g.fillRect(0, H * 0.44, W, H * 0.12);

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;

  /* PMREMGenerator needs a real WebGL context.  Guard it so a headless or
     otherwise degraded context degrades to "no reflections" instead of
     taking the whole scene down. */
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    const envRT = pmrem.fromEquirectangular(tex);
    tex.dispose();
    pmrem.dispose();
    return envRT.texture;
  } catch (err) {
    console.warn('environment map unavailable:', err && err.message);
    tex.dispose();
    return null;
  }
}

function canvasTex(size, draw) {
  const cv = document.createElement('canvas');

/* ══════════════════════════════════════════════════════════════════════════
   8.  ROAD / KERBS / START LINE
   ══════════════════════════════════════════════════════════════════════════
   A ribbon is swept along the spline.  Each slice asks the same
   terrainHeight() the physics uses, so the visible road can never drift away
   from the surface the wheels are riding on.
   ══════════════════════════════════════════════════════════════════════════ */
function ribbonGeometry(offsets, yLift, vTiles) {
  /* offsets = [leftEdge, rightEdge] as signed metres from the centreline,
     positive = the car's left when travelling forwards */
  const N = PATH.N;
  const nOff = offsets.length;
  const verts = new Float32Array((N + 1) * nOff * 3);
  const uvs = new Float32Array((N + 1) * nOff * 2);
  const idx = [];

  for (let i = 0; i <= N; i++) {
    const k = i % N;
    const p = PATH.samples[k], tg = PATH.tang[k];
    const lx = tg.z, lz = -tg.x;                  // left normal in XZ
    for (let j = 0; j < nOff; j++) {
      const off = offsets[j];
      const x = p.x + lx * off, z = p.z + lz * off;
      const vi = (i * nOff + j) * 3;
      verts[vi] = x;
      verts[vi + 1] = terrainHeight(x, z) + yLift;
      verts[vi + 2] = z;
      const ui = (i * nOff + j) * 2;
      uvs[ui] = j / (nOff - 1);
      uvs[ui + 1] = (i / N) * vTiles;
    }
    if (i < N) {
      for (let j = 0; j < nOff - 1; j++) {
        const a = i * nOff + j, b = a + nOff;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* lane markings: a dashed centre line and solid edges, painted as ribbons */
{
  const dashLen = 4.2, gapLen = 5.4, period = dashLen + gapLen;
  const total = PATH.len;
  const count = Math.floor(total / period);
  const dashGeos = [];

  for (let d = 0; d < count; d++) {
    const t0 = (d * period) / total;
    const t1 = (d * period + dashLen) / total;
    const segs = 4;
    const verts = [], idxs = [];
    for (let k = 0; k <= segs; k++) {
      const t = lerp(t0, t1, k / segs);
      const sIdx = Math.floor(t * PATH.N) % PATH.N;
      const p = PATH.samples[sIdx], tg = PATH.tang[sIdx];
      const hw = 0.075;
      verts.push(p.x + tg.z * hw, terrainHeight(p.x, p.z) + 0.045, p.z - tg.x * hw);
      verts.push(p.x - tg.z * hw, terrainHeight(p.x, p.z) + 0.045, p.z + tg.x * hw);
      if (k < segs) {
        const o = k * 2;
        idxs.push(o, o + 2, o + 1, o + 1, o + 2, o + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idxs);
    g.computeVertexNormals();
    dashGeos.push(g);
  }

  /* merge the dashes into one mesh by hand — cheaper than one draw call each */
  let vCount = 0, iCount = 0;
  dashGeos.forEach((g) => { vCount += g.attributes.position.count; iCount += g.index.count; });
  const mPos = new Float32Array(vCount * 3);
  const mIdx = new Uint32Array(iCount);
  let vo = 0, io = 0;
  dashGeos.forEach((g) => {
    mPos.set(g.attributes.position.array, vo * 3);
    const gi = g.index.array;
    for (let k = 0; k < gi.length; k++) mIdx[io + k] = gi[k] + vo;
    vo += g.attributes.position.count;
    io += gi.length;
    g.dispose();
  });
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
  merged.setIndex(new THREE.BufferAttribute(mIdx, 1));
  merged.computeVertexNormals();

  const lines = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({
    color: 0xd8d2c0, roughness: 0.7,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
  }));
  scene.add(lines);
}

/* ── cypress: a lathed spindle, the signature tree of the Anatolian verge ── */
function makeCypressGeometry() {
  const pts = [];
  for (let i = 0; i <= 9; i++) {
    const t = i / 9;
    const y = t * 7.6;
    const r = Math.sin(Math.pow(t, 0.58) * Math.PI) * 1.15 * (1 - t * 0.3) + 0.06;
    pts.push(new THREE.Vector2(Math.max(0.05, r), y));
  }
  return new THREE.LatheGeometry(pts, 8);
}

    const a = pts[i], b = pts[i + 1];
    if (a.distanceTo(b) > 70) continue;
    const seg = [];
    for (let k = 0; k <= 6; k++) {
      const t = k / 6;
      const p = a.clone().lerp(b, t);
      p.y -= Math.sin(t * Math.PI) * 0.9;
      seg.push(p);
    }
    scenery.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(seg), wireMat));
  }
}

/* ── rocks ───────────────────────────────────────────────────────────────── */
{
  const rockGeo = new THREE.DodecahedronGeometry(0.55, 0);
  const inst = new THREE.InstancedMesh(rockGeo, new THREE.MeshStandardMaterial({
    color: 0x7b7365, roughness: 0.98, flatShading: true,
  }), 80);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3();
  const col = new THREE.Color();
  for (let i = 0; i < 80; i++) {
    const s = Math.floor(rnd() * PATH.N);
    const p = PATH.samples[s], tg = PATH.tang[s];
    const side = rnd() < 0.5 ? 1 : -1;
    const off = side * (HALF_ROAD + rrnd(3.6, 14));
    const x = p.x + tg.z * off, z = p.z - tg.x * off;
    pos.set(x, terrainHeight(x, z) + 0.2, z);
    e.set(rrnd(0, TAU), rrnd(0, TAU), rrnd(0, TAU));
    q.setFromEuler(e);
    const sc = rrnd(0.5, 1.6);
    scl.set(sc, sc * rrnd(0.55, 1), sc);
    m.compose(pos, q, scl);
    inst.setMatrixAt(i, m);
    col.setHSL(0.1, 0.05, 0.30 + rnd() * 0.18);
    inst.setColorAt(i, col);
  }
  inst.castShadow = true;
  inst.receiveShadow = true;
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  scenery.add(inst);
}

/* ══════════════════════════════════════════════════════════════════════════
   11.  CAR MODEL  —  Tofaş Şahin / Fiat 131 (1980s Turkish family sedan)
   ══════════════════════════════════════════════════════════════════════════
   Model-space convention, used everywhere from here on:

        +Z = forward (nose)      +X = left      +Y = up
        origin = centre of mass, which sits COM_Y above the wheel centres

   The real car, measured off a side-on photograph and the published figures:

        length 4.37 m · width 1.65 m · height 1.36 m
        wheelbase 2.46 m · track 1.33 m
        ground clearance 0.18 m · belt line 0.95 m
        roof 1.36 m · scuttle 0.88 m · boot deck 0.93 m

   Wheel contact patches sit at y = -0.555, so every real-world height h in
   metres maps to model space as  y = h - 0.555.

   What makes the shape read as a 131 rather than a generic box:
     · a long glasshouse with THIN pillars — the car is mostly window
     · a bonnet that slopes DOWN toward the nose, not a flat slab
     · a short, high boot deck
     · black plastic bumpers (not chrome) with a body-colour rub strip
     · the C-pillar kinks forward at the base, so the rear screen is wide

   Everything that has to move, open or light up is a separate mesh.
   ══════════════════════════════════════════════════════════════════════════ */
step(48, 'araç modelleniyor…');

/* ── dimensions, in metres above the contact patch ───────────────────────── */
const CAR = {
  L: 4.37, W: 1.65, H: 1.36,
  WB: CFG.WHEELBASE,
  TRACK: CFG.TRACK,
  nose: 2.115,          // z of the front bumper face
  tail: -2.255,         // z of the rear bumper face
  sillH: 0.175,         // bottom of the painted body
  beltH: 0.95,          // window sill
  scuttleH: 0.88,       // base of the windscreen
  bonnetH: 0.885,       // bonnet at the scuttle
  bonnetNoseH: 0.80,    // bonnet at the nose (it slopes down)
  deckH: 0.93,          // boot lid
  roofH: 1.36,
  archR: 0.375,         // wheel arch radius — must clear a 0.305 m tyre
};

/* model-space Y for each of those heights */
const YG = (h) => h - 0.555;
const Y_SILL     = YG(CAR.sillH);
const Y_BELT     = YG(CAR.beltH);
const Y_SCUTTLE  = YG(CAR.scuttleH);
const Y_BONNET   = YG(CAR.bonnetH);
const Y_BONNET_N = YG(CAR.bonnetNoseH);
const Y_DECK     = YG(CAR.deckH);
const Y_ROOF     = YG(CAR.roofH);
const Y_ARCH     = YG(CAR.sillH);
/* the hub axis: wheel radius above the contact patch */
const Y_HUB      = YG(CFG.WHEEL_R);
/* the physics chassis check refers to the body underside by this name */
const Y_FLOOR = Y_SILL;

const HALF_W   = CAR.W / 2;
const Z_NOSE   = CAR.nose;
const Z_TAIL   = CAR.tail;
const AXLE_F   = CFG.WHEELBASE * 0.5;
const AXLE_R   = -CFG.WHEELBASE * 0.5;
const ARCH_R   = CAR.archR;

/* ── materials ───────────────────────────────────────────────────────────── */
/* ivory is the signature Şahin colour; the paint is a single-coat solid with
   a clearcoat on top so it catches a highlight along the shoulder line */
/* Ivory is the classic Şahin colour, but the specular has to work like the
   reference photography: a thin, hard clearcoat over a slightly glossy base,
   so the environment map reads as a crisp reflection rather than a smear. */
const PAINT = 0xe8e2d0;
const matPaint = new THREE.MeshPhysicalMaterial({
  color: PAINT, roughness: 0.22, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.06,
  envMapIntensity: 1.35,
});
const matTrim = new THREE.MeshStandardMaterial({
  color: 0x191a1c, roughness: 0.44, metalness: 0.20, envMapIntensity: 1.05,
});
const matBlack  = new THREE.MeshStandardMaterial({ color: 0x101113, roughness: 0.85 });
const matBumper = new THREE.MeshStandardMaterial({
  color: 0x1e1f22, roughness: 0.46, metalness: 0.15, envMapIntensity: 1.1,
});
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0x0e141c, roughness: 0.03, metalness: 0.0,
  transparent: true, opacity: 0.58,
  clearcoat: 1.0, clearcoatRoughness: 0.0,
  envMapIntensity: 2.2, side: THREE.DoubleSide,
});
const matChrome = new THREE.MeshStandardMaterial({
  color: 0xdfe6ee, roughness: 0.055, metalness: 1.0, envMapIntensity: 1.9,
});
const matSteel = new THREE.MeshStandardMaterial({
  color: 0xa8b0ba, roughness: 0.30, metalness: 0.95, envMapIntensity: 1.5,
});
const matRubber = new THREE.MeshStandardMaterial({ color: 0x16171a, roughness: 0.94 });
const matSeat   = new THREE.MeshStandardMaterial({ color: 0x4a4038, roughness: 0.97 });
const matDash   = new THREE.MeshStandardMaterial({ color: 0x25211d, roughness: 0.96 });
const matSeam   = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.42 });
const matHeadlamp = new THREE.MeshPhysicalMaterial({
  color: 0xf4f1e6, roughness: 0.06, metalness: 0.06,
  emissive: 0x4a4438, emissiveIntensity: 0.35, clearcoat: 1.0,
});
const matAmber  = new THREE.MeshPhysicalMaterial({ color: 0xc4701a, roughness: 0.22, clearcoat: 0.7 });
const matTailLens = new THREE.MeshPhysicalMaterial({
  color: 0x8b1d14, roughness: 0.15,
  emissive: 0x2a0704, emissiveIntensity: 0.22, clearcoat: 0.8,
});

/* ── the root nodes ──────────────────────────────────────────────────────── */
const carRoot = new THREE.Group();
scene.add(carRoot);

/* carVisual holds the sprung body: everything that rolls, pitches and squats */
const carVisual = new THREE.Group();
carRoot.add(carVisual);

/* ══════════════════════════════════════════════════════════════════════════
   THE SHELL — extruded side silhouette with the wheel arches cut out
   ══════════════════════════════════════════════════════════════════════════
   The silhouette is drawn from the rear bottom corner, anticlockwise over
   the roof and down the nose, then back along the floor.  Walking the floor
   gives the two arch notches somewhere to live: `absarc` with clockwise=false
   sweeps a half-circle UP into the body, which is exactly a wheel arch.
   ══════════════════════════════════════════════════════════════════════════ */
function buildSilhouette() {
  const sh = new THREE.Shape();

  /* ── the LOWER BODY only — sill to belt line ────────────────────────────
     The greenhouse is built from separate pillars, glass and roof panels.
     Extruding the full outline would produce a solid block up to the roof
     and the glass would be sealed inside it, which is exactly what made the
     first attempt look like a moulded slab rather than a car.            */
  sh.moveTo(Z_TAIL + 0.115, Y_SILL);          // rear bumper tuck, low
  sh.lineTo(Z_TAIL + 0.09, Y_DECK - 0.055);   // rear panel, rising
  sh.lineTo(Z_TAIL + 0.055, Y_DECK);          // boot lip
  sh.lineTo(-1.45, Y_DECK + 0.004);           // boot lid — short and flat
  sh.lineTo(-1.30, Y_BELT);                   // up onto the belt line
  sh.lineTo(0.30, Y_BELT + 0.004);            // door tops, very slightly rising
  sh.lineTo(0.615, Y_BELT);                   // belt line meets the A-pillar
  sh.lineTo(0.645, Y_SCUTTLE);                // scuttle / wiper panel
  sh.lineTo(0.98, Y_SCUTTLE - 0.002);
  sh.lineTo(1.86, Y_BONNET_N);                // bonnet, sloping DOWN to the nose
  sh.quadraticCurveTo(Z_NOSE - 0.035, Y_BONNET_N - 0.006,
                      Z_NOSE - 0.045, Y_BONNET_N - 0.055);  // nose rounds off
  sh.lineTo(Z_NOSE - 0.05, Y_SCUTTLE - 0.295); // grille panel
  sh.lineTo(Z_NOSE - 0.075, Y_SILL + 0.02);    // front valance
  /* The two wheel arches.  They are rooted at the HUB height (not the sill):
     the hub sits 0.15 m above the sill, so a semicircle drawn from the sill
     cannot reach over the tyre and merely scallops the paint.  Rooted at the
     hub, a 0.375 m arc clears a 0.305 m tyre with 70 mm to spare — exactly
     the gap a real car shows — and the wall below the sill is left open,
     which is where the tyre lives.

     Walked as explicit segments: `absarc` here kept bulging the wrong way
     because the shape's winding and the sweep direction must agree, and this
     is easier to reason about than fighting that. */
  const ARC_SEGS = 16;
  const r = ARCH_R;
  /* An arch is a doorway, not a scallop: from the sill it rises straight up
     to the hub line on one side, sweeps a half circle over the tyre, then
     drops back to the sill on the other side.  Cutting it this way leaves the
     tyre's whole upper half standing in open air. */
  const arch = (zc) => {
    sh.lineTo(zc + r, Y_SILL);      // we arrive along the floor
    sh.lineTo(zc + r, Y_HUB);       // straight up the trailing edge
    for (let i = 1; i <= ARC_SEGS; i++) {
      const a = (i / ARC_SEGS) * Math.PI;
      sh.lineTo(zc - r * Math.cos(a), Y_HUB + r * Math.sin(a));
    }
    sh.lineTo(zc - r, Y_SILL);      // straight back down the leading edge
  };
  arch(AXLE_F);      // nose → tail along the floor, so front arch first
  arch(AXLE_R);
  sh.lineTo(Z_TAIL + 0.115, Y_SILL);
  sh.closePath();
  return sh;
}

/* the shell is slightly narrower than the car: the doors sit proud of it and
   bring the total width up to 1.65 m */
const BODY_W = CAR.W - 0.115;
const shellGeo = new THREE.ExtrudeGeometry(buildSilhouette(), {
  depth: BODY_W, bevelEnabled: true,
  bevelThickness: 0.018, bevelSize: 0.020, bevelSegments: 2,
  curveSegments: 12,
});
/* ExtrudeGeometry lays the shape in the XY plane and extrudes along +Z.
   Our silhouette is authored in (z, y) and must be extruded across X, so:
     rotateY(-90°) maps  x→-z,  z→x   (silhouette z becomes world x)
   then shift the result so the extrusion is centred on the car's axis. */
shellGeo.rotateY(-Math.PI / 2);
shellGeo.translate(BODY_W / 2, 0, 0);
shellGeo.computeVertexNormals();

const shell = new THREE.Mesh(shellGeo, matPaint);
shell.castShadow = true;
shell.receiveShadow = true;
carVisual.add(shell);

/* ── the roof: a slightly domed panel spanning the cabin ───────────────────── */
{
  const ROOF_W = BODY_W - 0.012;
  const roofV = new Float32Array([
    -ROOF_W / 2, Y_ROOF - 0.020, -0.735,
     ROOF_W / 2, Y_ROOF - 0.020, -0.735,
     ROOF_W / 2, Y_ROOF - 0.020,  0.315,
    -ROOF_W / 2, Y_ROOF - 0.020,  0.315,
    /* a shallow crown, 18 mm higher in the middle */
    -ROOF_W / 2, Y_ROOF + 0.008, -0.210,
     ROOF_W / 2, Y_ROOF + 0.008, -0.210,
  ]);
  const roofGeo = new THREE.BufferGeometry();
  roofGeo.setAttribute('position', new THREE.BufferAttribute(roofV, 3));
  roofGeo.setIndex([
    0, 1, 5, 0, 5, 4,      // left half of the crown
    4, 5, 2, 4, 2, 3,      // right half
  ]);
  roofGeo.computeVertexNormals();
  const roof = new THREE.Mesh(roofGeo, matPaint);
  roof.material = matPaint;
  roof.castShadow = true;
  carVisual.add(roof);

  /* the roof underside, so the headlining is not floating in the open */
  const under = new THREE.Mesh(
    new THREE.BoxGeometry(ROOF_W - 0.02, 0.012, 1.02), matDash);
  under.position.set(0, Y_ROOF - 0.030, -0.210);
  carVisual.add(under);
}

/* ══════════════════════════════════════════════════════════════════════════
   THE GLASSHOUSE
   ══════════════════════════════════════════════════════════════════════════
   The side glass is a single wide pane per side, inset from the shell, with
   thin painted pillars laid over it.  That is how the real car reads: from
   most angles you see window, not metal.
   ══════════════════════════════════════════════════════════════════════════ */
const GLASS_X = HALF_W - 0.075;         // just inside the door skin
const glassPanes = [];

/* helper: a flat quad in the X plane, given its four (z,y) corners */
function paneGeometry(corners) {
  const v = new Float32Array([
    0, corners[0][1], corners[0][0],
    0, corners[1][1], corners[1][0],
    0, corners[2][1], corners[2][0],
    0, corners[3][1], corners[3][0],
  ]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(v, 3));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  g.computeVertexNormals();
  return g;
}

[-1, 1].forEach((side) => {
  /* one long side pane from the A-pillar to the C-pillar, split by a thin
     B-pillar so it reads as two doors */
  const fwd = paneGeometry([
    [0.585, Y_BELT],
    [0.605, Y_ROOF - 0.030],
    [-0.145, Y_ROOF - 0.026],
    [-0.145, Y_BELT],
  ]);
  const fm = new THREE.Mesh(fwd, matGlass);
  fm.position.x = side * GLASS_X;
  carVisual.add(fm);
  glassPanes.push(fm);

  const aft = paneGeometry([
    [-0.215, Y_BELT],
    [-0.215, Y_ROOF - 0.026],
    [-0.735, Y_ROOF - 0.030],
    [-0.845, Y_DECK + 0.055],
  ]);
  const am = new THREE.Mesh(aft, matGlass);
  am.position.x = side * GLASS_X;
  carVisual.add(am);
  glassPanes.push(am);
});

/* windscreen: a single pane from the scuttle up to the header rail */
{
  const hw = HALF_W - 0.115;
  const wv = new Float32Array([
    -hw, Y_SCUTTLE + 0.006, 0.645,
     hw, Y_SCUTTLE + 0.006, 0.645,
     hw, Y_ROOF - 0.030, 0.315,
    -hw, Y_ROOF - 0.030, 0.315,
  ]);
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.BufferAttribute(wv, 3));
  wg.setIndex([0, 1, 2, 0, 2, 3]);
  wg.computeVertexNormals();
  const ws = new THREE.Mesh(wg, matGlass);
  carVisual.add(ws);
  glassPanes.push(ws);
}

/* rear screen */
{
  const hw = HALF_W - 0.120;
  const rv = new Float32Array([
    -hw, Y_DECK + 0.020, -1.435,
     hw, Y_DECK + 0.020, -1.435,
     hw, Y_ROOF - 0.014, -0.735,
    -hw, Y_ROOF - 0.014, -0.735,
  ]);
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.BufferAttribute(rv, 3));
  rg.setIndex([0, 1, 2, 0, 2, 3]);
  rg.computeVertexNormals();
  const rs = new THREE.Mesh(rg, matGlass);
  carVisual.add(rs);
  glassPanes.push(rs);
}

/* ── pillars, laid OVER the glass so they read as metal ──────────────────── */
{
  const PILL_W = 0.052;              // how wide a pillar looks from the side
  const px = HALF_W - 0.062;

  [-1, 1].forEach((side) => {
    /* A-pillar, following the windscreen rake */
    const ap = new THREE.Mesh(new THREE.BoxGeometry(0.030, 0.52, PILL_W), matPaint);
    ap.position.set(side * px, Y_SCUTTLE + 0.245, 0.625);
    ap.rotation.x = -0.62;
    carVisual.add(ap);

    /* B-pillar */
    const bp = new THREE.Mesh(
      new THREE.BoxGeometry(0.028, Y_ROOF - Y_BELT, PILL_W), matPaint);
    bp.position.set(side * px, (Y_ROOF + Y_BELT) * 0.5, -0.180);
    carVisual.add(bp);

    /* C-pillar: wide at the base, kinked forward — the 131's signature */
    const cpV = new Float32Array([
      0, Y_BELT, -0.735,
      0, Y_ROOF - 0.012, -0.735,
      0, Y_ROOF - 0.012, -0.905,
      0, Y_DECK + 0.045, -1.400,
    ]);
    const cg = new THREE.BufferGeometry();
    cg.setAttribute('position', new THREE.BufferAttribute(cpV, 3));
    cg.setIndex([0, 1, 2, 0, 2, 3]);
    cg.computeVertexNormals();
    const cp = new THREE.Mesh(cg, matPaint);
    cp.position.x = side * px;
    carVisual.add(cp);

    /* the roof rail: a thin painted strip along the top of the glass */
    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(0.034, 0.030, 1.02), matPaint);
    rail.position.set(side * (HALF_W - 0.052), Y_ROOF - 0.012, -0.215);
    carVisual.add(rail);

    /* the chrome window surround at the belt line — every Şahin had one */
    const surround = new THREE.Mesh(
      new THREE.BoxGeometry(0.014, 0.016, 1.44), matChrome);
    surround.position.set(side * (HALF_W - 0.048), Y_BELT + 0.004, -0.090);
    carVisual.add(surround);

}

/* ══════════════════════════════════════════════════════════════════════════
   DOORS — separate meshes, proud of the shell, with real shut lines
   ══════════════════════════════════════════════════════════════════════════ */
const doorGroups = [];
{
  const DOOR_H = Y_BELT - Y_SILL;          // sill to belt
  const DOOR_Y = Y_SILL + DOOR_H * 0.5;
  /* A door skin is a 24 mm panel laid ON the shell, not a plank beside it.
     dx is the panel centre, so half its thickness must not overhang the
     body — the old HALF_W - 0.012 put the outer face at 0.825, 5.8 cm clear
     of the 0.767 m shell. */
  const DOOR_T = 0.024;
  const dx = BODY_W / 2 - DOOR_T / 2 + 0.004;

  [-1, 1].forEach((side) => {
    /* front door */
    const f = new THREE.Mesh(new THREE.BoxGeometry(DOOR_T, DOOR_H, 1.03), matPaint);
    f.position.set(side * dx, DOOR_Y, 0.075);
    f.castShadow = true;
    carVisual.add(f);
    doorGroups.push(f);

    /* rear door */
    const r = new THREE.Mesh(new THREE.BoxGeometry(DOOR_T, DOOR_H, 0.96), matPaint);
    r.position.set(side * dx, DOOR_Y, -0.955);
    r.castShadow = true;
    carVisual.add(r);
    doorGroups.push(r);

    /* shut lines */
    [0.615, -0.455, -1.445, -1.905].forEach((z) => {
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(0.006, DOOR_H - 0.03, 0.010), matSeam);
      seam.position.set(side * (dx + side * 0.013), DOOR_Y, z);
      carVisual.add(seam);
    });

    /* the black rub strip that runs the length of the car at mid-height */
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.030, 2.62), matTrim);
    strip.position.set(side * (dx + side * 0.014), Y_SILL + DOOR_H * 0.52, -0.560);
    carVisual.add(strip);

    /* chrome door handles, just under the belt line */
    [0.175, -1.175].forEach((z) => {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.028, 0.155), matChrome);
      h.position.set(side * (dx + side * 0.018), Y_BELT - 0.065, z);
      carVisual.add(h);
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   BONNET / BOOT — separate panels, with the bonnet sloping to the nose
   ══════════════════════════════════════════════════════════════════════════ */
{
  /* the bonnet is a quad tilted to follow the shoulder line */
  const bw = BODY_W * 0.46;
  const bv = new Float32Array([
    -bw, Y_SCUTTLE + 0.008, 0.975,
     bw, Y_SCUTTLE + 0.008, 0.975,

  bg.setIndex([0, 1, 2, 0, 2, 3]);
  bg.computeVertexNormals();

  bonnet.castShadow = true;
  carVisual.add(bonnet);

  /* the 131's bonnet has a strong centre crease */
  const crease = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.014, 0.88), matTrim);
  crease.position.set(0, Y_BONNET - 0.020, 1.420);
  crease.rotation.x = -0.045;
  carVisual.add(crease);

  /* boot lid */
  const boot = new THREE.Mesh(new THREE.BoxGeometry(BODY_W * 0.9, 0.020, 0.78), matPaint);
  boot.position.set(0, Y_DECK + 0.006, -1.830);
  boot.castShadow = true;
  carVisual.add(boot);

  /* shut lines across the width */
  [[0.965, Y_SCUTTLE + 0.004], [-1.435, Y_DECK + 0.006]].forEach(([z, y]) => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(BODY_W * 0.88, 0.006, 0.012), matSeam);
    l.position.set(0, y, z);

}

/* ══════════════════════════════════════════════════════════════════════════
   FRONT FASCIA — the 131's face: wide grille, rectangular lamps
   ══════════════════════════════════════════════════════════════════════════ */
{
  /* the silhouette closes the nose at Z_NOSE - 0.045; sit the fascia just
     proud of that or the grille and lamps end up inside the shell */
  const gz = Z_NOSE - 0.022;
  const gy = Y_SCUTTLE - 0.175;

  /* the grille opening: a wide black recess with horizontal chrome slats */
  /* narrower than the lamp spacing, so the lamps sit outside it */
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.150, 0.024), matBlack);
  grille.position.set(0, gy, gz);
  carVisual.add(grille);
